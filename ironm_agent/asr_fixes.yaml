# 问答语音输入的纠错表（spec [2026-10-23] §199）：语音模型把健身词转错的，左边换成右边。
# 只收实测里真转错过的（11-09 用系统中文语音合成读健身问题测出来的）；会误伤日常说法的不收：
#   "我推"不能换成"卧推"（"我推荐"），"组合式"单独不换（只换"多少组合式"）。
# 长的先换，所以可以收短语。
fixes:
  无足每足: 五组每组
  做了无足: 做了五组
  每足: 每组
  RTE: RPE
  下拉链: 下拉练
  多少组合式: 多少组合适
  多少组合是: 多少组合适
  冲饥期: 冲击期
  力节: 力竭
  # 11-09 真人视频（体态矫正讲解）里转错的术语
  异状肩甲: 翼状肩胛
  异状肩胛: 翼状肩胛
  翼状肩甲: 翼状肩胛
  原肩含胸: 圆肩含胸
