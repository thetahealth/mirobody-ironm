  - id: mediterranean
    name: 地中海式
    goals: [health]
    summary: 橄榄油做菜、每天一小把坚果，多吃鱼、豆子、蔬菜和全麦，红肉少吃。
    suits:
      - 想吃得健康、心血管风险偏高（血脂高、有家族史）的成年人
      - 喜欢鱼、豆子和橄榄油口味的人
    not_for:
      - 坚果过敏的：不吃坚果，只用橄榄油那一半做法
      - 孕期、哺乳期、18 岁以下，有肾病或糖尿病在用药的：先问医生或营养师〔经验〕
    energy: 按你的每日热量目标吃。试验里每天约 4 汤匙橄榄油或 30 克坚果，而且不限热量〔K118〕；你要把油和坚果算进目标里，不额外加。
    macros:
      protein: 每天 1.4–2.0 克/公斤体重〔K09〕，鱼、豆类、蛋奶多一些，红肉少一些。
      carbs: 主食多选全麦面包、全麦意面、豆类〔经验〕。
      fat: 脂肪主要来自橄榄油、坚果和鱼，少吃肥肉、黄油和油炸〔经验〕。
    points:
      - 做菜、拌沙拉用橄榄油；每天一小把坚果，试验里是 30 克〔K118〕。
      - 每周至少吃 2 次水产〔K17〕。
      - 每周几顿用鹰嘴豆、扁豆、黑豆当主菜〔经验〕。
      - 试验里这样吃的人，主要心血管事件比只建议少吃脂肪的人少〔K118〕。
    days:
      weekday:
        早餐: {type: recipe, id: avocado-egg-toast, servings: 1}
        午餐: {type: recipe, id: chickpea-salad, servings: 1}
        晚餐: {type: recipe, id: salmon-quinoa, servings: 1}
        加餐: {type: recipe, id: nuts-apple-snack, servings: 1}
      weekend:
        早餐: {type: recipe, id: greek-yogurt-bowl, servings: 1}
        午餐: {type: recipe, id: lentil-tomato-soup, servings: 1}
        晚餐: {type: recipe, id: cod-tomato-pasta, servings: 1}
        加餐: {type: recipe, id: nuts-apple-snack, servings: 1}
    refs: [K09, K17, K118]

  - id: dash
    name: 控血压（DASH）
    goals: [blood_pressure, health]
    summary: 蔬菜水果多、低脂奶天天有、全谷物和豆类常吃，盐少放；吃药的照常吃药。
    suits:
      - 血压偏高（正常高值）或高血压、想用饮食帮着降压的成年人
      - 口味偏咸、想慢慢吃淡一点的人
    not_for:
      - 晚期肾病、血钾高、在吃保钾利尿药的：这份钾和奶多，先问医生
      - 在吃降压药的：照常吃药；血压降得太低、头晕时告诉医生
      - 孕期、哺乳期、18 岁以下：先问医生〔经验〕
    energy: 按你的每日热量目标吃；试验的食物份数是按每天 2000 千卡排的〔K119〕，目标不同时按比例多吃或少吃。
    macros:
      protein: 每天 1.4–2.0 克/公斤体重〔K09〕，鱼、禽、豆类、低脂奶为主，肉禽鱼每天不超过 6 份〔K119〕。
      carbs: 谷物每天 6–8 份，多选全谷物〔K119〕。
      fat: 低脂奶每天 2–3 份、油脂 2–3 份，少吃肥肉和油炸〔K119〕。
    points:
      - 钠每天不超过 2300 毫克，降到 1500 毫克降压更多〔K119〕；照中国指南，盐每天不超过 5 克〔K17〕。
      - 蔬菜、水果每天各 4–5 份〔K119〕。
      - 坚果、种子和豆类每周 4–5 份，甜食每周不超过 5 份〔K119〕。
      - 试验里低钠的 DASH 比高钠的一般吃法，高血压的人收缩压低 11.5 mmHg〔K119〕。
      - 少放酱油、咸菜、腌肉，多用醋、葱姜蒜和香料调味〔经验〕。
    days:
      weekday:
        早餐: {type: recipe, id: lowfat-milk-oats, servings: 1}
        午餐: {type: recipe, id: black-bean-chicken-bowl, servings: 1}
        晚餐: {type: recipe, id: steamed-chicken-yam, servings: 1}
        加餐: {type: recipe, id: lowfat-milk-kiwi, servings: 1}
      weekend:
        早餐: {type: recipe, id: soymilk-egg-toast, servings: 1}
        午餐: {type: recipe, id: lentil-tomato-soup, servings: 1}
        晚餐: {type: recipe, id: salmon-sweet-potato, servings: 1}
        加餐: {type: recipe, id: nuts-apple-snack, servings: 1}
    refs: [K09, K17, K119]

  - id: low-gi
    name: 控糖（血糖偏高）
    goals: [blood_sugar, health]
    summary: 主食定量、三分之一以上换成全谷物和杂豆，先吃菜再吃肉、最后吃主食，规律吃饭。
    suits:
      - 体检血糖偏高（糖尿病前期）的成年人
      - 2 型糖尿病、医生同意先从饮食和运动管的成年人
    not_for:
      - 在打胰岛素或吃促泌剂的：少吃主食、减重、加运动都可能低血糖，药要和医生一起调
      - 1 型糖尿病、妊娠糖尿病、偏瘦的：要个体方案，找医生或营养师〔K121〕
      - 有肾病的、18 岁以下、孕期哺乳期：先问医生〔经验〕
