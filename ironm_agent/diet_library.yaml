# 饮食方案库（spec [2026-11-06] §184）：每份是一整天怎么吃，工作日、周末各四顿（早餐、午餐、晚餐、加餐）。
# 每顿引用推荐食谱（recipes.yaml，type: recipe）或常见减脂餐（meals.yaml，type: preset），servings 是推荐份数；
# 套用时按他的热量目标缩放（每顿 0.5–3 份、取 0.5 的倍数），减脂餐（外卖、食堂）是一整份，不缩放。
#
# 字段：
#   goals    health 健康 / fat_loss 减脂 / muscle 增肌 / blood_pressure 控血压 / blood_sugar 控糖，主要的写在最前
#   summary  一句话说这份怎么吃
#   suits    适合谁；not_for 不适合谁、谁要先问医生或营养师（孕期、未成年、肾病、糖尿病用药不从方案库直接套）
#   energy   热量怎么定：他的热量目标里已经算了减脂缺口或增肌多吃的部分，这里不再另加减
#   macros   蛋白质、碳水、脂肪怎么分
#   points   吃法要点（3–6 条）
#   refs     依据库编号：正文里引用的编号都要写在这里，这里写的也都要在正文里引用
# 带数字的句子要有出处（〔K..〕），没有的写〔经验〕；出处编号只在内部留底，页面上不显示（§14）。
# 方案和要点用自己的话写，不抄原文，不写商标和品牌。内容由 Claude 整理，待审定。
version: "0.1"
review: claude_draft

plans:
  - id: balanced-home
    name: 均衡家常（膳食宝塔）
    goals: [health]
    summary: 照膳食指南的食物量吃，主食、蔬果、奶、鱼禽蛋肉、豆类每天都有，家里做得出来。
    suits:
      - 身体健康、想吃得均衡的成年人
      - 刚开始管饮食、不想算得太细的人
      - 体重已经合适、想保持的人
    not_for:
      - 孕期、哺乳期、18 岁以下：按专门的膳食指南，先问医生或营养师〔经验〕
      - 有肾病、糖尿病在用药，或者别的慢病正在治疗：先问医生或营养师
    energy: 按你的每日热量目标吃；目标已经按你的目标（减脂、增肌或保持）算好，这里不再另加减。
    macros:
      protein: 练力量的人每天 1.4–2.0 克/公斤体重〔K09〕，分到三餐，每餐 20–40 克〔K36〕。
      carbs: 谷类每天 200–300 克，其中全谷物和杂豆 50–150 克〔K17〕；剩下的热量主要给主食。
      fat: 烹调油每天 25–30 克〔K17〕，少吃油炸。
    points:
      - 蔬菜每天不少于 300 克、深色的占一半，水果 200–350 克〔K17〕。
      - 奶和奶制品每天 300–500 克，鱼禽蛋瘦肉 120–200 克，每周至少吃 2 次水产〔K17〕。
      - 盐每天不超过 5 克，添加糖不超过 50 克、最好在 25 克以下〔K17〕。
      - 每天喝水 1500–1700 毫升，首选白水〔K17〕。
    days:
      weekday:
        早餐: {type: recipe, id: millet-egg-spinach, servings: 1}
        午餐: {type: recipe, id: mushroom-chicken-rice, servings: 1.5}
        晚餐: {type: recipe, id: steamed-fish-meal, servings: 1}
        加餐: {type: recipe, id: yogurt-banana-snack, servings: 1}
      weekend:
        早餐: {type: recipe, id: zucchini-egg-pancake, servings: 1}
        午餐: {type: recipe, id: tomato-egg-noodles, servings: 1}
        晚餐: {type: recipe, id: tofu-veg-brown-rice, servings: 1}
        加餐: {type: recipe, id: lowfat-milk-kiwi, servings: 1}
    refs: [K09, K17, K36]

  - id: cut-home
    name: 减脂·高蛋白（家常）
    goals: [fat_loss]
    summary: 热量按减脂目标，蛋白质吃到高的一端，主食不断、换一部分全谷物，家里能做。
    suits:
      - 想减脂、自己做饭或家里有人做饭的成年人
      - 在练力量、想减脂时少掉肌肉的人
    not_for:
      - 孕期、哺乳期、18 岁以下：不做热量缺口，先问医生〔经验〕
      - 有肾病的：高蛋白不适用，先问医生〔K90〕
      - 糖尿病在用药、正在吃减重药的：热量和蛋白质请医生或营养师定
      - 已经很瘦的：不适合快速减〔K125〕
    energy: 按你的每日热量目标吃：减脂的缺口已经算在目标里（每天缺口不超过约 500 千卡〔K87〕），这里不再另减；每周掉体重的 0.5–1% 正合适〔K37〕。
    macros:
      protein: 每天 1.4–2.0 克/公斤体重，往高的一端吃〔K09〕；练力量、已经比较瘦的可以更高〔K37〕。
      carbs: 主食不断，练前练后那顿放主食〔经验〕；全谷物和杂豆每天 50–150 克〔K17〕。
      fat: 脂肪占热量的 20–30%〔K124〕，多用蒸、煮、炖，少油。
    points:
      - 每餐一份优质蛋白，20–40 克〔K36〕。
      - 蔬菜每天不少于 300 克〔K17〕；饿了先加蔬菜和清汤〔经验〕。
      - 体重看一周的平均，单天的起落不算数〔K97〕。
      - 饮料换成白水、茶或无糖的〔经验〕。
    days:
      weekday:
        早餐: {type: recipe, id: savory-oat-egg, servings: 1}
        午餐: {type: recipe, id: chicken-brown-rice, servings: 1}
        晚餐: {type: recipe, id: steamed-fish-meal, servings: 1}
        加餐: {type: recipe, id: greek-yogurt-bowl, servings: 1}
      weekend:
        早餐: {type: recipe, id: soymilk-egg-toast, servings: 1}
        午餐: {type: recipe, id: chicken-soba, servings: 1}
        晚餐: {type: recipe, id: shrimp-egg-custard, servings: 1}
        加餐: {type: recipe, id: egg-almond-snack, servings: 1}
    refs: [K09, K17, K36, K37, K87, K90, K97, K124, K125]

  - id: cut-takeout
    name: 减脂·外卖食堂
    goals: [fat_loss]
    summary: 不做饭也能减：外卖、食堂、便利店照着点，每顿先定蛋白质、主食减量、加一份蔬菜。
    suits:
      - 想减脂、平时吃外卖食堂便利店的上班族和学生
      - 没时间做饭、又不想称重算热量的人
    not_for:
      - 孕期、哺乳期、18 岁以下：不做热量缺口，先问医生〔经验〕
      - 有肾病的：高蛋白不适用，先问医生〔K90〕
      - 糖尿病在用药、正在吃减重药的：热量和蛋白质请医生或营养师定
    energy: 按你的每日热量目标吃：减脂的缺口已经算在目标里（每天不超过约 500 千卡〔K87〕），这里不再另减。外卖是一整份，缩放时只调加餐和自己做的那几顿。
    macros:
      protein: 每天 1.4–2.0 克/公斤体重，往高的一端吃〔K09〕，每顿先定一份肉、鱼、蛋或豆腐。
      carbs: 主食吃平时的一半左右，或者换成杂粮饭、红薯、玉米〔经验〕。
      fat: 少选油炸、干锅、红烧，酱汁另放、蘸着吃〔经验〕。
    points:
      - 鱼禽蛋瘦肉每天合计 120–200 克〔K17〕；荤菜选蒸、煮、炖的〔经验〕。
      - 每顿加一份蔬菜，一天不少于 300 克〔K17〕。
      - 汤少喝、酱少蘸，盐每天不超过 5 克〔K17〕。
      - 奶茶、含糖饮料换无糖的，添加糖每天最好在 25 克以下〔K17〕。
      - 体重看一周的平均，单天的起落不算数〔K97〕。
    days:
      weekday:
        早餐: {type: preset, id: store-sweet-potato, servings: 1}
        午餐: {type: preset, id: canteen-fish-two-veg, servings: 1}
        晚餐: {type: preset, id: takeout-chicken-rice, servings: 1}
        加餐: {type: recipe, id: yogurt-banana-snack, servings: 1}
      weekend:
        早餐: {type: preset, id: store-sandwich, servings: 1}
        午餐: {type: preset, id: takeout-poke, servings: 1}
        晚餐: {type: preset, id: store-oden, servings: 1}
        加餐: {type: recipe, id: lowfat-milk-kiwi, servings: 1}
    refs: [K09, K17, K87, K90, K97]

  - id: bulk-home
    name: 增肌·家常
    goals: [muscle]
    summary: 比维持多吃一点、蛋白质分到每一顿，练后那顿有肉有饭；家常菜做得出来。
    suits:
      - 想增肌、每周练 3 次以上力量的成年人〔经验〕
      - 偏瘦、想长点肉的人
    not_for:
      - 18 岁以下：按正常吃饱吃好，具体量先问医生〔经验〕
      - 有肾病的：高蛋白不适用，先问医生〔K90〕
      - 孕期、哺乳期、糖尿病在用药的：热量和蛋白质请医生或营养师定
    energy: 按你的每日热量目标吃：增肌多吃的部分已经算在目标里（比维持多 10–20%〔K88〕），这里不再另加；每周体重涨 0.25–0.5% 正合适〔K88〕，吃太多多长的主要是脂肪〔K89〕。
    macros:
      protein: 每天 1.6–2.2 克/公斤体重〔K88〕。
      carbs: 每天至少 3–5 克/公斤〔K88〕；每天练 1 小时左右的 5–7 克/公斤〔K38〕。
      fat: 每天 0.5–1.5 克/公斤〔K88〕，剩下的热量给主食。
    points:
      - 每 3–4 小时吃一次蛋白质，每次 20–40 克〔K36〕。
      - 练后两小时内吃一顿有蛋白质的饭〔K36〕。
      - 胃口小的，加一顿奶、蛋、坚果，比硬塞正餐容易〔经验〕。
      - 练了多年的，多吃的部分取低端〔K88〕。
    days:
