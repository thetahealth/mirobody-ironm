  - id: bulk-lunchbox
    name: 增肌·上班带饭
    goals: [muscle]
    summary: 前一晚做好两份，第二天带一份当午饭；早餐和加餐用奶、蛋、蛋白粉补蛋白质。
    suits:
      - 想增肌、中午在单位或学校吃饭的人
      - 愿意周末或前一晚花半小时做饭的人〔经验〕
    not_for:
      - 18 岁以下：按正常吃饱吃好，具体量先问医生〔经验〕
      - 有肾病的：高蛋白不适用，先问医生〔K90〕
      - 孕期、哺乳期、糖尿病在用药的：热量和蛋白质请医生或营养师定
    energy: 按你的每日热量目标吃：增肌多吃的部分已经算在目标里（比维持多 10–20%〔K88〕），这里不再另加；吃太多多长的主要是脂肪〔K89〕。
    macros:
      protein: 每天 1.6–2.2 克/公斤体重〔K88〕，早餐和加餐各有一份奶或蛋。
      carbs: 每天至少 3–5 克/公斤〔K88〕；每天练 1 小时左右的 5–7 克/公斤〔K38〕。
      fat: 每天 0.5–1.5 克/公斤〔K88〕。
    points:
      - 每顿 20–40 克蛋白质，隔 3–4 小时一次〔K36〕。
      - 做好立刻分盒、放冷藏，第二天吃完；吃前热透〔经验〕。
      - 带饭的蔬菜选西兰花、青椒、胡萝卜，叶菜放一夜容易发黄〔经验〕。
      - 练后两小时内吃一顿有蛋白质的饭〔K36〕。
