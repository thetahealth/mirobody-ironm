  wall-ball:
    - cue: 像从地上弹起来，把力量从腿一直传到手上把球送出去
      replaces: 下肢发力传导至上肢

  dumbbell-snatch:
    - cue: 像拉开割草机的启动绳，力量从腿一路传上来
      replaces: 髋部爆发伸展带动上拉

  high-knees:
    - cue: 脚下像踩着烫的沙子，落地轻轻一点就抬起来
      replaces: 前脚掌快速轻落地

  hip-flexor-stretch:
    - cue: 像把后腿那侧的胯慢慢往前推，屁股夹紧
      replaces: 伸髋拉伸髋屈肌

  hamstring-band-stretch:
    - cue: 像慢慢拉一根橡皮筋，感觉紧了就停住，不硬拽
      replaces: 温和静态拉伸

  quad-stretch:
    - cue: 两个膝盖像被绑在一起，往下指着地面
      replaces: 双膝并拢

  pigeon-stretch:
    - cue: 前腿像折叠起来的翅膀，身体慢慢趴下去
      replaces: 前倾加深拉伸

  calf-stretch:
    - cue: 后脚跟像钉在地上，身体慢慢往墙那边靠
      replaces: 足跟着地拉伸小腿

  knee-to-chest:
    - cue: 像把自己团成一个球，后背轻轻贴着地
      replaces: 屈髋屈膝放松腰背

  foam-roll-quads:
    - cue: 像用擀面杖慢慢擀面，酸的地方多擀几下
      replaces: 慢速滚压

  foam-roll-calves:
    - cue: 像用擀面杖擀小腿，酸的地方多停几秒
      replaces: 慢速滚压

  single-arm-pulldown:
    - cue: 手只是钩子，用手肘往身体侧下方插裤兜，拉到肩膀旁边就停
      replaces: 肘部下拉、背阔肌主导、拉至肩侧
    - cue: 先把肩膀往下放、离耳朵远一点，再开始拉
      replaces: 先沉肩再下拉

  towel-door-row:
    - cue: 身体像一块木板被门拉过去，别从屁股那里折
      replaces: 躯干保持直线
    - cue: 先把两边肩胛往中间挤，像要夹住一支笔，再弯手肘
      replaces: 肩胛后缩启动划船

  prone-pulldown:
    - cue: 手只是钩子，用手肘往裤兜里插，像趴着做引体向上
      replaces: 肘部下拉、背阔肌主导

  prone-y-raise:
    - cue: 两只大拇指朝天，像趴着比一个大大的 Y
      replaces: 肩外旋位做 Y 字举
    - cue: 肩膀往下放、离耳朵远一点，别耸
      replaces: 沉肩，避免上斜方肌代偿

  towel-curl:
    - cue: 脚和手在拔河：手往上拉，脚往下踩着不让它轻松上来
      replaces: 自我对抗提供阻力

  # 第三批（§144）
