      replaces: 上臂固定

  preacher-curl:
    - cue: 放下时像慢慢放下一桶水，不让它一下子掉下去
      replaces: 控制离心

  cable-curl:
    - cue: 手肘像门的合页，只有前臂这扇门在开关
      replaces: 肘关节为轴

  rope-pushdown:
    - cue: 压到底时像把绳子往两边甩开
      replaces: 底部分绳充分伸肘

  overhead-triceps-extension:
