# 动作库的体感提示（spec [2026-10-23] §8 体感讲解）：用身体感觉或生活里的类比讲动作要点，替代解剖术语。
# 普通人不知道"肩胛骨后缩下沉"是什么感觉，但"想象腋下夹着一张纸，别让它掉下来"一听就懂。
# cue：说给用户听的话（不出现解剖术语，不写阿拉伯数字）；
# replaces：它替代的书面说法，只给审定时对照（核对类比有没有把动作讲歪），不交给 Agent。
# 每个动作 1–3 条；编号与 exercises.yaml 对应；内容由 Claude 整理，待审定。
version: "0.1"
review: claude_draft

feel:
  bodyweight-squat:
    - cue: 像要坐到身后一把矮凳上：屁股往后、往下坐，膝盖和屁股一起弯
      replaces: 髋膝同时屈曲下蹲
    - cue: 脚底像三脚架：脚跟、大脚趾根、小脚趾根三个点一直踩住地
      replaces: 全脚掌着地，重心在脚掌中部
    - cue: 膝盖像两盏车灯，全程照着脚尖的方向，别往里照
      replaces: 膝关节对准脚尖方向，避免内扣

  goblet-squat:
    - cue: 像端着一锅热汤贴在胸前，一离开身体就会洒
      replaces: 重物始终贴着胸口
    - cue: 让对面的人一直能看到你衣服胸前的字，别把字对着地面
      replaces: 躯干尽量直立
    - cue: 蹲到底时用两个手肘把膝盖往外撑开
      replaces: 肘在膝内侧，膝关节对准脚尖

  box-squat:
    - cue: 想象箱子上放着一个鸡蛋：屁股往后找箱子，碰到就起来，别把鸡蛋坐碎
      replaces: 向后坐，轻触箱面即起，不坐实放松
    - cue: 小腿像插在地里的木桩，尽量竖着不往前倒
      replaces: 小腿尽量保持竖直

  back-squat:
    - cue: 蹲之前先把肚子绷紧，像要挨一拳那样，整个动作都别松
      replaces: 撑住腹压（不写憋气：血压高、孕期的人不能憋气发力）
    - cue: 杠铃像在一根竖着的电梯井里，只能直上直下，一直待在脚心正上方
      replaces: 杠铃在脚掌中部正上方垂直移动
    - cue: 起身时胸口和屁股一起往上走，别让屁股先跑、把人折成弯腰
      replaces: 起身时髋与肩同时上升，避免臀部先起

  romanian-deadlift:
    - cue: 像两手提着东西、用屁股去关身后的车门：屁股往后推，上身跟着自然前倾
      replaces: 髋关节向后折叠（髋铰链），不是弯腰
    - cue: 大腿后面像一根橡皮筋被慢慢拉长，拉到绷紧就往回，不用去够地面
      replaces: 下放到腘绳肌张力最大为止
    - cue: 重物像被磁铁吸在腿上，贴着大腿往下滑
      replaces: 重物贴腿走

  deadlift:
    - cue: 拉起来之前先把杠铃"拉紧"：像拖车前先把绳子绷直，身体绷住了再发力
      replaces: 先收紧背部和腹部、消除杠铃空隙再发力
    - cue: 别想着往上拽杠铃，想着用两只脚把地板往下推开
      replaces: 起始阶段腿部蹬地发力
    - cue: 站直的最后一下，屁股夹紧，像要用屁股夹住一枚硬币，别用腰往后仰
      replaces: 锁定时靠臀部伸髋，不过度后仰

  bulgarian-split-squat:
    - cue: 后脚只是搭在凳子上帮你保持平衡，像扶着栏杆一样，用力的是前脚
      replaces: 重心放在前脚，后脚只起平衡作用
    - cue: 身体像坐电梯，直直往下降、再直直升上来，别往前冲
      replaces: 垂直下降，避免膝盖过度前移、身体前冲

  reverse-lunge:
    - cue: 往后退一大步，像要单膝跪下去，后膝轻轻点向地面，像怕碰疼它
      replaces: 后撤下蹲至后膝接近地面，控制下放
    - cue: 前脚像钉在地上，用前脚踩地把自己"推"回原位
      replaces: 前腿发力起身

  glute-bridge:
    - cue: 用屁股把身体往上顶，顶到最高时像用屁股夹住一枚硬币，腰别帮忙
      replaces: 臀大肌发力伸髋，避免腰部代偿
    - cue: 顶到膝盖、屁股、肩膀连成一块斜着的木板就停，别再往上拱腰
      replaces: 伸髋至躯干与大腿成直线，避免腰椎过伸
    - cue: 用脚跟往下踩，像要在地板上踩出两个坑
      replaces: 脚跟发力，减少大腿前侧代偿

  step-up:
    - cue: 像只用一条腿上一级很高的楼梯：台阶上那只脚把你"拎"上去，地上那只脚只是跟上来，不蹬地
      replaces: 前腿发力，后脚不蹬地借力
    - cue: 下来时像半夜踩着会响的楼梯偷偷下楼，慢慢放，别"咚"地掉下去
      replaces: 下降时离心控制

  calf-raise:
    - cue: 像踮脚去够高处架子上的东西，踮到最高停一下
      replaces: 踝跖屈至最高点停顿
    - cue: 上下像电梯一样匀速，别像弹簧一样弹
      replaces: 全程慢速，不借助弹性

  band-lateral-walk:
    - cue: 像在一个很矮的天花板底下横着走，头的高度一直不变
      replaces: 半蹲高度保持不变
    - cue: 两脚之间始终留着一个鞋盒的宽度，弹力带一直绷着，别并脚
      replaces: 双脚不并拢，保持弹力带张力

  leg-press:
    - cue: 后背和屁股像被胶水粘在靠垫上；放下来时屁股一翘起来，就是放太深了
      replaces: 腰臀贴紧靠垫，骨盆不离垫
    - cue: 推到顶时膝盖别"咔"地伸直，留一点弯，像平时站着时膝盖是松的
      replaces: 推至顶端膝关节不锁死

  push-up:
    - cue: 身体像一块木板，从头到脚跟一起上、一起下，不塌腰也不撅屁股
      replaces: 核心收紧，躯干保持一条直线
    - cue: 手肘别像鸡翅膀一样往两边张开；从头顶往下看，身体和手臂像一个箭头，不像字母"T"
      replaces: 肘与躯干约四十五度，不外展到九十度
    - cue: 用手把地板往下推开，像要把地面推远
      replaces: 推起时手掌主动推地

  dumbbell-bench-press:
    - cue: 想象腋下夹着一张纸，别让它掉下来，肩膀就会往后、往下稳稳贴住凳子
      replaces: 肩胛骨后缩下沉
    - cue: 手肘和身体之间像夹着一个鸡蛋：夹太紧会碎，张太开会掉
      replaces: 肘与躯干约四十五到六十度
    - cue: 两只哑铃像被一根看不见的杆连着，一起下、一起上
      replaces: 两只哑铃同步

  bench-press:
    - cue: 躺下后两块肩胛骨像在背后夹住一支笔，再往裤兜方向塞，整组都别松
      replaces: 肩胛骨后缩下沉并保持
    - cue: 双脚像钉在地上用力踩住，屁股一直粘在凳子上
      replaces: 双脚踩稳，臀部不离凳
    - cue: 杠铃放下时像轻轻碰一下胸口的衣服就推起，别让它在胸口"弹"
      replaces: 触胸即起，不反弹

  one-arm-row:
    - cue: 手只当一个钩子，用手肘往后上方带，像锯木头往回拉的那一下
      replaces: 背阔肌发力，手肘带动
    - cue: 把哑铃往裤兜方向拉，不是往胸口拉
      replaces: 拉向髋部方向
    - cue: 背像一张桌面，平平的，拉的时候桌面别歪
      replaces: 背部平直，躯干不扭转

  band-row:
    - cue: 先把两块肩胛骨往中间夹，像要在背后夹住一支笔，再弯手肘往后拉
      replaces: 先肩胛骨后缩再屈肘
    - cue: 肩膀离耳朵远一点，像有人轻轻按住你的肩膀
      replaces: 不耸肩，肩胛下沉

  pull-up:
    - cue: 先别弯手臂，先把肩膀从耳朵边"拉下来"，像要把单杠往下压一点
      replaces: 先肩胛下沉再屈肘
    - cue: 想象用手肘往下、往后去插裤兜，手只是挂在杠上的钩子
      replaces: 背阔肌发力，肘部向下后方拉
    - cue: 想着把单杠拉到胸口，不是伸长脖子把下巴够过杠
      replaces: 胸部向杠，避免颈部代偿

  lat-pulldown:
    - cue: 手只是钩子，用手肘往下插裤兜，把杆拉到锁骨附近
      replaces: 肘部下拉、背阔肌主导、拉至上胸
    - cue: 胸口挺起来去迎杆，像要让杆碰到胸前的衣服
      replaces: 挺胸、身体稍后仰

  dumbbell-shoulder-press:
    - cue: 推之前先把屁股和肚子收紧，像站着等人从前面推你一把也不晃
      replaces: 核心收紧，避免腰部反弓
    - cue: 两只哑铃往头顶上方的同一个点推，路线像屋顶的两条斜边
      replaces: 推起时哑铃向中间靠拢

  lateral-raise:
    - cue: 想象手肘被两根绳子往两边的墙上拉，手只是挂在手肘下面
      replaces: 肘部带动，三角肌中束发力
    - cue: 抬到手臂和地面差不多平就停，从前面看身体像个"T"
      replaces: 抬至与肩同高，不过高
    - cue: 肩膀离耳朵远一点，别耸
      replaces: 不耸肩

  band-face-pull:
    - cue: 把弹力带往脸的方向拉，最后两手停在耳朵两边、手肘高高的，像在摆"秀肌肉"的姿势
      replaces: 肩外旋、手肘抬高、三角肌后束发力
    - cue: 后背两块肩胛骨往中间夹，像夹住一支笔
      replaces: 肩胛骨后缩

  dumbbell-curl:
    - cue: 上臂像被胶带粘在身体两侧，只有小臂像一扇门一样开合
      replaces: 上臂固定，只屈伸肘关节
    - cue: 放下时像把一杯水慢慢放回桌上，别"咚"地掉下去
      replaces: 离心控制

  bench-dip:
    - cue: 后背像贴着凳子边往下滑，别让身体离凳子越来越远
      replaces: 身体贴近凳子
    - cue: 肩膀离耳朵远一点，下到大臂和地面差不多平就停
      replaces: 肩胛下沉，不超过肩部安全幅度

  plank:
    - cue: 肚子像要挨一拳那样绷住，屁股像夹住一枚硬币，身体就成了一块硬木板
      replaces: 腹部与臀部收紧，脊柱保持中立
    - cue: 能正常说话就对了，别憋着气
      replaces: 保持呼吸

  dead-bug:
    - cue: 腰下面像压着一张纸，整组都别让人把它抽走
      replaces: 腰椎贴地
    - cue: 手脚像在放慢动作，伸出去的同时慢慢吐气
      replaces: 慢速，伸展时呼气

  side-plank:
    - cue: 身体像一块侧着放的木板，屁股往天花板方向顶，别往下掉
      replaces: 髋部不下沉
    - cue: 像背后贴着一面墙，身体别往前倒也别往后倒
      replaces: 身体不前后倒

  bird-dog:
    - cue: 背上像放着一杯水，手脚伸出去时别让水洒出来
      replaces: 脊柱与骨盆保持稳定、不旋转
    - cue: 手往前、脚往后，像有人从两头轻轻拉你，把身体拉长而不是抬高
      replaces: 向远处伸展，避免腰部反弓

  kettlebell-swing:
    - cue: 像用屁股去关身后的车门，再把屁股猛地往前一顶，把壶铃"弹"出去；手臂只是两根绳子
      replaces: 髋部爆发伸展（髋铰链），手臂不主动抬
    - cue: 壶铃往下时，让它贴着大腿根从两腿之间往后荡，像要把它塞到身后
      replaces: 下摆时壶铃深入两腿之间
    - cue: 站直时屁股夹紧、肚子绷住，像站成一根柱子，别往后仰
      replaces: 站直时收紧臀部和腹部，不后仰

  burpee:
    - cue: 落地像猫一样轻，膝盖软着接住自己
      replaces: 落地轻，膝盖微屈缓冲
    - cue: 撑地时身体像一块木板，别让肚子先着地
      replaces: 撑地时身体成一条直线，不塌腰

  cycling:
    - cue: 踩踏板像在画圆圈：踩到最下面时，像要刮掉鞋底的泥一样往后带一下
      replaces: 圆周踩踏，下止点后拉
    - cue: 座椅调到踩到最低点时腿差一点就伸直、膝盖还留一点弯
      replaces: 座椅高度使下止点膝关节轻度屈曲

  brisk-walk:
    - cue: 像赶公交车那样快走，还不到要跑的程度：能说话，但唱不了歌
      replaces: 中等强度（说话测试）
    - cue: 手臂像钟摆一样前后摆，别横着甩
      replaces: 手臂前后摆动

  front-squat:
    - cue: 手肘像要去指对面的墙，一直抬着，杠铃就稳稳待在肩上
      replaces: 手肘抬高保持前架位
    - cue: 像背靠着一面墙往下坐，上身别往前趴
      replaces: 躯干保持直立

  walking-lunge:
    - cue: 像走在两条平行的铁轨上，两只脚别踩到同一条线上
      replaces: 两脚保持髋宽，避免走成一条线

  hip-thrust:
    - cue: 想象屁股夹着一张纸，往上顶的时候把它夹紧
      replaces: 顶端臀部收紧
    - cue: 肋骨往下收，像有人轻轻按着你的肚子，腰就不会拱
      replaces: 避免腰椎过伸

  sumo-deadlift:
    - cue: 站起来时像要把地面往两边撕开
      replaces: 膝外展，双脚向外发力

  single-leg-rdl:
    - cue: 身体像一块跷跷板：头往前低多少，后脚就往后抬多少
      replaces: 躯干与后腿同步，保持一条直线
    - cue: 两边的胯像车灯一样一直照着地面，别歪向一边
      replaces: 髋部保持水平

  leg-extension:
    - cue: 像慢慢踢开一扇很重的门，不是一脚踹开
      replaces: 控制速度，避免借力

  lying-leg-curl:
    - cue: 肚子和胯一直贴着垫子，像被粘住了一样
      replaces: 髋部不离开垫面

  seated-calf-raise:
    - cue: 像踮脚去看前面人群里的人，踮到最高停一下
      replaces: 顶端充分收缩

  good-morning:
    - cue: 像双手端着盘子用屁股去关身后的车门
      replaces: 屈髋后推

  hack-squat:
    - cue: 后背像贴在墙上的贴纸，从头到尾别撕下来
      replaces: 背部贴紧靠垫

  side-lunge:
    - cue: 像侧身坐到旁边一把椅子上，另一条腿顺势伸直
      replaces: 侧向屈髋屈膝，另一腿伸直

  hip-abduction:
    - cue: 像慢慢推开两扇很沉的门
      replaces: 控制速度向外打开

  pistol-squat:
    - cue: 像单脚慢慢坐到一把很矮的凳子上
      replaces: 单腿屈髋屈膝下蹲

  band-kickback:
    - cue: 像用脚后跟往后上方蹬开一扇门
      replaces: 伸髋向后上方发力
    - cue: 背上像放着一杯水，踢腿时别把它晃洒
      replaces: 保持躯干稳定

  incline-dumbbell-press:
    - cue: 想象腋下夹着一张纸，推的时候别让它掉下来
      replaces: 手肘不过度外展

  incline-bench-press:
    - cue: 像要把凳子从背后挤住，两侧肩膀夹紧贴在凳上
      replaces: 肩胛收紧下沉

  dumbbell-fly:
    - cue: 像抱一棵很粗的树，手臂一直保持这个弧度
      replaces: 肘关节角度固定

  cable-crossover:
    - cue: 像两只手要在身前合抱一个大气球
      replaces: 双臂弧线内收

  machine-chest-press:
    - cue: 后背像被吸在靠垫上，推的时候别离开
      replaces: 背部贴紧靠垫

  pec-deck:
    - cue: 像慢慢合上一本很厚的大书
      replaces: 控制速度内收

  decline-push-up:
    - cue: 身体像一块木板，脚垫高了也别从中间折
      replaces: 躯干保持直线

  dumbbell-floor-press:
    - cue: 上臂轻轻放到地上，像放下一个鸡蛋
      replaces: 控制下放

  parallel-dip:
    - cue: 肩膀离耳朵越远越好，别让脖子缩起来
      replaces: 肩胛下沉

  barbell-row:
    - cue: 想象手肘去撞身后的墙，手只是挂钩
      replaces: 以肘带动，背部发力

  seated-cable-row:
    - cue: 拉到底时像要用两边肩膀把背后一支笔夹住
      replaces: 肩胛后缩

  inverted-row:
    - cue: 身体像一块木板被拉上去，别从屁股那里折
      replaces: 躯干保持直线

  chin-up:
    - cue: 想象把单杠往下拉弯到胸口，而不是把自己拽上去
      replaces: 背部主导下拉

  straight-arm-pulldown:
    - cue: 手臂像两根木棍，用腋下那块地方把它往下压
      replaces: 伸直手臂，背阔发力

  chest-supported-row:
    - cue: 胸口像被粘在靠背上，拉的时候别抬起来
      replaces: 胸部始终贴住支撑

  back-extension:
    - cue: 起身到身体像一块直直的木板就停，再往上就是在折腰
      replaces: 避免腰椎过伸

  dumbbell-shrug:
    - cue: 像要用肩膀去碰耳垂，碰到了停一下
      replaces: 肩胛上提至顶端

  overhead-press:
    - cue: 推起时像有人在挠你的肚子，肚子和屁股都绷紧，腰就不会往后弯
