  battle-rope:
    - cue: "像坐在一把看不见的高凳上，上身稳住，只让胳膊甩"
      replaces: "保持半蹲，躯干稳定"
    - cue: "甩绳像在抖一条长床单，要让波浪一直传到最远那头"
      replaces: "以肩带臂快速交替发力"
  shadow-boxing:
    - cue: "出拳像转动门把手那样带着腰一起转，不是光甩胳膊"
      replaces: "转体带动出拳"
    - cue: "拳头打出去像弹簧，碰一下立刻弹回来护住下巴"
      replaces: "出拳后迅速收回防守位"
  sprint-interval:
    - cue: "手臂像火车的连杆，摆得越用力，腿跑得越快"
      replaces: "积极摆臂带动步频"
    - cue: "每次冲完要缓到能说一整句话，再开始下一次"
      replaces: "组间充分恢复"
  star-jump:
    - cue: "跳到空中把自己撑成一颗大大的五角星"
      replaces: "空中四肢充分外展伸展"
    - cue: "落地像猫一样轻，膝盖弯一下把冲击吸收掉"
      replaces: "前脚掌落地，屈膝缓冲"
  cross-body-shoulder-stretch:
    - cue: "像把胳膊当成围巾往脖子前面绕，同时肩膀往下沉"
      replaces: "肩水平内收拉伸，肩胛下沉"
    - cue: "手扶在胳膊肘上面一点，像轻轻抱住它，不按在关节上"
      replaces: "施力点在上臂远端，避开肘关节"
  overhead-triceps-stretch:
    - cue: "像伸手去挠后背中间的痒，另一只手帮它往下送一点"
      replaces: "肩前屈加肘屈拉伸上臂后侧"
    - cue: "头像被手臂轻轻贴着，别被顶得低下去"
      replaces: "头颈保持正位"
  behind-back-chest-stretch:
    - cue: "像刚睡醒伸懒腰那样把胸口往前上方挺开"
      replaces: "挺胸扩展胸椎"
    - cue: "两侧肩膀往后口袋的方向放，别往耳朵那边耸"
      replaces: "肩胛下沉，避免耸肩"
  kneeling-lat-stretch:
    - cue: "手掌像被粘在地上，屁股往后拽，把腋下到腰这一条拉长"
      replaces: "固定上肢，臀部后移拉伸体侧和背部两侧"
    - cue: "每呼一口气，胸口就往地板再化下去一点"
      replaces: "呼气时加深拉伸"
  upper-back-stretch:
    - cue: "像抱着一个大树干，背往后拱成一个弧"
      replaces: "胸椎屈曲，肩胛分开"
    - cue: "手往前推远，背往后顶，两头一起使劲"
      replaces: "上肢前伸配合背部后拱"
  neck-side-stretch:
    - cue: "让耳朵慢慢靠向肩膀，像头太重了自己往一边歪"
      replaces: "颈部侧屈"
    - cue: "另一边肩膀像提着一桶水，一直往下沉"
      replaces: "对侧肩胛下沉加深拉伸"
  standing-side-stretch:
    - cue: "像身体夹在两块玻璃中间，只能往侧面弯，不能往前趴"
      replaces: "在冠状面内侧屈"
    - cue: "手指尖往斜上方够，像要去摘远处的一个苹果"
      replaces: "上肢延伸加长体侧"
  worlds-greatest-stretch:
    - cue: "转身时像推开一扇门，胸口整个转向侧面，眼睛跟着手走"
      replaces: "胸椎旋转，视线跟随上肢"
    - cue: "后腿那侧的胯往前送，前面大腿根有被拉开的感觉"
      replaces: "后侧髋前侧拉伸"
  frog-stretch:
    - cue: "像青蛙趴在地上，膝盖往两边打开，屁股慢慢往后找脚跟"
      replaces: "髋外展位后移，拉伸大腿内侧"
    - cue: "背像一张平桌子，别塌腰也别拱背"
      replaces: "脊柱保持平直"
  seated-twist-stretch:
    - cue: "先把自己坐高，再像拧毛巾一样从腰往上一节节转过去"
      replaces: "脊柱伸展位下旋转"
    - cue: "手肘像一根撑杆抵住膝盖，两边轻轻较劲"
      replaces: "肘抵膝外侧加深旋转"
  wrist-forearm-stretch:
    - cue: "像交警举手示意停车，另一只手轻轻把手指往回扳"
      replaces: "腕背伸拉伸前臂屈肌"
    - cue: "扳到有点紧就停，像轻轻拉开一条松紧带"
      replaces: "温和静态拉伸"
  foam-roll-upper-back:
    - cue: "像躺在擀面杖上，用它慢慢擀肩膀中间那块背"
      replaces: "泡沫轴滚压上背"
    - cue: "只滚到肋骨下沿就往回，腰那一段不滚"
      replaces: "避免滚压腰椎"
  foam-roll-glutes:
    - cue: "像用擀面杖擀屁股，酸的地方停下来多擀几下"
      replaces: "慢速滚压，痛点停留"
    - cue: "翘起二郎腿，身体往这边屁股歪，压得更准"
      replaces: "跷腿侧倾，集中滚压一侧臀部"
  supine-twist-stretch:
    - cue: "两边肩膀像被钉在地板上，只让膝盖慢慢倒向一边"
      replaces: "固定肩部，下肢带动脊柱旋转"
    - cue: "每呼一口气，就让膝盖再往地上沉一点"
      replaces: "呼气时加深拉伸"
