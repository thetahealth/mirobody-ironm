# 动作库的结构化标注（spec [2026-10-23] §12；§57 起肌群、肌肉、关节都写 body_codes.yaml 里的编码）：
# 计划检查、替代动作、人体图、恢复用。
# pattern：动作模式（同一模式的动作可以互相替代）
#   squat 蹲、hinge 髋铰链、lunge 单腿、bridge 臀桥类、h_push 水平推、v_push 垂直推、h_pull 水平拉、
#   v_pull 垂直拉、shoulder 肩部小肌群、curl 弯举、extension 臂屈伸、calf 小腿、abduction 髋外展、
#   core 核心、plyo 跳跃全身、cardio 有氧、stretch 拉伸放松（不计训练组数）
# groups：算每周组数用的分组（每组记 1 组）。沿用原来的分组：胸、背、肩、核心按部位（part.*），
#   其余按肌群（group.*）；有氧、拉伸、全身跳跃类不写
# muscles / assist：人体图和恢复用的细分肌肉（muscle.*），主要练到 / 辅助练到（辅助的每组按半组算）
# stress：会给哪些关节（joint.*）加负担（这些部位有伤时，计划检查会标出，替代动作会避开）
# friendly：常用来照顾哪些关节（有伤时替代动作优先选）
# 编号与 exercises.yaml 对应；内容由 Claude 整理，待审定。
