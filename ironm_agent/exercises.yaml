    muscles: 肱三头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 双手捧住一只哑铃举过头顶
      - 上臂不动，屈肘把哑铃放到脑后
      - 伸肘把哑铃举回头顶
      - 动作慢
    cues: [上臂贴近耳朵, 核心收紧不弯腰]
    mistakes: [手肘向外张开, 腰往后弯]
    easier: 绳索下压
    harder: 加重
    avoid: 肩膀活动受限或疼痛时换绳索下压

  - id: skull-crusher
    name: 仰卧曲杆臂屈伸
    part: 手臂
    muscles: 肱三头肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 仰卧在凳子上，双手窄握曲杆举在胸部上方
      - 上臂不动，屈肘把杆放到额头上方
      - 伸肘把杆举回
      - 动作慢
    cues: [上臂垂直不动, 下放慢]
    mistakes: [手肘向外张开, 下放太快]
    easier: 绳索下压
    harder: 加重
    avoid: 肘部疼时减轻重量或换绳索下压；要有人保护

  - id: close-grip-push-up
    name: 窄距俯卧撑
    part: 手臂
    muscles: 肱三头肌、胸大肌
    equipment: [自重]
    level: 入门
    steps:
      - 双手撑地，距离比肩窄
      - 身体从头到脚成一条直线
      - 屈肘下降，手肘贴着身体
      - 推起
    cues: [手肘贴着身体往后, 身体一条直线]
    mistakes: [手肘向外张, 塌腰]
    easier: 跪姿窄距俯卧撑
    harder: 脚垫高
    avoid: 手腕疼时用俯卧撑支架或握哑铃做

  - id: crunch
    name: 卷腹
    part: 核心
    muscles: 腹直肌
    equipment: [自重]
    level: 入门
    steps:
      - 仰卧屈膝，双脚踩地，双手轻放耳侧
      - 腹部发力把肩膀抬离地面
      - 顶端停一秒
      - 慢慢放下
    cues: [下巴和胸口之间留一个拳头的距离, 只卷到肩膀离地]
    mistakes: [双手抱头用力拽脖子, 起得太高变成仰卧起坐]
    easier: 减小幅度
    harder: 手持重物
    avoid: 脖子不适时双手交叉抱胸；腰背疼就停

  - id: lying-leg-raise
    name: 仰卧举腿
    part: 核心
    muscles: 腹直肌下部
    equipment: [自重]
    level: 入门
    steps:
      - 仰卧，双手放在身体两侧或屁股下面
      - 双腿伸直并拢，慢慢抬到与地面垂直
      - 慢慢放下到离地一点
      - 腰背始终贴地
    cues: [腰背贴住地面, 下放慢]
    mistakes: [腰离开地面拱起来]
    easier: 屈膝举腿
    harder: 悬垂举腿
    avoid: 腰背不适时屈膝做、下放幅度小一点

  - id: russian-twist
    name: 俄罗斯转体
    part: 核心
    muscles: 腹斜肌
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 坐在地上，屈膝，上身稍后倾
      - 双手合握或捧一只哑铃在胸前
      - 上身左右转动
      - 动作慢
    cues: [转的是上身，不是只甩手, 背部挺直]
    mistakes: [弯腰驼背, 只甩手臂]
    easier: 双脚踩地做
    harder: 双脚离地、加重
    avoid: 腰背不适时双脚踩地、转动幅度小一点

  - id: ab-wheel
    name: 健腹轮
    part: 核心
    muscles: 腹直肌、背阔肌
    equipment: [器械]
    level: 进阶
    steps:
      - 跪在垫子上，双手握住健腹轮
      - 腹部收紧，慢慢把轮子向前推
      - 推到能控制的位置
      - 腹部发力把轮子拉回
    cues: [腰不往下塌, 推得太远就收]
    mistakes: [推太远塌腰]
    easier: 推近一点、对着墙推（限制距离）
    harder: 站姿健腹轮
    avoid: 腰背有伤先别做；腰往下塌就缩短距离

  - id: pallof-press
    name: 抗旋转推
    part: 核心
    muscles: 腹斜肌、腹直肌
    equipment: [弹力带, 器械]
    level: 入门
    common: false
    steps:
      - 侧身站在绳索架或固定好的弹力带旁，双手握把放在胸前
      - 双手向前推直
      - 身体保持不被拉转
      - 停两秒后收回
    cues: [身体正对前方不转, 肚子收紧]
    mistakes: [身体被拉得转过去]
    easier: 弹力带松一点
    harder: 站得离远一点、单腿跪姿做
    avoid: 腰背不适的人比较友好

  - id: side-bend
    name: 哑铃体侧屈
    part: 核心
    muscles: 腹斜肌
    equipment: [哑铃]
    level: 入门
    common: false
    steps:
      - 单手持哑铃站立
      - 上身向拿哑铃的一侧弯
      - 另一侧腰部发力把身体拉直
      - 做完一侧换另一侧
    cues: [只向侧面弯，不前后倾, 动作慢]
    mistakes: [身体前倾或后仰, 重量太大]
    easier: 不负重
    harder: 加重
    avoid: 腰背不适时减小幅度

  - id: plank-shoulder-tap
    name: 平板支撑交替拍肩
    part: 核心
    muscles: 腹直肌、腹斜肌
    equipment: [自重]
    level: 入门
    common: false
    steps:
      - 俯卧撑姿势撑住，双脚比肩宽
      - 一只手抬起拍对侧肩膀
      - 放回后换另一只手
      - 身体保持不晃
    cues: [屁股不左右晃, 身体一条直线]
    mistakes: [屁股跟着手左右扭]
    easier: 跪姿做、双脚分更开
    harder: 双脚并拢
    avoid: 手腕或肩膀疼时改成肘撑平板

  - id: wall-ball
    name: 药球蹲起抛墙
    part: 全身
    muscles: 股四头肌、臀大肌、肩
    equipment: [器械]
    level: 入门
    common: false
    steps:
      - 双手捧药球在胸前，面对墙站立
      - 下蹲到大腿接近水平
      - 站起时把药球向墙上高处抛出
      - 接住球顺势下蹲进入下一次
    cues: [蹲起和抛球连成一个动作, 膝盖顺着脚尖]
    mistakes: [只用手臂抛, 膝盖向内扣]
    easier: 空手蹲起加上推
    harder: 更重的药球、更高的目标
    avoid: 膝盖或肩膀疼时先别做

  - id: dumbbell-snatch
    name: 哑铃单臂抓举
    part: 全身
    muscles: 臀大肌、腘绳肌、肩
    equipment: [哑铃, 壶铃]
    level: 进阶
    common: false
    steps:
      - 哑铃放在两脚之间，屈髋屈膝单手握住
      - 腿和髋部爆发发力站起，把哑铃沿身体拉起
      - 手腕翻转把哑铃举过头顶
      - 分段放回
    cues: [力量来自腿和髋, 哑铃贴近身体]
    mistakes: [只用手臂拉, 弯腰拱背]
    easier: 壶铃摇摆
    harder: 加重
    avoid: 腰背或肩膀有伤先别做；先跟教练学动作

  - id: high-knees
    name: 原地高抬腿
    part: 有氧
    muscles: 全身
    equipment: [自重]
    level: 入门
    steps:
      - 原地站立
      - 交替把膝盖抬到腰的高度
      - 手臂配合前后摆
      - 前脚掌轻落地
    cues: [落地轻, 上身直立]
    mistakes: [身体后仰]
    easier: 原地快走抬腿
    harder: 加快速度、延长时间
    avoid: 膝盖或脚踝疼时改原地快走

  - id: hip-flexor-stretch
    name: 跪姿髋屈肌拉伸
    part: 拉伸放松
    muscles: 大腿前侧上部、髋前侧
    equipment: [自重]
    level: 入门
    steps:
      - 单膝跪地，另一只脚在前踩地
      - 收紧臀部，髋部慢慢向前推
      - 感到后腿大腿根前侧拉伸时停住
      - 保持二三十秒后换边
    cues: [臀部收紧, 上身直立]
    mistakes: [腰往前塌]
    easier: 幅度小一点
    harder: 后侧手臂上举
    avoid: 膝盖跪地疼时下面垫毛巾

  - id: hamstring-band-stretch
    name: 仰卧弹力带大腿后侧拉伸
    part: 拉伸放松
    muscles: 大腿后侧
    equipment: [弹力带]
    level: 入门
    steps:
      - 仰卧，弹力带套在一只脚上
      - 这条腿伸直慢慢往上拉
      - 感到大腿后侧拉伸时停住
      - 保持二三十秒后换边
    cues: [另一条腿平放, 腿保持伸直]
    mistakes: [拉得太猛]
    easier: 膝盖微屈
    harder: 拉得更高
    avoid: 大腿后侧拉伤急性期先别拉

  - id: quad-stretch
    name: 站姿大腿前侧拉伸
    part: 拉伸放松
    muscles: 大腿前侧
    equipment: [自重]
    level: 入门
    steps:
      - 单腿站立，可以扶墙
      - 用手抓住另一只脚背，拉向屁股
      - 两个膝盖并拢
      - 保持二三十秒后换边
    cues: [膝盖并拢、朝下, 身体直立]
    mistakes: [膝盖向外张]
    easier: 侧躺做
    harder: 髋部再往前推一点
    avoid: 膝盖疼时别硬拉

  - id: pigeon-stretch
    name: 鸽子式拉伸
    part: 拉伸放松
    muscles: 臀部、髋外侧
    equipment: [自重]
    level: 进阶
    steps:
      - 从俯卧撑姿势开始，把一条腿屈膝放到身前
      - 另一条腿向后伸直
      - 上身慢慢前倾
      - 保持二三十秒后换边
    cues: [髋部摆正, 呼吸放松]
    mistakes: [膝盖别扭疼还硬压]
    easier: 仰卧四字拉伸
    harder: 上身趴得更低
    avoid: 膝盖或髋部疼时换仰卧四字拉伸

  - id: calf-stretch
    name: 站姿小腿拉伸
    part: 拉伸放松
    muscles: 小腿
    equipment: [自重]
    level: 入门
    steps:
      - 面对墙，双手扶墙，一只脚向后伸
      - 后脚跟踩地，前膝弯曲
      - 身体向墙靠近
      - 保持二三十秒后换边
    cues: [后脚跟踩实, 后腿伸直]
    mistakes: [后脚跟抬起]
    easier: 幅度小一点
    harder: 后膝微屈做（拉小腿深层）
    avoid: 跟腱疼时别拉得太猛

  - id: knee-to-chest
    name: 仰卧抱膝
    part: 拉伸放松
    muscles: 下背、臀部
    equipment: [自重]
    level: 入门
    steps:
      - 仰卧
      - 双手抱住一侧或双侧膝盖拉向胸口
      - 保持二三十秒
      - 慢慢放下
    cues: [动作慢, 呼吸放松]
    mistakes: [猛地拉]
    easier: 单腿做
    harder: 双腿一起做
    avoid: 腰背疼得厉害或腿发麻时停下

  - id: foam-roll-quads
    name: 泡沫轴放松大腿前侧
    part: 拉伸放松
    muscles: 大腿前侧
    equipment: [泡沫轴]
    level: 入门
    steps:
      - 趴下，把泡沫轴放在大腿前侧下面
      - 前臂撑地
      - 身体前后慢慢滚动
      - 每侧一两分钟
    cues: [慢慢滚, 遇到酸的地方停一会]
    mistakes: [在膝盖骨上滚]
    easier: 压得轻一点
    harder: 单腿压
    avoid: 有静脉曲张、皮肤破损的地方别压

  - id: foam-roll-calves
    name: 泡沫轴放松小腿
    part: 拉伸放松
    muscles: 小腿
    equipment: [泡沫轴]
    level: 入门
    steps:
      - 坐在地上，把泡沫轴放在小腿下面
      - 双手撑地把屁股抬起
      - 前后慢慢滚动
      - 每侧一两分钟
    cues: [慢慢滚, 可以叠腿加压]
    mistakes: [滚得太快]
    easier: 双腿一起压
    harder: 叠腿加压
    avoid: 有静脉曲张或小腿急性拉伤时别压

  # §79：标准三分化里的单手绳索下拉
  - id: single-arm-pulldown
    name: 单臂高位下拉
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [器械, 弹力带]
    level: 入门
    common: false
    steps:
      - 在高位滑轮上挂单手把手，单膝跪地或坐在凳上，手臂向上伸直握住
      - 沉肩，手肘往身体侧下方拉，把手把拉到肩膀旁边
      - 慢慢放回到手臂伸直、背部有拉伸感
    cues: [先沉肩再拉, 手肘贴着身体侧面往下走, 身体不跟着转]
    mistakes: [耸肩用手臂硬拽, 身体大幅侧倒借力]
    easier: 减轻重量，或用双手高位下拉
    harder: 加重、顶端停一秒
    avoid: 肩部疼痛时减小幅度；在家可以把弹力带挂高处做

  # §79：完全没有器械时的拉类动作
  - id: towel-door-row
    name: 门把手毛巾划船
    part: 背
    muscles: 背阔肌、菱形肌、肱二头肌
    equipment: [自重]
    level: 入门
    common: false
    steps:
      - 把一条结实的长毛巾绕过关紧的门两侧把手，双手各握一端，脚尖靠近门
      - 身体伸直向后倒，手臂伸直撑住
      - 挤肩胛、手肘往身后拉，把胸口拉向门
      - 慢慢放回到手臂伸直
    cues: [身体保持一条直线, 先挤肩胛再弯手肘, 脚离门越近越难]
    mistakes: [屁股往后坐借力, 只用手臂拉]
    easier: 站得更直（脚离门远一点）
    harder: 脚更靠近门、单手做
    avoid: 门要关紧、把手结实，先小角度试；把手松动或门往外开就别做，改桌下反向划船

  - id: prone-pulldown
    name: 俯卧超人下拉
    part: 背
    muscles: 背阔肌、中下斜方肌
    equipment: [自重]
    level: 入门
    common: false
    steps:
      - 俯卧在垫子上，双臂向前伸直，额头朝下
      - 胸口和双臂稍微抬离地面
      - 手肘往身体两侧、往腰的方向拉，像做引体向上
      - 停一秒，再把手臂伸回前方
    cues: [手肘往裤兜方向拉, 肩膀离耳朵远一点, 脖子保持自然不仰头]
    mistakes: [仰头抬太高, 腰部用力过猛]
    easier: 手臂不离地，只做下拉的动作
    harder: 双手握一条毛巾往两边拉紧再做、顶端多停几秒
    avoid: 腰部不适时胸口少抬一点；腰疼加重就停

  - id: prone-y-raise
    name: 俯卧 Y 字举
    part: 肩
    muscles: 三角肌后束、中下斜方肌
    equipment: [自重, 哑铃]
    level: 入门
    common: false
    steps:
      - 俯卧在垫子上（或俯身在凳上），双臂向前上方伸成 Y 字，拇指朝上
      - 沉肩，把双臂抬离地面
      - 停一秒，慢慢放下
    cues: [拇指朝天, 肩膀离耳朵远一点, 用背和肩后侧把手臂抬起来]
    mistakes: [耸肩, 抬太高用腰借力]
    easier: 手臂成 T 字（向两侧伸）
    harder: 手握小重量、顶端多停几秒
    avoid: 肩部疼痛时减小幅度

  - id: towel-curl
    name: 毛巾对抗弯举
    part: 手臂
    muscles: 肱二头肌、肱肌
    equipment: [自重]
    level: 入门
    common: false
    steps:
      - 坐在椅子上，把毛巾中间踩在一只脚下，同侧手握住毛巾两端
      - 脚往下踩着给阻力，手像弯举一样把毛巾往上拉
      - 拉到手肘完全弯曲，再慢慢放下，脚一直给阻力
    cues: [大臂贴着身体不动, 脚给的阻力要让手吃力, 下放时也要对抗]
    mistakes: [身体后仰借力, 脚不给阻力]
    easier: 脚少用点力
    harder: 脚多用力、放慢下放
    avoid: 手肘疼时减小阻力

  # 第三批（spec [2026-11-03] §144）：补健身房里最常见、库里还没有的动作；内容自己写，待审定
  - id: treadmill-run
    name: 跑步机慢跑
    part: 有氧
    muscles: 心肺、大腿、小腿
    equipment: [器械]
    level: 入门
    steps:
      - 站上跑步机两侧踏板，夹好安全扣，从步行速度开始
      - 走 3–5 分钟热身，再慢慢把速度加到能说话、但说不了长句的慢跑
      - 保持 15–30 分钟
      - 最后降回步行速度放松 3–5 分钟再停
    cues: [身体站在跑带中间，别贴着前面的扶手, 步子小一点、频率快一点, 脚落在身体正下方附近]
    mistakes: [一直抓着扶手跑, 跑带还在转就直接跳下来, 一上来就开很快]
    easier: 快走，或者把坡度调到 3–5 度走路
    harder: 快慢交替的间歇跑、加坡度
    avoid: 膝盖、脚踝疼或者体重比较大时，先换椭圆机或动感单车；胸闷、胸痛、头晕马上按停止并就医

  - id: elliptical
    name: 椭圆机
    part: 有氧
    muscles: 心肺、大腿、臀部
    equipment: [器械]
    level: 入门
    steps:
      - 双脚踩稳踏板，双手握住活动扶手
      - 用低阻力热身 3–5 分钟
      - 加到中等强度（微微喘、还能说话）保持 20–40 分钟
      - 最后用低阻力放松 3–5 分钟
    cues: [全脚掌踩住踏板，脚跟不离开, 上身直立，不往前趴, 手臂和腿一起推拉]
    mistakes: [身体趴在扶手上, 只踮脚尖踩, 阻力太小、全靠惯性甩]
    easier: 降低阻力、缩短时间
    harder: 提高阻力或坡度、做快慢交替
    avoid: 对膝盖冲击小，适合跑步膝盖疼的人；胸闷、胸痛、头晕马上停下并就医

  - id: rowing-machine
    name: 划船机
    part: 有氧
    muscles: 心肺、腿、背、手臂
    equipment: [器械]
    level: 入门
    steps:
      - 坐好，双脚绑紧在踏板上，双手握住把手，手臂伸直
      - 先用腿蹬，腿快伸直时上身稍向后倒，最后手把把手拉到肚脐上方
      - 回去的顺序反过来：手先往前送，身体前倾，最后再屈膝
      - 先轻松划 5 分钟，再用中等强度划 15–20 分钟
    cues: [力量大部分来自腿, 背一直挺直, 节奏是拉快、回慢]
    mistakes: [只用手臂拉, 弓着背拉, 回去时先屈膝，把手撞到膝盖]
    easier: 降低阻力、划得慢一点
    harder: 提高强度，做 1 分钟快、1 分钟慢的间歇
    avoid: 腰背疼时先别做，或只用很低的强度；胸闷、胸痛、头晕马上停下并就医

  - id: jump-rope
    name: 跳绳
    part: 有氧
    muscles: 心肺、小腿
    equipment: [自重]
    level: 入门
    steps:
      - 准备一根跳绳：双脚踩住绳子中间，把手拉到胸口附近长度正好
      - 手肘贴近身体，用手腕转绳
      - 前脚掌轻轻起跳，刚好让绳子过去就落地
      - 跳 1 分钟、歇 30 秒，一共 10–15 分钟
    cues: [跳得低、落得轻, 用手腕转，不是整条胳膊甩, 膝盖微弯缓冲]
    mistakes: [跳得太高, 脚跟砸地, 绳子太长或太短]
    easier: 不用绳子，原地模拟跳
    harder: 加快速度、换脚跳、延长每段时间
    avoid: 膝盖、脚踝疼或体重比较大时先换快走或椭圆机；在木地板或软垫上跳，别在水泥地上跳

  - id: jumping-jack
    name: 开合跳
    part: 有氧
    muscles: 心肺、全身
    equipment: [自重]
    level: 入门
    steps:
      - 双脚并拢站好，手放在身体两侧
      - 跳起来，双脚向两侧分开落地，同时双手从两侧举过头顶
      - 再跳起来，双脚并拢、双手放回身体两侧
      - 连续做 30–60 秒，歇一会儿再做
    cues: [前脚掌轻落地, 膝盖微弯缓冲, 节奏均匀]
    mistakes: [落地太重, 膝盖往里扣]
    easier: 不跳：一只脚轮流向侧面迈出，手照样举过头
    harder: 加快速度、延长时间
    avoid: 膝盖、脚踝疼时换不跳的版本

  - id: mountain-climber
    name: 登山跑
    part: 全身
    muscles: 腹肌、髋前侧、肩、心肺
    equipment: [自重]
    level: 入门
    timed: true
    steps:
      - 做俯卧撑的起始姿势：双手在肩膀正下方，身体成一条直线
      - 一侧膝盖往胸口方向收，再放回去
      - 两条腿交替，越来越快，像在原地跑
      - 做 20–40 秒，歇一会儿再做
    cues: [屁股不翘高、也不塌, 肩膀一直在手的正上方, 收腿时肚子收紧]
    mistakes: [屁股翘得很高, 腰往下塌]
    easier: 放慢速度，一条腿收回放好再换另一条；或者手撑在凳子上做
    harder: 加快速度、延长时间
    avoid: 手腕或肩膀疼时改成手撑在凳子上做或先别做

  - id: hanging-leg-raise
    name: 悬垂举腿
    part: 核心
    muscles: 腹直肌下部、髋前侧
    equipment: [单杠]
    level: 进阶
    steps:
      - 双手正握单杠，身体挂直
      - 收紧肚子，屈膝（或直腿）把腿抬到和地面平行或更高
      - 慢慢放下，不让身体前后荡
    cues: [抬腿时骨盆往上卷, 下放比上抬慢, 肩膀往下沉，别耸着挂]
    mistakes: [靠身体荡起来甩腿, 只抬到一半就放下]
    easier: 屈膝举腿、仰卧举腿
    harder: 直腿举到脚碰杠
    avoid: 肩膀疼或握不住杠时先做仰卧举腿；腰疼时先别做

  - id: smith-squat
    name: 史密斯深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [器械]
    level: 入门
    steps:
      - 把杠调到肩膀稍低一点的高度，杠放在后背上部（斜方肌上），双手握杠
      - 站直、转动杠解锁，双脚站在杠稍前一点，略比肩宽
      - 屈髋屈膝下蹲到大腿接近与地面平行
      - 脚掌发力站起，做完转动杠挂回挂钩
    cues: [膝盖顺着脚尖方向, 全脚掌踩地, 背部挺直]
    mistakes: [双脚站得太靠前或太靠后，膝盖或腰别扭, 蹲到底时腰背变圆]
    easier: 高脚杯深蹲、腿举
    harder: 杠铃深蹲
    avoid: 膝盖蹲深会疼时先控制深度；腰背不适先减重量

  - id: seated-leg-curl
    name: 坐姿腿弯举
    part: 腿臀
    muscles: 腘绳肌（大腿后侧）
    equipment: [器械]
    level: 入门
    steps:
      - 坐好，膝盖和机器的转轴对齐，小腿压垫放在脚踝上方，大腿压垫压紧
      - 小腿往下、往后弯，把压垫压到底
      - 停一下，慢慢放回去
    cues: [屁股坐实不离开座椅, 下放慢一点, 脚尖朝上勾着]
    mistakes: [用身体往后仰借力, 放回去太快被弹起来]
    easier: 减轻重量
    harder: 单腿做、下放更慢
    avoid: 膝盖后侧疼时减重量或先别做

  - id: t-bar-row
    name: T 杠划船
    part: 背
    muscles: 背阔肌、中下斜方肌、菱形肌
    equipment: [杠铃, 器械]
    level: 进阶
    steps:
      - 站在 T 杠或一端固定的杠铃上，双脚分开，握住把手
      - 屈髋，上身前倾到和地面成 45 度左右，背挺直
      - 把把手拉向肚子，挤一下后背
      - 慢慢放下，手臂伸直
    cues: [背一直挺直, 用手肘往后拉, 上身角度不变]
    mistakes: [弓背, 靠上身起伏借力]
    easier: 俯卧上斜哑铃划船、坐姿绳索划船
    harder: 加重
    avoid: 腰背不适时换有胸垫支撑的划船

  - id: reverse-pec-deck
    name: 反向飞鸟机
    part: 肩
    muscles: 三角肌后束、菱形肌、中斜方肌
    equipment: [器械]
    level: 入门
    steps:
      - 面朝机器坐，胸口贴住靠垫，把手调到与肩同高
      - 手臂微弯，向两侧、向后打开
      - 打开到手臂和身体在一条线，停一下，慢慢收回
    cues: [胸口一直贴着靠垫, 肩膀往下沉，别耸肩, 用肩膀后侧发力]
    mistakes: [重量太大，身体往后仰借力, 耸肩]
    easier: 减轻重量、弹力带面拉
    harder: 打开后停更久
    avoid: 肩膀疼时减小打开的幅度

  - id: sumo-squat
    name: 相扑深蹲
    part: 腿臀
    muscles: 臀大肌、大腿内侧、股四头肌
    equipment: [自重, 哑铃, 壶铃]
    level: 入门
    steps:
      - 双脚站得比肩宽很多，脚尖向外打开 30–45 度
      - 双手握一只哑铃或壶铃垂在身体中间（也可以不拿）
      - 屈膝向下蹲，上身保持直立
      - 蹲到大腿接近与地面平行，脚掌发力站起
    cues: [膝盖朝脚尖方向往外推, 上身直立, 站起时夹紧屁股]
    mistakes: [膝盖往里扣, 上身往前趴]
    easier: 自重做、减小幅度
    harder: 加重、底部停两秒
    avoid: 大腿内侧或髋部疼时减小站距或先别做

  - id: assisted-pull-up
    name: 器械辅助引体向上
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [器械]
    level: 入门
    steps:
      - 选好辅助重量（数字越大，帮你越多），跪或站在踏板上，双手正握把手
      - 先把肩膀往下沉，再屈肘把身体拉上去，到下巴过把手
      - 慢慢放下，手臂伸直
    cues: [先沉肩再拉, 用手肘往下、往后插裤兜, 下放要慢]
    mistakes: [耸着肩拉, 只拉一半]
    easier: 加大辅助重量、高位下拉
    harder: 减小辅助重量，直到能做引体向上
    avoid: 肩膀疼时先换高位下拉，把握距调窄一点

  - id: triceps-kickback
    name: 哑铃俯身臂屈伸
    part: 手臂
    muscles: 肱三头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 一只手和同侧膝盖撑在凳子上，另一只手拿哑铃，上身和地面接近平行
      - 拿哑铃的大臂贴住身体、和地面平行
      - 只动小臂，把哑铃往后推到手臂伸直
      - 停一下，慢慢放回
    cues: [大臂不动，只有小臂在动, 伸直时夹紧手臂后侧, 背挺直]
    mistakes: [大臂跟着前后甩, 重量太大靠甩]
    easier: 减轻重量、绳索下压
    harder: 伸直后停更久
    avoid: 手肘疼时减轻重量或先别做
