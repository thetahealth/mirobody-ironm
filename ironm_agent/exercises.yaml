      - 慢慢放下
    cues: [手肘带动、不超过肩, 哑铃贴着身体]
    mistakes: [拉得太高，肩膀夹着疼]
    easier: 侧平举
    harder: 加重
    avoid: 肩膀有夹挤感或疼痛就换侧平举

  - id: cable-lateral-raise
    name: 单臂绳索侧平举
