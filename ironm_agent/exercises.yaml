      - 身体稍前倾
      - 手臂保持伸直，把杆向下压到大腿前
      - 慢慢回到起始位置
    cues: [手肘角度不变, 肩膀往下沉]
    mistakes: [弯手肘变成下压三头, 身体上下起伏借力]
    easier: 弹力带直臂下压
    harder: 单臂做
    avoid: 肩膀不适时减小向上的幅度

  - id: chest-supported-row
    name: 俯卧上斜哑铃划船
    part: 背
    muscles: 背阔肌、斜方肌、三角肌后束
    equipment: [哑铃]
    level: 入门
    common: false
    steps:
      - 凳子调成上斜，胸口趴在靠背上，双手拿哑铃垂下
      - 把哑铃拉向身体两侧
      - 顶端停一秒
      - 慢慢放下
    cues: [胸口一直贴住靠背, 手肘往后拉]
    mistakes: [胸口离开靠背借力]
    easier: 减轻重量
    harder: 加重、顶端停更久
    avoid: 腰背不适的人比较友好；肩膀疼时减小幅度

  - id: back-extension
    name: 山羊挺身
    part: 背
    muscles: 下背、臀大肌、腘绳肌
    equipment: [器械, 自重]
    level: 入门
    steps:
      - 趴在罗马椅上，髋部在垫子边缘，双手交叉抱胸
      - 上身慢慢向下弯
      - 臀部和下背发力抬起到身体成一条直线
      - 不要抬过头
    cues: [抬到身体成直线就停, 动作慢]
    mistakes: [抬过头，腰往后拱, 甩上去]
    easier: 地面俯卧挺身（小幅度）
    harder: 怀抱重物
    avoid: 腰背急性疼痛时先别做；有腰椎问题先问医生或康复师

  - id: dumbbell-shrug
    name: 哑铃耸肩
    part: 背
    muscles: 斜方肌
    equipment: [哑铃, 杠铃]
    level: 入门
    steps:
      - 双手各拿一只哑铃垂在身侧
      - 肩膀向耳朵方向耸起
      - 顶端停一秒
      - 慢慢放下
    cues: [直上直下，不要转圈, 手臂放松只是挂钩]
    mistakes: [肩膀转圈, 弯手肘去拉]
    easier: 减轻重量
    harder: 加重、顶端停更久
    avoid: 脖子不适时减轻重量；有颈椎问题先问医生

  - id: overhead-press
    name: 杠铃站姿推举
    part: 肩
    muscles: 三角肌前束和中束、肱三头肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 杠铃放在锁骨前，双手比肩略宽握杠
      - 收紧腹部和臀部
      - 把杠铃推过头顶，头稍后让再回正
      - 慢慢放回锁骨
    cues: [身体不后仰, 杠铃走直线]
    mistakes: [腰往后弯借力, 杠铃推到身体前方]
    easier: 哑铃推举、坐姿推肩机
    harder: 加重
    avoid: 肩膀有伤先别做；腰背不适时改坐姿有靠背的推举

  - id: machine-shoulder-press
    name: 坐姿推肩机
    part: 肩
    muscles: 三角肌前束和中束、肱三头肌
    equipment: [器械]
    level: 入门
    steps:
      - 调好座椅，把手在肩膀高度
      - 背靠靠垫，双手握把
      - 向上推到手臂接近伸直
      - 慢慢放回
    cues: [背部贴住靠垫, 不耸肩]
    mistakes: [推的时候屁股离开座椅, 放得太低肩膀疼]
    easier: 减轻重量
    harder: 哑铃推举
    avoid: 肩膀不适时减小下放幅度

  - id: front-raise
    name: 哑铃前平举
    part: 肩
    muscles: 三角肌前束
    equipment: [哑铃]
    level: 入门
    steps:
      - 双手持哑铃放在大腿前
      - 手肘微屈，把哑铃向前举到与肩同高
      - 停一秒
      - 慢慢放下
    cues: [不超过肩膀高度, 身体不晃]
    mistakes: [身体后仰甩上去]
    easier: 减轻重量、单臂交替
    harder: 顶端停更久
    avoid: 肩膀前侧疼时减小幅度

  - id: rear-delt-fly
    name: 俯身哑铃反向飞鸟
    part: 肩
    muscles: 三角肌后束、斜方肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 屈髋上身前倾，双手持哑铃垂在胸下，手肘微屈
      - 双臂向两侧打开到与身体平齐
      - 停一秒
      - 慢慢放下
    cues: [用肩膀后侧发力, 重量轻、动作慢]
    mistakes: [耸肩, 身体上下起伏]
    easier: 弹力带面拉
    harder: 顶端停更久
    avoid: 肩膀不适的人比较友好；腰背不适时改趴在上斜凳上做

  - id: upright-row
