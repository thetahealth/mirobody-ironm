    cues: [上臂贴住垫子, 下放慢]
    mistakes: [下放太快把肘部拉疼]
    easier: 减轻重量
    harder: 单臂做
    avoid: 肘部疼时不放到最底

  - id: cable-curl
    name: 绳索弯举
    part: 手臂
    muscles: 肱二头肌
    equipment: [器械, 弹力带]
    level: 入门
    steps:
      - 面对绳索架，握住低处的直杆
      - 上臂贴住身体，把杆弯起
      - 顶端停一秒
      - 慢慢放下
    cues: [上臂不动, 全程有张力]
    mistakes: [身体后仰]
    easier: 弹力带弯举
    harder: 单臂做
    avoid: 肘部疼时减轻重量

  - id: rope-pushdown
    name: 绳索下压
