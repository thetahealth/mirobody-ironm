    muscles: 胸大肌、肱三头肌
    equipment: [哑铃]
    level: 入门
    common: false
    steps:
      - 仰卧在地上，屈膝踩地，双手持哑铃
      - 上臂贴地时停一下
      - 推起到手臂接近伸直
      - 慢慢放下到上臂碰地
    cues: [上臂碰地后再推, 手肘约四十五度]
    mistakes: [上臂砸到地上]
    easier: 俯卧撑
    harder: 哑铃卧推
    avoid: 肩膀不适的人比较友好；仍疼就停

  - id: parallel-dip
    name: 双杠臂屈伸
    part: 胸
    muscles: 胸大肌下部、肱三头肌
    equipment: [器械]
    level: 进阶
    steps:
      - 双手撑在双杠上，手臂伸直
      - 身体稍前倾，屈肘下沉到上臂接近水平
      - 推起到手臂伸直
      - 动作慢、不晃
    cues: [肩膀往下沉，别耸到耳朵, 下沉到不疼的深度]
    mistakes: [下沉太深，肩膀前侧被拉疼, 身体乱晃]
    easier: 凳上臂屈伸、助力双杠
    harder: 加负重
    avoid: 肩膀有伤先别做；肩膀前侧疼就减小深度

  - id: barbell-row
    name: 杠铃俯身划船
    part: 背
    muscles: 背阔肌、斜方肌、三角肌后束
    equipment: [杠铃]
    level: 进阶
    steps:
      - 双手比肩略宽握杠，屈髋上身前倾约四十五度，背挺直
      - 把杠铃拉向肚脐
      - 顶端停一秒
      - 慢慢放下
    cues: [背部全程挺直, 手肘贴着身体往后拉]
    mistakes: [起身借力把杠铃甩上来, 弯腰拱背]
    easier: 单臂哑铃划船、俯卧上斜哑铃划船
    harder: 加重
    avoid: 腰背不适时换有胸部支撑的划船

  - id: seated-cable-row
    name: 坐姿绳索划船
    part: 背
    muscles: 背阔肌、斜方肌
    equipment: [器械]
    level: 入门
    steps:
      - 坐在划船机上，双脚踩住踏板，膝盖微屈
      - 双手握把，背挺直
      - 把把手拉向肚子，肩膀向后收
      - 慢慢伸直手臂回去
    cues: [上身不前后大幅摆动, 拉到底时挺胸]
    mistakes: [身体后仰借力, 耸肩]
    easier: 弹力带坐姿划船
    harder: 单臂做、顶端停更久
    avoid: 腰背不适时上身保持不动、减轻重量

  - id: inverted-row
    name: 反向划船
    part: 背
    muscles: 背阔肌、斜方肌、三角肌后束
    equipment: [单杠, 自重]
    level: 入门
