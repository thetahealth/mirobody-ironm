      - 手肘微屈，把手臂向侧面抬到与肩同高
      - 停一秒
      - 慢慢放下
    cues: [身体不晃, 不耸肩]
    mistakes: [身体侧倾借力]
    easier: 哑铃侧平举、减轻重量
    harder: 顶端停更久
    avoid: 肩膀疼时减小幅度

  - id: hammer-curl
    name: 锤式弯举
    part: 手臂
    muscles: 肱二头肌、前臂
    equipment: [哑铃]
