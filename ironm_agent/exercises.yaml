      - 上臂贴住身体，弯起前臂
      - 顶端停一秒
      - 慢慢放下
    cues: [上臂不动, 掌心始终相对]
    mistakes: [身体前后晃借力]
    easier: 减轻重量
    harder: 加重、交替做
    avoid: 肘部疼时减轻重量

  - id: barbell-curl
    name: 杠铃弯举
    part: 手臂
    muscles: 肱二头肌
    equipment: [杠铃]
    level: 入门
