      - 掌心朝前握住杠铃，双手与肩同宽
      - 上臂贴住身体，把杠铃弯起
      - 顶端停一秒
      - 慢慢放下
    cues: [上臂不动, 下放慢]
    mistakes: [身体后仰甩起来]
    easier: 哑铃弯举
    harder: 加重
    avoid: 手腕不适时换曲杆或哑铃

  - id: preacher-curl
    name: 牧师凳弯举
