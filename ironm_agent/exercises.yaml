      - 把胸口拉向杠
      - 慢慢放下
    cues: [身体保持一条直线, 胸口去碰杠]
    mistakes: [屁股下垂, 只用手臂拉]
    easier: 身体站得更直（杠调高）
    harder: 脚垫高、加负重
    avoid: 肩膀不适时减小幅度

  - id: chin-up
    name: 反手引体向上
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [单杠]
    level: 进阶
    steps:
      - 掌心朝自己，双手与肩同宽握杠
      - 身体悬垂，肩膀往下沉
      - 把身体拉起到下巴过杠
      - 慢慢放下到手臂伸直
    cues: [起拉前先沉肩, 下放慢]
    mistakes: [蹬腿摆动借力, 只拉一半]
    easier: 弹力带助力引体、反向划船
    harder: 加负重
    avoid: 肩膀或肘部疼时先别做，换高位下拉

  - id: straight-arm-pulldown
