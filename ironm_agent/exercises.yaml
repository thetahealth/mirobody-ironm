# 动作库：做法、要点、常见错误、替代动作、什么情况先别做。
# 内容由 Claude 按常见训练指南整理（claude_draft），待审定；页面上统一提示"出现疼痛就停，有伤病先问医生或康复师"。
# part：腿臀、胸、背、肩、手臂、核心、全身、有氧、拉伸放松；equipment：自重、哑铃、壶铃、弹力带、杠铃、单杠、器械、泡沫轴
# common：最常见的动作（§144，默认是）；在家替代器械用的冷门动作写 common: false
# 第二批（spec [2026-10-23] §32）：参考 free-exercise-db（Unlicense）的动作名称和主次肌肉，中文内容自己写
version: "0.1"
review: claude_draft

exercises:
  - id: bodyweight-squat
    name: 自重深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重]
    level: 入门
    steps:
      - 双脚略比肩宽，脚尖稍向外
      - 吸气，屈髋屈膝向下坐，双臂向前伸保持平衡
      - 蹲到大腿接近与地面平行，或不疼的深度
      - 脚掌发力站起，同时呼气
    cues: [膝盖顺着脚尖方向, 全脚掌着地，重心在脚掌中部, 背部挺直，胸口朝前]
    mistakes: [膝盖向内扣, 脚跟抬起]
    easier: 箱式深蹲（坐到箱子或椅子上再站起）
    harder: 高脚杯深蹲、保加利亚分腿蹲
    avoid: 蹲深时膝盖疼，先用箱子把深度限制在不疼的范围；疼痛越来越重就停

  - id: goblet-squat
    name: 高脚杯深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌、核心
    equipment: [哑铃, 壶铃]
    level: 入门
    steps:
      - 双手捧住一只哑铃或壶铃，贴在胸前
      - 双脚略比肩宽，脚尖稍向外
      - 屈髋屈膝下蹲，手肘落在两膝之间
      - 脚掌发力站起
    cues: [重物始终贴着胸口, 上身尽量直立, 膝盖顺着脚尖方向]
    mistakes: [重物离开身体，身体前倾, 蹲到底时腰背变圆]
    easier: 自重深蹲、箱式深蹲
    harder: 杠铃深蹲
    avoid: 膝盖蹲深会疼时先限制深度；腰背不适时先减轻重量、减小幅度

  - id: box-squat
    name: 箱式深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃, 壶铃, 杠铃]
    level: 入门
    steps:
      - 身后放一个稳固的箱子或椅子，高度定在下蹲不疼的位置
      - 向后坐，臀部轻轻碰到箱子，不完全坐实放松
      - 碰到后马上用脚掌发力站起
    cues: [向后坐，小腿尽量保持竖直, 轻碰即起，不要砸在箱子上, 不疼的话可以每周把箱子降低一点]
    mistakes: [坐实放松后再起，腰部受力, 起身时膝盖向内扣]
    easier: 从椅子上坐下、站起
    harder: 去掉箱子做全幅度深蹲
    avoid: 适合膝盖蹲深会疼时控制深度；如果碰到箱子的高度也疼，先别做，找医生或康复师看看

  - id: back-squat
    name: 杠铃深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌、竖脊肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 杠铃放在上背部（斜方肌上沿），双手握杠，收紧上背
      - 出架后双脚略比肩宽站稳
      - 深吸一口气撑住腹部，屈髋屈膝下蹲
      - 蹲到目标深度后发力站起，站直后再换气
    cues: [下蹲前先吸气撑住腹压, 膝盖顺着脚尖方向, 杠铃在脚掌中部正上方上下移动]
    mistakes: [起身时臀部先抬起，变成弯腰, 下蹲时腰背变圆]
    easier: 高脚杯深蹲
    harder: 每次小幅加重
    avoid: 新手先用高脚杯深蹲学会动作；在深蹲架里做并设好保护杆；腰痛发作期先别做

  - id: romanian-deadlift
    name: 罗马尼亚硬拉
    part: 腿臀
    muscles: 大腿后侧（腘绳肌）、臀大肌、竖脊肌
    equipment: [哑铃, 壶铃, 杠铃]
    level: 入门
    steps:
      - 站直，双手握哑铃或杠铃放在大腿前
      - 膝盖微屈并保持这个角度，臀部向后推，上身前倾，重物贴着大腿往下滑
      - 大腿后侧明显拉紧时停住（大约到膝盖下方）
      - 臀部向前推，回到站直
    cues: [动作来自髋部向后折，不是弯腰, 背部始终平直, 重物贴着腿走]
    mistakes: [弯腰去够地面, 膝盖弯得太多，变成了深蹲]
    easier: 徒手练习：双手叉腰，只练臀部向后推
    harder: 单腿罗马尼亚硬拉
    avoid: 腰痛发作期先别做；背部保持不了平直时减小幅度或减轻重量

  - id: deadlift
    name: 杠铃硬拉
    part: 腿臀
    muscles: 臀大肌、大腿后侧、竖脊肌、背阔肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 双脚与髋同宽，杠铃在脚掌中部正上方
      - 屈髋屈膝握杠，小腿贴近杠铃
      - 挺胸、收紧背部，吸气撑住腹部
      - 双腿推地把杠铃拉起，杠铃贴着腿上升，站直后按原路放下
    cues: [杠铃始终贴着腿, 先把背和腹部收紧再发力, 起身时髋和肩一起上升]
    mistakes: [圆背拉起, 杠铃离身体太远]
    easier: 罗马尼亚硬拉、壶铃硬拉
    harder: 每次小幅加重
    avoid: 腰痛发作期、背部保持不了平直时先别做；新手最好先跟教练学

  - id: bulgarian-split-squat
    name: 保加利亚分腿蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃]
    level: 进阶
    steps:
      - 背对凳子站立，一只脚的脚背搭在凳子上
      - 前脚向前迈出一大步站稳
      - 身体垂直下降，前腿屈膝到大腿接近水平
      - 前脚发力站起；做完一侧再换另一侧
    cues: [重心放在前脚, 前膝顺着脚尖方向, 上身稍向前倾并保持稳定]
    mistakes: [前脚离凳子太近，膝盖过度前移, 身体左右晃]
    easier: 原地分腿蹲（后脚踩在地上）
    harder: 双手各拿一只哑铃
    avoid: 膝盖疼时先减小下蹲幅度；平衡不好时扶墙做

  - id: reverse-lunge
    name: 后撤弓步
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 双脚并拢站立
      - 一条腿向后退一大步，前脚掌着地
      - 双膝弯曲下蹲，后膝接近地面
      - 前脚发力回到起始位置，左右交替
    cues: [前膝顺着脚尖，不向内扣, 上身保持直立, 比向前迈步的弓步对膝盖更友好]
    mistakes: [步子太小，前膝压力大, 身体向前倒]
    easier: 原地分腿蹲
    harder: 双手拿哑铃、行走弓步
    avoid: 膝盖疼时减小幅度；平衡不好时扶墙做

  - id: glute-bridge
    name: 臀桥
    part: 腿臀
    muscles: 臀大肌、大腿后侧
    equipment: [自重, 哑铃, 弹力带]
    level: 入门
    steps:
      - 仰卧，屈膝，双脚踩地与髋同宽
      - 收紧腹部，臀部发力把髋部抬起，直到肩、髋、膝成一条直线
      - 最高处停 1 秒，再慢慢放下
    cues: [用臀部发力，不用腰去顶, 下巴微收, 可以在膝盖上套弹力带向外撑]
    mistakes: [腰部过度反弓, 脚离臀部太远，大腿后侧抽筋]
    easier: 减小抬起的幅度
    harder: 单腿臀桥、把哑铃放在髋部
    avoid: 一般都可以做；腰部不适时减小幅度

  - id: step-up
    name: 台阶上下
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 面对一个稳固的台阶或凳子
      - 一只脚整个踩上台阶
      - 前脚发力把身体带上去站直，后脚不蹬地借力
      - 慢慢下来；做完一侧再换另一侧
    cues: [整个脚掌踩稳, 膝盖顺着脚尖方向, 下来时控制速度]
    mistakes: [后脚蹬地借力, 台阶太高，膝盖弯得太深]
    easier: 用更矮的台阶
    harder: 双手拿哑铃、用更高的台阶
    avoid: 膝盖疼时换更矮的台阶

  - id: calf-raise
    name: 提踵
    part: 腿臀
    muscles: 小腿（腓肠肌、比目鱼肌）
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 前脚掌站在台阶边缘，手扶墙保持平衡
      - 脚跟慢慢下沉，到小腿有拉伸感
      - 踮起脚尖到最高处，停 1 秒
      - 慢慢放下
    cues: [全程慢速, 最高处停一下, 膝盖伸直主要练腓肠肌，坐着做主要练比目鱼肌]
    mistakes: [上下弹动借力, 幅度太小]
    easier: 在平地上做
    harder: 单腿提踵、手拿哑铃
    avoid: 跟腱疼时先别做

  - id: band-lateral-walk
    name: 弹力带侧向走
    part: 腿臀
    muscles: 臀中肌
    equipment: [弹力带]
    level: 入门
    steps:
      - 弹力带套在膝盖上方或脚踝
      - 保持半蹲姿势
      - 一只脚向侧面迈一步，另一只脚跟上，弹力带始终绷着
      - 走 10–15 步后反方向走回来
    cues: [半蹲的高度保持不变, 膝盖向外撑, 上身不左右摇晃]
    mistakes: [身体忽高忽低, 双脚并拢让弹力带松掉]
    easier: 弹力带套在膝盖上方（阻力小一些）
    harder: 套在脚踝或换更紧的弹力带
    avoid: 一般都可以做，常用来热身、练臀部外侧

  - id: leg-press
    name: 腿举
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [器械]
    level: 入门
    steps:
      - 坐进腿举机，背和臀部贴紧靠垫
      - 双脚与髋同宽踩在踏板中部
      - 松开保险，屈膝把踏板放下来，到不疼、腰不离开靠垫的深度
      - 脚掌发力推起，膝盖不锁死
    cues: [腰臀始终贴着靠垫, 脚放高一些更多练到臀部、膝盖压力更小, 推到顶时膝盖留一点弯曲]
    mistakes: [放得太深，臀部离开靠垫、腰部变圆, 推到顶把膝盖锁死]
    easier: 减轻重量、减小幅度
    harder: 单腿腿举
    avoid: 膝盖疼时把脚放高、减小幅度

  - id: push-up
    name: 俯卧撑
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [自重]
    level: 入门
    steps:
      - 双手略比肩宽撑地，身体从头到脚成一条直线
      - 屈肘，让胸口下降到接近地面
      - 推起回到起始位置
    cues: [收紧腹部和臀部，不塌腰, 手肘和身体大约成 45 度, 下放时控制速度]
    mistakes: [塌腰或撅臀, 手肘向两侧张开成 90 度]
    easier: 跪姿俯卧撑、双手扶桌子或墙做
    harder: 双脚垫高、负重俯卧撑
    avoid: 肩膀前侧疼时减小幅度，或换成双手扶高的俯卧撑

  - id: dumbbell-bench-press
    name: 哑铃卧推
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [哑铃]
    level: 入门
    steps:
      - 仰卧在平凳上，双脚踩稳地面
      - 双手拿哑铃放在胸部两侧上方
      - 推起到手臂接近伸直
      - 慢慢放下，到胸部两侧有拉伸感
    cues: [肩胛骨向后、向下收紧, 手肘和身体大约成 45–60 度, 两只哑铃同时动]
    mistakes: [下放太快、在底部反弹, 手肘完全张开成 90 度]
    easier: 地板卧推（躺在地上做，手肘碰地就停）
    harder: 上斜哑铃卧推、加重
    avoid: 肩膀前侧疼时用地板卧推限制幅度

  - id: bench-press
    name: 杠铃卧推
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [杠铃]
    level: 进阶
    steps:
      - 仰卧在卧推凳上，眼睛在杠铃正下方
      - 握距略比肩宽，肩胛骨收紧下沉
      - 出杠后把杠铃放到胸骨下沿附近
      - 推起到手臂伸直
    cues: [双脚踩稳，臀部不离开凳子, 下放和推起的路线保持稳定, 大重量要有人保护或用安全杆]
    mistakes: [杠铃在胸口反弹, 臀部离开凳子]
    easier: 哑铃卧推、俯卧撑
    harder: 每次小幅加重
    avoid: 没有保护时不做大重量；肩痛时先换成哑铃卧推或地板卧推

  - id: one-arm-row
    name: 单臂哑铃划船
    part: 背
    muscles: 背阔肌、菱形肌、肱二头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 一只手和同侧膝盖撑在凳子上，背部平直
      - 另一只手拿哑铃，自然下垂
      - 屈肘把哑铃拉向髋部
      - 慢慢放下；做完一侧再换另一侧
    cues: [用背带动手肘向后上方拉, 背部平直，身体不扭转, 最高处稍停一下]
    mistakes: [扭身体借力, 耸肩去拉]
    easier: 减轻重量
    harder: 加重、最高处停 2 秒
    avoid: 腰部不适时一定要用手撑住

  - id: band-row
    name: 弹力带坐姿划船
    part: 背
    muscles: 背阔肌、菱形肌
    equipment: [弹力带]
    level: 入门
    steps:
      - 坐在地上双腿伸直，弹力带绕过脚掌，双手握住两端
      - 挺胸坐直
      - 屈肘把弹力带拉向腹部，肩胛骨向后夹
      - 慢慢放回
    cues: [先夹肩胛骨再屈肘, 不耸肩, 放回时控制速度]
    mistakes: [身体后仰借力, 耸肩]
    easier: 用更松的弹力带
    harder: 用更紧的弹力带、最高处停一下
    avoid: 一般都可以做

  - id: pull-up
    name: 引体向上
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [单杠, 弹力带]
    level: 进阶
    steps:
      - 双手正握单杠，略比肩宽，身体悬垂
      - 肩膀下沉，屈肘把身体拉起，到下巴过杠
      - 慢慢下放到手臂伸直
    cues: [先沉肩再拉, 身体不大幅摆动, 下放时控制速度]
    mistakes: [摆动身体借力, 只做一半幅度]
    easier: 弹力带辅助引体向上、高位下拉
    harder: 负重引体向上
    avoid: 肩部疼痛时先别做

  - id: lat-pulldown
    name: 高位下拉
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [器械, 弹力带]
    level: 入门
    steps:
      - 坐在下拉器上，大腿卡在靠垫下面
      - 双手略比肩宽握住横杆
      - 沉肩，把横杆拉到上胸前
      - 慢慢放回到手臂伸直
    cues: [挺胸，身体稍向后仰, 用手肘向下拉, 不要拉到脖子后面]
    mistakes: [身体大幅后仰借力, 拉到脖子后面]
    easier: 减轻重量
    harder: 加重、换窄握
    avoid: 肩部疼痛时减小幅度；在家可以把弹力带挂高处做

  - id: dumbbell-shoulder-press
    name: 哑铃推举
    part: 肩
    muscles: 三角肌、肱三头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 坐或站，双手拿哑铃放在肩膀两侧，掌心朝前
      - 向上推起到手臂接近伸直
      - 慢慢放回到肩膀旁边
    cues: [收紧腹部，腰不过度反弓, 推起时哑铃稍向中间靠拢, 下放时控制速度]
    mistakes: [腰部反弓借力, 放得太低、太快]
    easier: 坐在有靠背的凳子上做、减轻重量
    harder: 站着做、加重
    avoid: 举过头顶时肩痛就先别做，换成弹力带面拉或小重量侧平举

  - id: lateral-raise
    name: 侧平举
    part: 肩
    muscles: 三角肌中束
    equipment: [哑铃, 弹力带]
    level: 入门
    steps:
      - 站直，双手拿哑铃放在身体两侧
      - 手肘微屈，向两侧抬起到与肩同高
      - 慢慢放下
    cues: [用小重量, 手肘带动，略高于手腕, 不耸肩]
    mistakes: [甩动身体借力, 抬得太高、耸肩]
    easier: 单侧做、减轻重量
    harder: 最高处停一下、慢慢放下
    avoid: 抬起时肩痛就减小幅度

  - id: band-face-pull
    name: 弹力带面拉
    part: 肩
    muscles: 三角肌后束、菱形肌、肩袖肌群
    equipment: [弹力带]
    level: 入门
    steps:
      - 把弹力带固定在和脸差不多高的地方，双手握住两端后退拉紧
      - 屈肘把弹力带拉向脸部，双手向两侧分开
      - 手肘高于手腕，停 1 秒后慢慢放回
    cues: [肩胛骨向后夹, 手肘抬高, 动作放慢]
    mistakes: [身体后仰借力, 耸肩]
    easier: 用更松的弹力带
    harder: 用更紧的弹力带
    avoid: 一般都可以做，适合久坐、含胸圆肩的人

  - id: dumbbell-curl
    name: 哑铃弯举
    part: 手臂
    muscles: 肱二头肌
    equipment: [哑铃, 弹力带]
    level: 入门
    steps:
      - 站直，双手拿哑铃自然下垂，掌心朝前
      - 上臂贴住身体，屈肘把哑铃举到肩前
      - 慢慢放下
    cues: [上臂不前后移动, 不甩身体, 放下时控制速度]
    mistakes: [身体后仰借力, 手肘向前移]
    easier: 减轻重量、左右交替做
    harder: 锤式弯举、慢慢放下
    avoid: 一般都可以做

  - id: bench-dip
    name: 凳上臂屈伸
    part: 手臂
    muscles: 肱三头肌
    equipment: [自重]
    level: 入门
    steps:
      - 背对凳子，双手撑在凳子边缘，手指朝前
      - 双腿向前伸，臀部离开凳子
      - 屈肘让身体下降到上臂接近水平
      - 推起回到起始位置
    cues: [身体贴近凳子, 肩膀下沉，不耸肩, 不要下得太深]
    mistakes: [下得太深，肩膀前侧压力大, 手肘向外张开]
    easier: 屈膝做（脚离身体近一些）
    harder: 双脚垫高
    avoid: 肩膀前侧疼时换成弹力带下压或窄距俯卧撑

  - id: plank
    name: 平板支撑
    timed: true
    part: 核心
    muscles: 腹横肌、腹直肌
    equipment: [自重]
    level: 入门
    steps:
      - 前臂撑地，手肘在肩膀正下方
      - 双脚并拢，身体从头到脚成一条直线
      - 正常呼吸，坚持到目标时间
    cues: [收紧腹部和臀部, 不塌腰、不撅臀, 下巴微收]
    mistakes: [塌腰, 憋气]
    easier: 跪姿平板支撑
    harder: 抬起一只手或一条腿
    avoid: 腰痛、姿势保持不住时就停

  - id: dead-bug
    name: 死虫式
    part: 核心
    muscles: 腹横肌、腹直肌
    equipment: [自重]
    level: 入门
    steps:
      - 仰卧，双臂伸直朝上，屈髋屈膝把双腿抬起成 90 度
      - 腰背贴住地面
      - 同时伸出一侧手臂和对侧腿，到接近地面
      - 收回后换另一侧
    cues: [腰始终贴地, 动作要慢, 伸出去时呼气]
    mistakes: [腰离开地面拱起, 动作太快]
    easier: 只动腿或只动手
    harder: 手拿轻哑铃、腿伸得更远
    avoid: 适合腰部需要保护的人练核心

  - id: side-plank
    name: 侧平板支撑
    timed: true
    part: 核心
    muscles: 腹斜肌、臀中肌
    equipment: [自重]
    level: 入门
    steps:
      - 侧卧，前臂撑地，手肘在肩膀正下方
      - 双脚叠放，抬起髋部，身体成一条直线
      - 坚持到目标时间后换另一侧
    cues: [髋部不下沉, 身体不前后倒, 保持呼吸]
    mistakes: [髋部下垂, 耸肩]
    easier: 屈膝侧平板支撑
    harder: 抬起上面的那条腿
    avoid: 肩部疼痛时先别做

  - id: bird-dog
    name: 鸟狗式
    part: 核心
    muscles: 竖脊肌、臀大肌、腹横肌
    equipment: [自重]
    level: 入门
    steps:
      - 四点跪姿，手在肩膀下方，膝盖在髋部下方
      - 同时伸出一侧手臂和对侧腿，到和身体成一条直线
      - 停 2 秒，收回后换另一侧
    cues: [背部保持平直，不左右晃, 伸出去时像往远处够, 动作要慢]
    mistakes: [腰部反弓, 骨盆歪向一侧]
    easier: 只伸手或只伸腿
    harder: 收回时手肘碰膝盖，再伸展
    avoid: 一般都可以做，常用于腰背的热身和康复训练

  - id: kettlebell-swing
    name: 壶铃摇摆
    part: 全身
    muscles: 臀大肌、大腿后侧、核心
    equipment: [壶铃, 哑铃]
    level: 进阶
    steps:
      - 双脚略比肩宽，壶铃放在身前
      - 屈髋抓住壶铃，向后摆到两腿之间
      - 臀部用力向前推，把壶铃荡到胸口高度
      - 随着惯性下落，再次屈髋接住，连续做
    cues: [发力来自髋部前推，不是用手臂抬, 背部保持平直, 站直时收紧臀部和腹部]
    mistakes: [做成了深蹲, 用手臂往上抬, 圆背]
    easier: 先练罗马尼亚硬拉、壶铃硬拉
    harder: 加重、单手摇摆
    avoid: 腰痛时先别做；先学会臀部向后折的动作

  - id: burpee
    name: 波比跳
    part: 全身
    muscles: 全身、心肺
    equipment: [自重]
    level: 进阶
    steps:
      - 站立，下蹲双手撑地
      - 双脚向后跳成俯卧撑姿势
      - 双脚跳回手边
      - 向上跳起，双手举过头顶
    cues: [落地要轻，膝盖微屈, 撑地时身体成一条直线, 按自己的节奏做]
    mistakes: [塌腰, 落地太重]
    easier: 不跳：双脚一步步后撤、再走回来站起
    harder: 撑地时加一个俯卧撑
    avoid: 膝盖、脚踝有伤或半月板有问题时先别做跳跃动作

  - id: cycling
    name: 骑行（动感单车）
    part: 有氧
    muscles: 心肺、大腿
    equipment: [器械]
    level: 入门
    steps:
      - 调好座椅高度：脚踩到最低点时膝盖微屈
      - 先用低阻力热身 5 分钟
      - 中等强度骑 20–40 分钟（能说话、但不能唱歌）
      - 最后用低阻力放松 5 分钟
    cues: [膝盖对准脚尖方向, 上身放松, 阻力从低往高加]
    mistakes: [座椅太低，膝盖压力大, 阻力太大，蹬不圆]
    easier: 降低阻力、缩短时间
    harder: 快慢交替的间歇骑行
    avoid: 对膝盖冲击小，适合不能跑跳的人

  - id: brisk-walk
    name: 快走
    part: 有氧
    muscles: 心肺、腿部
    equipment: [自重]
    level: 入门
    steps:
      - 先慢走 5 分钟热身
      - 加快到微微喘、还能说完整句子的速度
      - 保持 20–40 分钟
      - 最后慢走 5 分钟放松
    cues: [步子自然，手臂前后摆动, 脚跟先着地再过渡到脚尖, 穿合脚、有缓冲的鞋]
    mistakes: [一开始就走太快, 低头含胸]
    easier: 放慢速度、缩短时间
    harder: 走上坡、加快速度
    avoid: 走路时胸闷、胸痛、头晕要马上停下并就医

  - id: front-squat
    name: 杠铃前蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌、核心
    equipment: [杠铃]
    level: 进阶
    steps:
      - 杠铃架在肩膀前侧和锁骨上，手指托住杠铃，手肘抬高
      - 双脚与肩同宽，吸气收紧腹部后下蹲
      - 蹲到大腿接近水平或不疼的深度
      - 脚掌发力站起，手肘始终抬高
    cues: [手肘向前抬高，别让杠铃滑下来, 上身比后蹲更直立]
    mistakes: [手肘下垂导致上身前倾, 蹲到底时腰背变圆]
    easier: 高脚杯深蹲
    harder: 暂停前蹲（在最低点停两秒）
    avoid: 手腕或肩膀够不到托杠姿势时先用交叉手托杠或换高脚杯深蹲；膝盖疼先限制深度

  - id: walking-lunge
    name: 哑铃行进弓步
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [哑铃, 自重]
    level: 入门
    steps:
      - 双手各拿一只哑铃垂在身侧
      - 向前迈一大步，后膝向地面下沉
      - 前脚发力站起，后脚跟上迈成下一步
      - 左右交替向前走
    cues: [前膝顺着脚尖方向, 上身直立，步子迈够大]
    mistakes: [步子太小，前膝过度前冲, 前膝向内扣]
    easier: 原地弓步、反向弓步
    harder: 加重或改成后脚垫高的保加利亚分腿蹲
    avoid: 膝盖疼时缩小下蹲幅度或换反向弓步；平衡不好先不拿哑铃

  - id: hip-thrust
    name: 哑铃臀推
    part: 腿臀
    muscles: 臀大肌、腘绳肌
    equipment: [哑铃, 杠铃]
    level: 入门
    steps:
      - 上背靠在凳子边缘，哑铃放在髋部，双手扶住
      - 双脚踩地，小腿大致垂直地面
      - 臀部发力把髋向上推到身体成一条直线
      - 顶端停一秒，慢慢放下
    cues: [用屁股发力往上顶，不是用腰, 下巴微收，目光看前方]
    mistakes: [顶到最高时腰往上拱, 脚离身体太远，变成大腿后侧发力]
    easier: 臀桥（不靠凳子、不负重）
    harder: 单腿臀推、杠铃臀推
    avoid: 腰背不适时减轻重量、顶到身体成直线就停，别再往上拱

  - id: sumo-deadlift
    name: 壶铃相扑硬拉
    part: 腿臀
    muscles: 臀大肌、大腿内侧、腘绳肌
    equipment: [壶铃, 哑铃]
    level: 入门
    steps:
      - 双脚比肩宽很多，脚尖朝外，壶铃放在两脚中间
      - 屈髋屈膝下蹲，双手握住壶铃，背部挺直
      - 脚掌发力站起，髋部向前推
      - 慢慢把壶铃放回地面
    cues: [膝盖顺着脚尖方向打开, 壶铃贴近身体垂直上下]
    mistakes: [膝盖向内扣, 起身时先抬屁股，变成弯腰拉]
    easier: 高脚杯深蹲
    harder: 杠铃相扑硬拉
    avoid: 腰背不适时减轻重量；膝盖往里扣说明重量太大

  - id: single-leg-rdl
    name: 单腿罗马尼亚硬拉
    part: 腿臀
    muscles: 腘绳肌、臀大肌、臀中肌
    equipment: [哑铃, 壶铃, 自重]
    level: 进阶
    steps:
      - 单腿站立，支撑腿膝盖微屈，另一只手拿哑铃
      - 上身前倾，后腿向后抬起，身体像跷跷板
      - 感到大腿后侧拉紧时停下
      - 臀部发力回到站立
    cues: [髋部保持水平，别向一侧翻开, 背部挺直，从髋部折叠]
    mistakes: [后腿那侧的髋部向外翻, 弯腰去够地面]
    easier: 双腿罗马尼亚硬拉、扶墙做
    harder: 加重或手里拿更重的壶铃
    avoid: 平衡不稳先扶墙或不负重；腰背不适减小幅度

  - id: leg-extension
    name: 坐姿腿屈伸
    part: 腿臀
    muscles: 股四头肌
    equipment: [器械]
    level: 入门
    steps:
      - 坐在腿屈伸机上，小腿前侧抵住滚垫
      - 大腿前侧发力把小腿踢直
      - 顶端停一秒
      - 慢慢放回，不让配重砸下来
    cues: [动作慢、全程控制, 背部贴住靠背]
    mistakes: [靠甩腿把重量踢上去, 下放太快]
    easier: 减轻重量或单腿做
    harder: 顶端多停几秒
    avoid: 膝盖前侧疼时减小幅度（只做后半程），仍疼就停

  - id: lying-leg-curl
    name: 俯卧腿弯举
    part: 腿臀
    muscles: 腘绳肌
    equipment: [器械]
    level: 入门
    steps:
      - 趴在腿弯举机上，滚垫压在脚踝后上方
      - 大腿后侧发力把小腿往屁股方向弯
      - 顶端停一秒
      - 慢慢放回
    cues: [髋部贴住垫子不抬起, 放回时慢慢来]
    mistakes: [屁股翘起来借力, 放回太快]
    easier: 减轻重量
    harder: 单腿做、下放更慢
    avoid: 大腿后侧拉伤恢复期先用很轻的重量；抽筋就停

  - id: seated-calf-raise
    name: 坐姿提踵
    part: 腿臀
    muscles: 小腿
    equipment: [哑铃, 器械]
    level: 入门
    steps:
      - 坐在凳子上，前脚掌踩在踏板或书上，哑铃压在膝盖上
      - 脚跟尽量抬高
      - 顶端停一秒
      - 慢慢放下到脚跟低于前脚掌
    cues: [全程慢、幅度做满, 膝盖保持弯着]
    mistakes: [弹着做、幅度太小]
    easier: 不负重做
    harder: 加重、顶端停更久
    avoid: 跟腱疼时先不做底部的拉伸位置，只做上半程

  - id: good-morning
    name: 杠铃早安式
    part: 腿臀
    muscles: 腘绳肌、竖脊肌、臀大肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 杠铃放在上背，双脚与肩同宽，膝盖微屈
      - 屁股向后推，上身前倾到接近水平或大腿后侧拉紧
      - 背部始终挺直
      - 臀部发力回到站立
    cues: [从髋部折叠，不是弯腰, 重量要轻]
    mistakes: [背部弯曲, 重量太大]
    easier: 罗马尼亚硬拉、空杆早安式
    harder: 加重
    avoid: 腰背有伤先别做；用很轻的重量学动作

  - id: hack-squat
    name: 哈克深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [器械]
    level: 入门
    steps:
      - 背靠哈克深蹲机的靠垫，肩膀顶住肩垫
      - 双脚在踏板中间、与肩同宽
      - 屈膝下蹲到不疼的深度
      - 脚掌发力推起，不锁死膝盖
    cues: [背部全程贴住靠垫, 膝盖顺着脚尖方向]
    mistakes: [蹲到底时屁股离开靠垫, 顶端膝盖锁死]
    easier: 腿举
    harder: 加重、下放更慢
    avoid: 膝盖疼时脚放高一点、限制深度

  - id: side-lunge
    name: 哑铃侧弓步
    part: 腿臀
    muscles: 大腿内侧、臀大肌、股四头肌
    equipment: [哑铃, 自重]
    level: 入门
    steps:
      - 双脚并拢站立，双手捧一只哑铃在胸前
      - 一只脚向侧面迈一大步，屈这侧膝盖、屁股向后坐
      - 另一条腿伸直
      - 迈出的脚发力推回
    cues: [屈的那侧膝盖顺着脚尖, 脚跟踩实]
    mistakes: [膝盖向内扣, 上身过度前倾]
    easier: 不负重、迈小一点
    harder: 加重、侧滑弓步
    avoid: 膝盖内侧疼时减小幅度；大腿内侧拉伤恢复期先别做

  - id: hip-abduction
    name: 坐姿髋外展
    part: 腿臀
    muscles: 臀中肌
    equipment: [器械, 弹力带]
    level: 入门
    steps:
      - 坐在髋外展机上，垫子贴住大腿外侧
      - 大腿向外打开
      - 顶端停一秒
      - 慢慢收回
    cues: [动作慢, 上身稳定不晃]
    mistakes: [靠身体前后晃动借力]
    easier: 弹力带坐姿外展
    harder: 上身稍前倾做、顶端停更久
    avoid: 髋部疼时减小幅度

  - id: pistol-squat
    name: 单腿深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌、臀中肌
    equipment: [自重]
    level: 进阶
    common: false
    steps:
      - 单腿站立，另一条腿向前伸直
      - 双臂向前平举保持平衡
      - 支撑腿慢慢蹲到能控制的深度
      - 支撑腿发力站起
    cues: [支撑腿膝盖顺着脚尖, 全脚掌踩地]
    mistakes: [膝盖向内扣, 蹲到底失去控制摔坐下去]
    easier: 坐到箱子上再站起的单腿蹲
    harder: 手里拿一个小重量配重
    avoid: 膝盖疼或平衡不好先别做，用箱子限制深度练

  - id: band-kickback
    name: 弹力带臀部后踢
    part: 腿臀
    muscles: 臀大肌
    equipment: [弹力带]
    level: 入门
    common: false
    steps:
      - 四点跪姿，弹力带一头套在脚上、一头压在手下
      - 一条腿向后上方蹬直
      - 顶端停一秒
      - 慢慢收回
    cues: [腰背保持平直，别塌腰, 用屁股发力]
    mistakes: [踢腿时腰往下塌]
    easier: 不加弹力带
    harder: 换更紧的弹力带
    avoid: 腰背不适时幅度减小，蹬到和身体平齐就停

  - id: incline-dumbbell-press
    name: 上斜哑铃卧推
    part: 胸
    muscles: 胸大肌上部、三角肌前束、肱三头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 凳子调到约三十度，躺好，双手持哑铃在胸部上方
      - 慢慢把哑铃放到胸部两侧
      - 推起到手臂接近伸直
      - 保持肩膀贴着凳子
    cues: [手肘和身体夹角约四十五度, 肩膀往下沉]
    mistakes: [凳子调得太陡，变成推肩, 手肘张得太开]
    easier: 平板哑铃卧推、上斜俯卧撑
    harder: 上斜杠铃卧推
    avoid: 肩膀前侧疼时减小下放深度或换平板卧推

  - id: incline-bench-press
    name: 上斜杠铃卧推
    part: 胸
    muscles: 胸大肌上部、三角肌前束、肱三头肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 躺在上斜卧推凳上，双手比肩略宽握杠
      - 把杠铃慢慢放到上胸
      - 推起到手臂接近伸直
      - 双脚踩实，肩膀贴凳
    cues: [肩胛收紧贴凳, 杠铃落在上胸]
    mistakes: [屁股离开凳子, 杠铃落点太靠下]
    easier: 上斜哑铃卧推
    harder: 加重
    avoid: 肩膀不适时改用哑铃或减小下放深度；做大重量要有人保护

  - id: dumbbell-fly
    name: 哑铃飞鸟
    part: 胸
    muscles: 胸大肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 平躺在凳子上，双手持哑铃举在胸部上方，手肘微屈
      - 双臂向两侧打开，像抱一棵大树
      - 打开到胸部拉紧、和肩平齐就停
      - 胸部发力把哑铃合拢
    cues: [手肘始终微屈不变, 重量要轻]
    mistakes: [放得太低，肩膀前侧被拉得疼, 手臂完全伸直]
    easier: 绳索夹胸、减轻重量
    harder: 上斜飞鸟
    avoid: 肩膀前侧疼时减小打开幅度，或换绳索夹胸

  - id: cable-crossover
    name: 绳索夹胸
    part: 胸
    muscles: 胸大肌
    equipment: [器械]
    level: 入门
    steps:
      - 站在绳索架中间，双手各握一个把手，身体稍前倾
      - 手肘微屈，双手向身体前下方合拢
      - 合拢时停一秒
      - 慢慢打开回到起始位置
    cues: [手肘角度不变, 用胸部发力把手合拢]
    mistakes: [弯手肘变成推, 身体前后晃]
    easier: 减轻重量
    harder: 单臂做、合拢时停更久
    avoid: 肩膀前侧疼时打开幅度小一点

  - id: machine-chest-press
    name: 坐姿推胸机
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [器械]
    level: 入门
    steps:
      - 调好座椅，把手和胸部中间平齐
      - 背靠靠垫，双手握住把手
      - 向前推到手臂接近伸直
      - 慢慢收回
    cues: [肩膀往下沉、贴住靠背, 推的时候呼气]
    mistakes: [耸肩, 收回太快]
    easier: 减轻重量
    harder: 哑铃卧推
    avoid: 肩膀不适时把座椅调高一点、减小幅度

  - id: pec-deck
    name: 蝴蝶机夹胸
    part: 胸
    muscles: 胸大肌
    equipment: [器械]
    level: 入门
    steps:
      - 坐在蝴蝶机上，前臂或双手放在把手上
      - 胸部发力把双臂向中间合拢
      - 合拢时停一秒
      - 慢慢打开到胸部拉紧
    cues: [动作慢, 肩膀不耸起]
    mistakes: [打开太大，肩膀前侧疼, 借甩动合拢]
    easier: 减轻重量
    harder: 合拢时停更久
    avoid: 肩膀前侧疼时减小打开幅度

  - id: decline-push-up
    name: 下斜俯卧撑
    part: 胸
    muscles: 胸大肌上部、三角肌前束、肱三头肌
    equipment: [自重]
    level: 进阶
    steps:
      - 双脚放在凳子或台阶上，双手撑地比肩略宽
      - 身体从头到脚成一条直线
      - 屈肘把胸部降向地面
      - 推起
    cues: [身体保持一条直线, 手肘约四十五度]
    mistakes: [塌腰, 头往下扎]
    easier: 标准俯卧撑
    harder: 单脚垫高、加负重背心
    avoid: 肩膀或手腕疼时先做标准俯卧撑

  - id: dumbbell-floor-press
    name: 哑铃地板卧推
