# 常见食物库（spec [2026-10-23] §118 需求 1）：记一餐、改份量、食谱、饮食计划都按这里算。
# 原料：每 100 克可食部分的 [热量 千卡, 蛋白质 克, 碳水 克, 脂肪 克]；肉和水产标明生重还是熟重。
#   数值按 USDA FoodData Central（公有领域）等公开资料整理并取整，个别中式食物参考常见公开数据；
#   有版权的成分表原文不进仓库。
#   碳水按公开数据含膳食纤维，纤维多的蔬菜按"碳水 × 4"算热量会比这里写的高一些，热量以这里写的为准。
# 菜品：只写原料各多少克（生重）和多少油，每 100 克的营养由代码按原料算；按原料总重算每 100 克，
#   没算烹调中水分的变化，是估算。油量少油 ×0.5、多油 ×1.5（经验）。
# unit：常见的一份叫什么、大约多少克（菜品默认一份 = 原料加油的总重）。
# 内容由 Claude 整理，待审定。
