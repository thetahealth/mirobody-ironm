    population: "成年人（14 项研究、392 人；多为 4–12 周的短期研究）"
    summary: "每周训练量相同时，分化训练和全身训练在力量和增肌上没有明显差别，可以按个人喜好和时间安排来选。"
    points:
      - text: "每周训练量相同时，分化和全身两种安排对卧推和下肢力量的提高没有明显差别。"
        where: "Abstract（Results）"
      - text: "两种安排在上臂、大腿肌肉横截面积和瘦体重的增加上也没有明显差别。"
        where: "Abstract（Results）"
      - text: "训练量相同时，可以按个人喜好选择分化或全身训练。"
        where: "Abstract（Conclusions）"
    keywords: [分化, 全身, 上下肢, 推拉腿, 怎么分, 练法, 一天练一个部位]
    url: https://doi.org/10.1519/JSC.0000000000004774
    review: claude_draft

  - id: K63
    domains: [training]
    title: "弹力带和常规器械练出的力量差不多"
    source: "Effects of training with elastic resistance versus conventional resistance on muscular strength: A systematic review and meta-analysis（SAGE Open Med 7:2050312119831116；2020 年有更正）"
    publisher: "Lopes、Machado、Micheletti 等"
    year: 2019
    level: systematic_review
    population: "8 项研究：青少年、运动员、冠心病和慢阻肺患者、健康成年人、大学生"
    summary: "用弹力带练和用固定器械、自由重量练，上肢和下肢力量的提高没有明显差别。"
    points:
      - text: "弹力带训练和常规器械训练相比，上肢和下肢力量的提高都没有明显差别。"
        where: "Abstract（Results）；2020 年更正"
      - text: "弹力带训练在不同人群、不同方案里都能带来和常规训练相近的力量提高。"
        where: "Abstract（Conclusion）"
    keywords: [弹力带, 在家, 居家, 没器械, 阻力带]
