  - id: K64
    domains: [training, nutrition]
    title: "减重需要多少运动量（ACSM 2009）"
    source: "Appropriate Physical Activity Intervention Strategies for Weight Loss and Prevention of Weight Regain for Adults（Med Sci Sports Exerc 41(2):459–471）"
    publisher: "美国运动医学会（Donnelly、Blair、Jakicic 等）"
    year: 2009
    level: position_stand
    population: "超重或肥胖的成年人"
    summary: "每周 150–250 分钟中等强度活动能防止体重增加，只带来少量减重；超过 250 分钟和更明显的减重、减重后不反弹有关；力量训练本身不加快减重，但能增加去脂体重、改善健康风险。"
    points:
      - text: "每周 150–250 分钟中等强度身体活动能有效防止体重增加。"
        where: "Abstract"
      - text: "每周 150–250 分钟中等强度活动只带来少量减重；超过 250 分钟和有临床意义的减重有关。"
        where: "Abstract"
      - text: "减重后每周活动超过 250 分钟，更容易保持体重。"
        where: "Abstract"
      - text: "力量训练不会加快减重，但可能增加去脂体重，并和健康风险降低有关。"
        where: "Abstract"
    keywords: [减重, 减肥, 减脂, 运动多少, 每周多少分钟, 反弹]
    url: https://doi.org/10.1249/MSS.0b013e3181949333
    review: claude_draft

  - id: K65
    domains: [training]
    title: "高强度间歇和持续有氧都能明显提高最大摄氧量"
    source: "Effectiveness of High-Intensity Interval Training (HIT) and Continuous Endurance Training for VO2max Improvements: A Systematic Review and Meta-Analysis of Controlled Trials（Sports Med 45(10):1469–1481）"
    publisher: "Milanović、Sporiš、Weston"
    year: 2015
    level: systematic_review
    population: "18–45 岁健康成年人（28 项对照研究、723 人，平均 25 岁）"
    summary: "和不运动相比，持续有氧和高强度间歇都能大幅提高最大摄氧量；两者直接比较时，高强度间歇多出的提高幅度不大（约 1.2 毫升/千克/分钟）；基础体能越差、练的周期越长，提高越多。"
    points:
      - text: "和不运动相比，持续有氧训练让最大摄氧量平均提高约 4.9 毫升/千克/分钟，高强度间歇约 5.5 毫升/千克/分钟，都属于大的提高。"
        where: "Abstract（Results）"
      - text: "高强度间歇和持续有氧直接比较时，高强度间歇只多提高约 1.2 毫升/千克/分钟，属于可能的小优势。"
        where: "Abstract（Results）"
      - text: "基础体能较差、训练周期较长的人，最大摄氧量提高得更多。"
        where: "Abstract（Results）"
    keywords: ["HIIT", "高强度间歇", "间歇跑", "有氧", "慢跑", "心肺", "最大摄氧量", "耐力"]
    url: https://doi.org/10.1007/s40279-015-0365-0
    review: claude_draft

  - id: K66
    domains: [training, nutrition]
    title: "高强度间歇和中等强度持续有氧减脂效果差不多"
    source: "The effects of high-intensity interval training vs. moderate-intensity continuous training on body composition in overweight and obese adults: a systematic review and meta-analysis（Obes Rev 18(6):635–646）"
    publisher: "Wewege、van den Berg、Ward、Keech"
    year: 2017
    level: systematic_review
    population: "18–45 岁超重或肥胖成年人（13 项研究，平均每周 3 次、练 10 周）"
    summary: "高强度间歇和中等强度持续有氧都能减少全身脂肪和腰围，两者在各项身体成分指标上没有明显差别，但高强度间歇约少花 40% 的时间；短期内体重本身可能变化不大。"
    points:
      - text: "高强度间歇和中等强度持续有氧都能明显减少全身脂肪量和腰围。"
        where: "Abstract（Results）"
      - text: "两种练法在所有身体成分指标上都没有明显差别，但高强度间歇少花约 40% 的训练时间。"
        where: "Abstract（Results）"
      - text: "短期有氧训练能小幅改善身体成分，即使体重没有跟着变化。"
        where: "Abstract（Conclusions）"
    keywords: ["HIIT", "间歇", "有氧减脂", "燃脂", "腰围", "体脂", "跑步减肥", "哪种有氧"]
    url: https://doi.org/10.1111/obr.12532
    review: claude_draft

  - id: K67
    domains: [training, data]
    title: "说话测试：用能不能舒服说话判断有氧强度"
    source: "The talk test: a useful tool for prescribing and monitoring exercise intensity（Curr Opin Cardiol 29(5):475–480）"
    publisher: "Reed、Pipe"
    year: 2014
    level: review
    population: "健康成年人、运动员和心血管病患者"
    summary: "运动时还能舒服地连贯说话，强度一般在通气阈或乳酸阈以下；说不了完整的话，强度就超过了这个阈值；用说话测试定出的强度落在中等到较大强度范围内，在走、跑、骑车等不同方式里都一致，但不太适合用来控制高强度间歇。"
    points:
      - text: "还能舒服说话时，运动强度通常低于通气阈或乳酸阈；已经不能舒服说话时，强度通常超过这个阈值。"
        where: "Abstract（Recent findings）"
      - text: "用说话测试定出的强度落在指南认可的中等到较大强度范围内。"
        where: "Abstract（Recent findings）"
      - text: "说话测试在步行、慢跑、骑车、椭圆机、爬楼机上结果一致，但可能不适合用来控制高强度间歇。"
        where: "Abstract（Recent findings）"
      - text: "说话测试有效、可靠、简便、不花钱，适合健康成年人、运动员和心血管病患者。"
        where: "Abstract（Summary）"
    keywords: ["说话测试", "能不能说话", "喘不喘", "强度怎么判断", "没有心率表", "有氧强度", "中等强度"]
    url: https://doi.org/10.1097/HCO.0000000000000097
    review: claude_draft

  - id: K68
    domains: [training, safety]
    title: "新手跑步：照“每周加 10%”慢慢加，受伤并没有更少"
    source: "No effect of a graded training program on the number of running-related injuries in novice runners: a randomized controlled trial（Am J Sports Med 36(1):33–39）"
    publisher: "Buist、Bredeweg、van Mechelen、Lemmink、Pepping、Diercks"
    year: 2008
    level: rct
    population: "准备参加 6.7 公里业余跑步活动的新手跑者（532 人）"
    summary: "按每周加 10% 规则设计的 13 周渐进跑步计划，和普通 8 周计划相比，跑步相关伤病的发生率没有差别，两组都约有五分之一的人受伤；说明新手跑步受伤很常见，单靠“每周加 10%”这条规则并不能预防。"
    points:
      - text: "按每周加 10% 规则设计的 13 周渐进计划，和普通 8 周计划相比，跑步相关伤病没有减少。"
        where: "Abstract（Results、Conclusions）"
      - text: "两组跑步相关伤病的发生率都在 20% 左右（20.8% 和 20.3%）。"
        where: "Abstract（Results）"
      - text: "研究把跑步相关伤病定义为下肢或腰背的肌肉骨骼不适、至少一周影响跑步。"
        where: "Abstract（Methods）"
    keywords: ["新手跑步", "开始跑步", "跑步受伤", "10%原则", "加量", "跑量", "跑步计划"]
    url: https://doi.org/10.1177/0363546507307505
    review: claude_draft

  - id: K69
    domains: [training, safety]
    title: "新手跑量一下子加太多，和某些跑步伤有关"
    source: "Excessive progression in weekly running distance and risk of running-related injuries: an association which varies according to type of injury（J Orthop Sports Phys Ther 44(10):739–747）"
    publisher: "Nielsen、Parner、Nohr、Sørensen、Lind、Rasmussen"
    year: 2014
    level: study
    population: "自行开始跑步的健康新手（874 人，前瞻性队列，随访 1 年）"
    summary: "按每周跑量增幅分组，总的跑步伤病发生率没有明显差别；但每周跑量增幅超过 30% 的人，和跑量相关的伤（髌股疼痛、髂胫束综合征、胫骨内侧应力综合征等）有增多的趋势（未达统计学显著）；作者建议新手每周跑量增幅不超过 30%，但这是探索性结论。"
    points:
      - text: "按跑量增幅（低于 10%、10%–30%、高于 30%）分组，总的跑步伤病发生率没有明显差别。"
        where: "Abstract（Results）"
      - text: "跑量增幅超过 30% 的人，髌股疼痛、髂胫束综合征、胫骨内侧应力综合征等跑量相关的伤有增多趋势（风险比约 1.59，P = 0.07，未达显著）。"
        where: "Abstract（Results）"
      - text: "作者建议新手每周跑量增幅控制在 30% 以内，但说明这是探索性研究，需要随机试验验证。"
        where: "Abstract（Conclusion）"
    keywords: ["跑量", "加量", "新手跑步", "跑步受伤", "髂胫束", "胫骨疼", "膝盖疼"]
    url: https://doi.org/10.2519/jospt.2014.5164
    review: claude_draft

  - id: K70
    domains: [training, exercise]
    title: "练前静态拉伸：每个部位不到 60 秒影响很小"
    source: "Acute effects of muscle stretching on physical performance, range of motion, and injury incidence in healthy active individuals: a systematic review（Appl Physiol Nutr Metab 41(1):1–11）"
    publisher: "Behm、Blazevich、Kay、McHugh"
    year: 2016
    level: systematic_review
    population: "健康、经常运动的人"
    summary: "拉伸后马上测试，静态拉伸和 PNF 拉伸让表现小幅下降、动态拉伸小幅提高；静态拉伸每个肌群 60 秒以上下降更多，不到 60 秒影响很小；拉伸后再做动态热身时影响不明显；拉伸能暂时增加关节活动度，一般维持不到 30 分钟。"
    points:
      - text: "拉伸后马上测试，静态拉伸让表现平均下降约 3.7%，PNF 拉伸约 4.4%，动态拉伸反而提高约 1.3%。"
        where: "Abstract"
      - text: "每个肌群静态拉伸 60 秒及以上，表现下降约 4.6%；不到 60 秒只下降约 1.1%。"
        where: "Abstract"
      - text: "拉伸后再做动态热身活动时，对后续表现没有明显影响。"
        where: "Abstract"
      - text: "静态拉伸和 PNF 拉伸对总体伤病和劳损类伤病没有明确的预防作用。"
        where: "Abstract"
      - text: "各种拉伸都能增加关节活动度，但这种一次性的增加一般维持不到 30 分钟。"
        where: "Abstract"
    keywords: ["拉伸", "静态拉伸", "动态拉伸", "练前拉伸", "热身拉伸", "拉伸多久", "柔韧"]
    url: https://doi.org/10.1139/apnm-2015-0235
    review: claude_draft

  - id: K71
    domains: [training, exercise]
    title: "长期拉伸能增加关节活动度"
    source: "Chronic effects of stretching on range of motion with consideration of potential moderating variables: A systematic review with meta-analysis（J Sport Health Sci 13(2):186–194）"
    publisher: "Konrad、Alizadeh、Daneshjoo 等"
    year: 2024
    level: systematic_review
    population: "健康人（77 项研究、186 个效应量）"
    summary: "坚持拉伸训练能中等程度地增加关节活动度；静态拉伸和 PNF 拉伸比弹震式、动态拉伸效果更好；拉伸的时长、强度、频率和效果之间没有发现明显关系。"
    points:
      - text: "和不拉伸相比，坚持拉伸训练能中等程度地增加关节活动度。"
        where: "Abstract（Results）"
      - text: "想长期增加活动度，静态拉伸或 PNF 拉伸比弹震式或动态拉伸效果更好。"
        where: "Abstract（Results、Conclusion）"
      - text: "拉伸的量、强度和频率都没有发现对活动度的增加有明显影响。"
        where: "Abstract（Conclusion）"
    keywords: ["柔韧性", "活动度", "筋紧", "拉伸", "劈叉", "压腿", "身体硬", "够不到脚尖"]
    url: https://doi.org/10.1016/j.jshs.2023.06.002
    review: claude_draft

  - id: K72
    domains: [recovery, exercise]
    title: "泡沫轴：练前用小幅提高柔韧，练后用稍减酸痛"
    source: "A Meta-Analysis of the Effects of Foam Rolling on Performance and Recovery（Front Physiol 10:376）"
    publisher: "Wiewelhove、Döweling、Schneider 等"
    year: 2019
    level: systematic_review
    population: "21 项研究（14 项练前滚、7 项练后滚）"
    summary: "泡沫轴对表现和恢复的作用总体很小：练前滚能小幅提高冲刺和柔韧，对跳跃、力量几乎无影响；练后滚能稍微减轻肌肉酸痛感、减少冲刺和力量的下降；证据更支持把它当热身的一部分，而不是主要的恢复手段。"
    points:
      - text: "练前用泡沫轴，冲刺表现小幅提高约 0.7%，柔韧性提高约 4.0%；对跳跃和力量的影响可以忽略。"
        where: "Abstract"
      - text: "练后用泡沫轴，能稍微减少练后冲刺和力量的下降，并减轻肌肉酸痛的感觉（约 6.0%）。"
        where: "Abstract"
      - text: "泡沫轴对表现和恢复的作用总体较小，证据更支持把它用作热身，而不是恢复手段。"
        where: "Abstract"
    keywords: ["泡沫轴", "滚轴", "筋膜放松", "筋膜枪", "放松", "练后放松"]
    url: https://doi.org/10.3389/fphys.2019.00376
    review: claude_draft

  - id: K73
    domains: [safety, training]
    title: "坐姿、弯腰等姿势和腰痛：有关联，但不能说是原因"
    source: "No consensus on causality of spine postures or physical exposure and low back pain: A systematic review of systematic reviews（J Biomech 102:109312）"
    publisher: "Swain、Pan、Owen、Schmidt、Belavy"
    year: 2020
    level: systematic_review
    population: "41 篇系统综述（脊柱姿势、久坐久站、弯腰扭转、重体力劳动与腰痛）"
    summary: "关于脊柱姿势、久坐久站、弯腰扭转、重体力劳动和腰痛的关系，已有综述结论不一；只纳入前瞻性研究的综述更难得出一致结论；目前没有共识认为这些姿势或体力暴露会导致腰痛，只能说有关联。"
    points:
      - text: "关于脊柱姿势、久站、久坐、弯腰扭转、别扭姿势和重体力劳动与腰痛的关系，已有综述既有阳性结论也有阴性结论。"
        where: "Abstract"
      - text: "只纳入前瞻性研究的综述更难得出一致结论；这些因素是否先于首次腰痛出现、是否存在剂量关系，证据也不一致。"
        where: "Abstract"
      - text: "目前对这些姿势和体力暴露是否导致腰痛没有共识；有关联不等于是原因。"
        where: "Abstract"
    keywords: ["体态", "姿势", "坐姿", "驼背", "弯腰", "腰痛", "纠正体态", "久坐"]
    url: https://doi.org/10.1016/j.jbiomech.2019.08.006
    review: claude_draft

  - id: K74
    domains: [safety, training]
    title: "头前伸和脖子疼：成年人有关联，青少年基本没有"
    source: "The Relationship Between Forward Head Posture and Neck Pain: a Systematic Review and Meta-Analysis（Curr Rev Musculoskelet Med 12(4):562–577）"
    publisher: "Mahmoud、Hassan、Abdelmajeed、Moustafa、Silva"
    year: 2019
    level: systematic_review
    population: "15 项横断面研究（青少年、成年人、老年人）"
    summary: "有脖子疼的成年人头前伸更明显，头前伸程度和疼痛强度、功能受限有关；青少年里两者基本没有关联；纳入的都是横断面研究，只能说明有关联，不能说明头前伸导致脖子疼。"
    points:
      - text: "成年人中，有脖子疼的人比没有的人头前伸更明显；青少年中两组没有明显差别。"
        where: "Abstract（Recent findings）"
      - text: "成年人和老年人的头前伸程度和脖子疼的强度、功能受限程度有关。"
        where: "Abstract（Recent findings）"
      - text: "纳入的 15 项研究都是横断面研究。"
        where: "Abstract（Recent findings）"
    keywords: ["头前伸", "探颈", "富贵包", "脖子疼", "颈椎", "低头", "体态"]
    url: https://doi.org/10.1007/s12178-019-09594-y
    review: claude_draft

  - id: K75
    domains: [exercise, training]
    title: "教动作时提示动作效果（外部注意），常比提示身体部位效果好"
    source: "Superiority of external attentional focus for motor performance and learning: Systematic reviews and meta-analyses（Psychol Bull 147(6):618–645）"
    publisher: "Chua、Jimenez-Diaz、Lewthwaite、Kim、Wulf"
    year: 2021
    level: systematic_review
    population: "73 项研究 1,824 人（表现）；40 项研究 1,274 人（学习）"
    summary: "把注意力放在动作要达到的效果上（外部注意），比放在身体部位的动作上（内部注意），当场表现和后续学习效果都更好，不受年龄、健康状况和水平影响；但此结论后来被发表偏倚分析质疑（见 KA12）。"
    points:
      - text: "外部注意比内部注意的当场表现更好（效应量约 0.26），保持测试和迁移测试的学习效果也更好（效应量约 0.58）。"
        where: "Abstract"
      - text: "年龄、健康状况和技术水平都不影响外部注意的优势。"
        where: "Abstract"
      - text: "注意点离身体更远的外部注意，比离身体近的效果稍好（效应量约 0.22）。"
        where: "Abstract"
    keywords: ["动作提示", "怎么教动作", "注意力", "发力感", "外部提示", "口令"]
    url: https://doi.org/10.1037/bul0000335
    review: claude_draft

  - id: K76
    domains: [exercise, training]
    title: "外部注意的优势可能被发表偏倚放大了"
    source: "Reporting bias, not external focus: A robust Bayesian meta-analysis and systematic review of the external focus of attention literature（Psychol Bull 150(11):1347–1362）"
    publisher: "McKay、Corson、Seedu 等"
    year: 2024
    level: systematic_review
    population: "重新分析 KA11 等已有元分析的数据"
    summary: "用考虑发表偏倚的贝叶斯方法重新分析后，各项分析都有中到强的发表偏倚证据；校正后外部注意相对内部注意的平均效果接近零，各研究之间差异很大；不能说外部注意总是更好，效果取决于尚不清楚的具体情境。"
    points:
      - text: "重新分析发现所有分析都有中等到强的发表偏倚证据。"
        where: "Abstract"
      - text: "校正发表偏倚后，外部注意在表现、保持、迁移上的平均优势都可以忽略（效应量约 0.01–0.15）。"
        where: "Abstract"
      - text: "研究之间差异明显，注意力提示的效果取决于尚不清楚的情境，不能说外部注意总是更好。"
        where: "Abstract"
    keywords: ["动作提示", "注意力", "外部提示", "内部提示", "发力感", "怎么教动作"]
    url: https://doi.org/10.1037/bul0000451
    review: claude_draft

  - id: K77
    domains: [exercise, training]
    title: "全幅度比半幅度更长力量、下肢肌肉"
    source: "Effects of range of motion on resistance training adaptations: A systematic review and meta-analysis（Scand J Med Sci Sports 31(10):1866–1881）"
    publisher: "Pallarés、Hernández-Belmonte、Martínez-Cava、Vetrovsky、Steffl、Courel-Ibáñez"
    year: 2021
    level: systematic_review
    population: "16 项研究"
    summary: "全幅度训练比部分幅度更能提高力量（效应量约 0.56）和下肢肌肉（约 0.88），功能表现也倾向全幅度更好；两者对肌肉结构（厚度、羽状角、肌束长度）的影响差别不大。"
    points:
      - text: "全幅度训练比部分幅度训练更能提高肌肉力量（效应量约 0.56）。"
        where: "Abstract（Results）"
      - text: "全幅度训练比部分幅度训练更能增加下肢肌肉（效应量约 0.88）。"
        where: "Abstract（Results）"
      - text: "全幅度和部分幅度对肌肉厚度、羽状角、肌束长度的影响没有大的差别。"
        where: "Abstract（Results、Conclusion）"
    keywords: ["全程", "半程", "幅度", "蹲多深", "半蹲", "全蹲", "动作幅度", "做不到底"]
    url: https://doi.org/10.1111/sms.14006
    review: claude_draft

  - id: K78
    domains: [data, training]
    title: "用“整体累不累 × 练了多久”记训练负荷（session-RPE）"
    source: "Session-RPE Method for Training Load Monitoring: Validity, Ecological Usefulness, and Influencing Factors（Front Neurosci 11:612）"
    publisher: "Haddad、Stylianides、Djaoui、Dellal、Chamari"
    year: 2017
    level: review
    population: "36 项验证研究：不同性别、年龄（儿童到成年人）、水平的运动者，含力量训练"
    summary: "练完后用 0–10 分评价整次训练有多累，乘以训练分钟数，就得到这次的训练负荷；多项研究证实这种方法有效、可靠，可以单独使用；但性别、年龄、体能水平、环境和心理因素都会影响打分。"
    points:
      - text: "训练负荷 = 整次训练的主观用力评分（0–10 分的改良 CR-10 量表）× 训练时长（分钟）。"
        where: "Session-RPE method: rationale（公式、Table 1）"
      - text: "评分在训练结束后给出，回答一个简单的问题：“这次练得怎么样（累不累）”。"
        where: "Session-RPE method: ecological usefulness"
      - text: "36 项研究证实这种方法在多种运动、不同年龄和水平的人群中有效且可靠，可以单独用来监测训练负荷，也有人建议配合心率。"
        where: "Abstract（Results、Conclusion）"
      - text: "性别、年龄、体能和训练水平，以及温度、海拔、咖啡因、音乐等因素都会影响主观用力评分。"
        where: "Factors influencing perceived exertion"
    keywords: ["训练负荷", "累不累", "主观疲劳", "RPE", "打分", "记训练", "练得怎么样"]
    url: https://doi.org/10.3389/fnins.2017.00612
    review: claude_draft

  - id: K79
    domains: [training, data]
    title: "估“还剩几次”平均差约 1 次，越接近力竭估得越准"
    source: "Accuracy in Predicting Repetitions to Task Failure in Resistance Exercise: A Scoping Review and Exploratory Meta-analysis（Sports Med 52(2):377–390）"
    publisher: "Halperin、Malleron、Har-Nir、Androulakis-Korakakis、Wolf、Fisher、Steele"
    year: 2022
    level: systematic_review
    population: "健康人（12 项研究、414 人；范围综述加探索性元分析）"
    summary: "人们估计离力竭还剩几次时，平均少估约 1 次，研究间差异很大；越接近力竭、每组次数越少（重量越大）、越往后的组，估得越准；训练经验和上下肢动作对准确度影响不大。"
    points:
      - text: "人们估计离力竭还能做几次时，平均少估约 0.95 次，但研究之间差异很大。"
        where: "Abstract（Results）"
      - text: "越接近力竭时估、每组到力竭的次数越少（12 次以内比 12 次以上准），估得越准；越往后的组也稍准一些。"
        where: "Abstract（Results、Conclusions）"
      - text: "训练经验对估计准确度没有明显影响，上肢和下肢动作之间也没有明显差别。"
        where: "Abstract（Results）"
    keywords: ["还剩几次", "RIR", "估次数", "留几个", "力竭", "RPE准不准"]
    url: https://doi.org/10.1007/s40279-021-01559-x
    review: claude_draft

  - id: K80
    domains: [training, recovery, data]
    title: "按心率变异性安排耐力训练强度：最大摄氧量多提高一点点"
    source: "HRV-Based Training for Improving VO2max in Endurance Athletes. A Systematic Review with Meta-Analysis（Int J Environ Res Public Health 17(21):7999）"
    publisher: "Granero-Gallegos、González-Quílez、Plews、Carrasco-Poyatos"
    year: 2020
    level: systematic_review
    population: "有训练的耐力运动者（6 项随机对照试验、195 人）"
    summary: "每天根据心率变异性决定当天练高强度还是中等强度（或休息），和按固定计划练相比，最大摄氧量的提高稍大，但差别很小；业余和女性运动者效果较明显；研究数量少，只涉及耐力训练。"
    points:
      - text: "纳入研究里，每天按心率变异性决定强度：心率变异性不降就练高强度，下降就改中等强度或休息。"
        where: "Table 1；4.1.2 Interventions"
      - text: "按心率变异性安排和按固定计划都能提高最大摄氧量，按心率变异性的提高稍大，但组间差别很小（效应量差约 0.19）。"
        where: "Abstract"
      - text: "业余水平和女性运动者的效果更明显。"
        where: "Abstract"
      - text: "只纳入 6 项研究、195 人，作者认为还需要更多研究。"
        where: "4.1.2 Participants；6.2 Research Implications"
    keywords: ["心率变异性", "HRV", "今天练不练", "状态差", "恢复不好", "降强度"]
    url: https://doi.org/10.3390/ijerph17217999
    review: claude_draft

  - id: K81
    domains: [recovery, training]
    title: "睡得少，第二天运动表现会下降"
    source: "Effects of Acute Sleep Loss on Physical Performance: A Systematic and Meta-Analytical Review（Sports Med 52(11):2669–2690）"
    publisher: "Craven、McCartney、Desbrow、Sabapathy、Bellinger、Roberts、Irwin"
    year: 2022
    level: systematic_review
    population: "69 篇研究、959 人（89% 为男性）"
    summary: "一天内睡 6 小时或更少，运动表现平均下降约 7.6%，各类运动（力量、爆发力、耐力、间歇、技术）都受影响；整夜不睡和早起导致的缺觉影响最一致；醒着的时间越长表现越差，每多醒 1 小时约降 0.4%；下午、晚上练受影响明显，上午练基本不受影响。"
    points:
      - text: "睡眠不足（24 小时内睡 6 小时或更少）让运动表现平均下降约 7.6%，力量、爆发力、耐力、间歇和技术类表现都受影响。"
        where: "Abstract（Search and inclusion；Results）"
      - text: "整夜不睡和比平时早起导致的缺觉影响最一致；晚睡导致的缺觉影响不一致。"
        where: "Abstract（Results）"
      - text: "运动前醒着的时间越长表现越差，大约每多醒 1 小时下降 0.4%。"
        where: "Abstract（Results）"
      - text: "缺觉后下午或晚上的运动表现下降明显，上午的运动基本不受影响；如果避免不了缺觉，优先安排上午练。"
        where: "Abstract（Results、Conclusions）"
    keywords: ["没睡好", "睡得少", "熬夜", "失眠", "早起", "今天还练吗", "状态差"]
    url: https://doi.org/10.1007/s40279-022-01706-y
    review: claude_draft

  - id: K82
    domains: [training]
    title: "按当天状态调重量，和按固定百分比练效果差不多"
    source: "The Effect of Load and Volume Autoregulation on Muscular Strength and Hypertrophy: A Systematic Review and Meta-Analysis（Sports Med Open 8:9）"
    publisher: "Hickmott、Chilibeck、Shaw、Butcher"
    year: 2022
    level: systematic_review
    population: "有力量训练经验的人（15 项研究：6 项调重量、9 项调训练量）"
    summary: "按当天状态调整重量（自我调节）和按固定百分比安排，最大力量的提高没有明显差别；按速度下降控制每组次数时，速度下降不超过 25% 就停对力量更好，下降超过 20%–25% 再停对增肌更好。"
    points:
      - text: "按当天状态调整重量和按固定百分比安排，1RM 力量的提高没有明显差别。"
        where: "Abstract（Results、Conclusions）"
      - text: "组数和相对强度相同时，速度下降不超过 25% 就停对提高力量更有利。"
        where: "Abstract（Results、Conclusions）"
      - text: "速度下降超过 20%–25% 再停，因为累积了更多训练量，对增肌更有利。"
        where: "Abstract（Results、Conclusions）"
    keywords: ["自我调节", "按状态调", "今天重量", "加不加重", "降重量", "RPE训练", "速度训练"]
    url: https://doi.org/10.1186/s40798-021-00404-9
    review: claude_draft

  - id: K83
    domains: [training]
    title: "周期化安排对力量有小幅好处，对增肌没区别"
    source: "Effects of Periodization on Strength and Muscle Hypertrophy in Volume-Equated Resistance Training Programs: A Systematic Review and Meta-analysis（Sports Med 52(7):1647–1666）"
    publisher: "Moesgaard、Beck、Christiansen、Aagaard、Lundbye-Jensen"
    year: 2022
    level: systematic_review
    population: "35 项训练量相等的研究（练过和没练过的人）"
    summary: "总训练量相同时，周期化训练比不变化的训练更能提高 1RM 力量（效应量约 0.31），增肌没有差别；每天或每周变换次数和强度的波动式周期比线性周期力量提高更多，但只在有训练经验的人里明显。"
    points:
      - text: "训练量相同时，周期化训练比不做周期化的训练更能提高 1RM 力量（效应量约 0.31），增肌没有明显差别。"
        where: "Abstract（Results）"
      - text: "波动式周期（每天或每周变换次数和强度）比线性周期的 1RM 提高更多，但只在有训练经验的人里明显；没练过的人两者没有差别。"
        where: "Abstract（Results、Conclusion）"
      - text: "线性周期和波动式周期在增肌上没有差别。"
        where: "Abstract（Conclusion）"
    keywords: ["周期化", "平台期", "卡住", "不涨了", "线性", "波动", "怎么安排", "换计划"]
    url: https://doi.org/10.1007/s40279-021-01636-1
    review: claude_draft

  - id: K84
    domains: [training]
    title: "停练后力量会掉，停得越久掉得越多，老年人掉得更多"
    source: "Effect of training cessation on muscular performance: a meta-analysis（Scand J Med Sci Sports 23(3):e140–e149）"
    publisher: "Bosquet、Berryman、Dupuy、Mekary、Arvisais、Bherer、Mujika"
    year: 2013
    level: systematic_review
    population: "103 项研究"
    summary: "停止力量训练后，次最大力量、最大力量和最大爆发力都会下降；停得越久下降越多；65 岁以上的人下降更多；不常运动的人比业余运动员最大力量和爆发力下降更多。"
    points:
      - text: "停止力量训练后，次最大力量、最大力量和最大爆发力都会下降。"
        where: "Abstract"
      - text: "停练时间越长，下降越多（存在剂量关系）。"
        where: "Abstract"
      - text: "65 岁以上的人下降更多；不常运动的人比业余运动员最大力量和爆发力下降更多。"
        where: "Abstract"
    keywords: ["停练", "中断", "好久没练", "掉力量", "掉肌肉", "休息太久", "回归"]
