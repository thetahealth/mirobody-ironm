    review: claude_draft

  - id: K85
    domains: [training]
    title: "每周练一次就能基本保住力量和肌肉（年轻人）"
    source: "Exercise dosing to retain resistance training adaptations in young and older adults（Med Sci Sports Exerc 43(7):1177–1187）"
    publisher: "Bickel、Cross、Bamman"
    year: 2011
    level: rct
    population: "20–35 岁和 60–75 岁成年人（第一阶段 70 人，第二阶段 56 人）"
    summary: "先每周练 3 次、练 16 周，再随机分到完全停练、每周 1 次同样组数（原量的三分之一）、每周 1 次每个动作 1 组（原量的九分之一）三组，持续 32 周；完全停练的人 8 周内练出的肌肉基本掉光，但力量 32 周后只小幅下降；两种每周一次的维持方案都保住了力量；年轻人两种方案都保住了肌纤维大小，老年人都没保住。"
    points:
      - text: "第一阶段每周练 3 次、每次 3 个下肢动作各 3 组 8–12 次、练 16 周；维持阶段改为每周 1 次（三分之一量：每个动作仍 3 组；九分之一量：每个动作 1 组），强度和动作不变。"
        where: "Methods（Phase 1；Phase 2）"
      - text: "完全停练的人，在停练后 8 周内练出来的大腿瘦体重基本掉光；力量 32 周后只下降约 7%，仍比训练前高约 23%。"
        where: "Results（TLM；Voluntary strength）"
      - text: "两种每周一次的维持方案都保住了力量，32 周后力量还比第一阶段末再多 7%–8%。"
        where: "Results（Voluntary strength）"
      - text: "年轻人两种维持方案都保住了肌纤维大小，三分之一量还继续增长；老年人两种方案都没保住肌纤维大小，但力量基本保住。"
        where: "Abstract（Results）；Discussion"
    keywords: ["保持", "维持", "忙", "出差", "一周一次", "少练", "停练", "保住肌肉"]
    url: https://doi.org/10.1249/MSS.0b013e318207c15d
    review: claude_draft

  - id: K86
    domains: [training]
    title: "停 3 周再练，恢复得快，半年总效果和一直练差不多"
    source: "Comparison of muscle hypertrophy following 6-month of continuous and periodic strength training（Eur J Appl Physiol 113(4):975–985）"
    publisher: "Ogasawara、Yasuda、Ishii、Abe"
    year: 2013
    level: rct
    population: "没练过的年轻男性（14 人，卧推训练）"
    summary: "一组连续练 24 周，另一组练 6 周、停 3 周循环三次；停后再练时肌肉和力量的增长比同期一直练的组更快，24 周后两组肌肉和力量的总提高差不多；样本小、只练卧推。"
    points:
      - text: "两组都用 75% 1RM、3 组 10 次的卧推，每周 3 次；一组连续练 24 周，另一组练 6 周、停 3 周，循环三次。"
        where: "Abstract"
      - text: "第二次“停 3 周再练 6 周”期间，间断组的肌肉和力量增长明显高于同期一直练的组。"
        where: "Abstract"
      - text: "24 周后，间断组和连续组的肌肉横截面积和力量总提高差不多。"
        where: "Abstract"
    keywords: ["肌肉记忆", "停练再练", "回归", "练回来", "中断", "休息几周"]
    url: https://doi.org/10.1007/s00421-012-2511-9
    review: claude_draft

  - id: K87
    domains: [nutrition, training]
    title: "热量缺口太大会少长肌肉（每天不超过约 500 千卡）"
    source: "Energy deficiency impairs resistance training gains in lean mass but not strength: A meta-analysis and meta-regression（Scand J Med Sci Sports 32(1):125–137）"
    publisher: "Murphy、Koehler"
    year: 2022
    level: systematic_review
    population: "做力量训练、同时处于热量缺口（至少 3 周）的成年人的随机对照试验"
    summary: "一边力量训练一边吃得少于消耗，力量照样能涨，但去脂体重的增加会受影响；缺口到每天约 500 千卡时去脂体重基本长不上去，想在减重时保住肌肉，每天缺口不宜超过约 500 千卡。"
    points:
      - text: "力量训练期间有热量缺口的人，去脂体重的增加明显少于没有缺口的人（效应量约 −0.57）。"
        where: "Abstract（Results）"
      - text: "有没有热量缺口，力量的提高没有明显差别（效应量约 −0.31，差异不显著）。"
        where: "Abstract（Results）"
      - text: "回归分析显示，每天约 500 千卡的热量缺口就会让去脂体重不再增加。"
        where: "Abstract（Results，meta-regression）"
      - text: "想增加去脂体重的人应避免长时间处在热量缺口里；减重时想保住去脂体重，每天缺口不宜超过约 500 千卡。"
        where: "Abstract（Conclusions）"
      - text: "纳入的研究要求热量缺口至少持续 3 周。"
        where: "Abstract（Methods）"
    keywords: ["热量缺口", "少吃多少", "每天少吃", "500大卡", "掉肌肉", "减脂保肌", "节食", "吃太少"]
    url: https://doi.org/10.1111/sms.14075
    review: claude_draft

  - id: K88
    domains: [nutrition, training]
    title: "增肌期多吃多少（有训练基础的人）"
    source: "Nutrition Recommendations for Bodybuilders in the Off-Season: A Narrative Review（Sports (Basel) 7(7):154）"
    publisher: "Iraki、Fitschen、Espinar、Helms"
    year: 2019
    level: review
    population: "有训练基础的健美训练者（非比赛期增肌）"
    summary: "增肌期每天比维持热量多吃约 10–20%，新手和中级每周体重涨约 0.25–0.5%；练得越久越要保守，多吃太多只会多长脂肪。"
    points:
      - text: "增肌期热量比维持水平多约 10–20%。"
        where: "Section 2（Energy）"
      - text: "新手和中级训练者每周体重增加约为体重的 0.25–0.5%。"
        where: "Abstract；Section 2（Energy）"
      - text: "训练年限长的人热量盈余和每周增重都应更保守，取范围的低端；脂肪涨得明显时再往下调。"
        where: "Abstract；Section 2（Energy）"
      - text: "热量盈余过大会带来不必要的脂肪增加。"
        where: "Section 2（Positive Energy Balance）"
      - text: "建议每天蛋白质 1.6–2.2 克/公斤、脂肪 0.5–1.5 克/公斤，碳水至少 3–5 克/公斤，剩下的热量由碳水补足。"
        where: "Abstract"
    keywords: ["增肌", "增重", "多吃多少", "热量盈余", "每周涨多少", "增肌期", "脏增肌", "干净增肌"]
    url: https://doi.org/10.3390/sports7070154
    review: claude_draft

  - id: K89
    domains: [nutrition, training]
    title: "增重时吃得过多，多出来的主要是脂肪（精英运动员随机试验）"
    source: "Effect of nutritional intervention on body composition and performance in elite athletes（Eur J Sport Sci 13(3):295–303）"
    publisher: "Garthe、Raastad、Refsnes、Sundgot-Borgen"
    year: 2013
    level: rct
    population: "39 名精英运动员（平均约 19 岁），8–12 周增重期，每周额外 4 次力量训练"
    summary: "有营养指导、吃得更多的一组体重涨得更多，但去脂体重的增加和随意吃的一组差不多，多涨的主要是脂肪；增重时热量不宜多得过头。"
    points:
      - text: "营养指导组每天平均摄入约 3585 千卡，随意吃的一组约 2964 千卡。"
        where: "Abstract（Results）"
      - text: "营养指导组体重增加约 3.9%，随意吃的一组约 1.5%；两组去脂体重的增加没有差别。"
        where: "Abstract（Results）"
      - text: "营养指导组脂肪量增加约 15%，随意吃的一组约 3%。"
        where: "Abstract（Results）"
      - text: "作者提醒增重期过多的热量会带来不想要的脂肪增加。"
        where: "Abstract（Conclusion）"
    keywords: ["增肌", "增重", "吃太多", "长肥", "热量盈余", "脏增肌"]
    url: https://doi.org/10.1080/17461391.2011.643923
    review: claude_draft

  - id: K90
    domains: [nutrition, safety]
    title: "健康人吃高蛋白不伤肾（不适用于肾病患者）"
    source: "Changes in Kidney Function Do Not Differ between Healthy Adults Consuming Higher- Compared with Lower- or Normal-Protein Diets: A Systematic Review and Meta-Analysis（J Nutr 148(11):1760–1775）"
    publisher: "Devries、Sithamparapillai、Brimble、Banfield、Morton、Phillips"
    year: 2018
    level: systematic_review
    population: "没有慢性肾病的成年人（28 项随机对照试验、1358 人，23–72 岁；含肥胖、2 型糖尿病、高血压者）"
    summary: "和正常或较低蛋白饮食相比，高蛋白饮食没有让健康成年人的肾小球滤过率出现不利变化；结论不适用于慢性肾病、1 型糖尿病、蛋白尿、肾结石史等人群。"
    points:
      - text: "纳入 28 项、试验期超过 4 天的随机对照试验，共 1358 人。"
        where: "Abstract；Results（Study and subject characteristics）"
      - text: "高蛋白定义为每天至少 1.5 克/公斤、或占热量至少 20%、或每天至少 100 克；高蛋白组平均约 1.8 克/公斤，对照组平均约 0.9 克/公斤。"
        where: "Abstract（Methods）；Results（Diet protocol characteristics）"
      - text: "从基线到试验结束，肾小球滤过率的变化在高蛋白组和对照组之间没有差别。"
        where: "Abstract（Results）"
      - text: "作者结论：较高的蛋白质摄入不会对健康成年人的肾功能产生不利影响。"
        where: "Abstract（Conclusions）"
      - text: "有慢性肾病、1 型糖尿病、蛋白尿、肾结石史或近期手术的人被排除在外，结论不能推到这些人身上。"
        where: "Methods（Inclusion criteria）"
      - text: "证据确定性被评为低到很低。"
        where: "Results（Certainty in the evidence）；Table 3"
    keywords: ["高蛋白", "伤肾", "肾", "蛋白吃多了", "肾功能", "蛋白粉伤肾"]
    url: https://doi.org/10.1093/jn/nxy197
    review: claude_draft

  - id: K91
    domains: [nutrition]
    title: "补维生素 D 对肌肉力量的作用很小"
    source: "The effects of vitamin D on skeletal muscle strength, muscle mass, and muscle power: a systematic review and meta-analysis of randomized controlled trials（J Clin Endocrinol Metab 99(11):4336–4345）"
    publisher: "Beaudart、Buckinx、Rabenda 等"
    year: 2014
    level: systematic_review
    population: "30 项随机对照试验、5615 人，平均约 61 岁"
    summary: "补维生素 D 对整体肌肉力量有小而明确的好处，对肌肉量和爆发力没有明显作用；维生素 D 很低的人和 65 岁以上的人获益更明显。"
    points:
      - text: "补充维生素 D 对整体肌肉力量有小的正面作用（标准化均数差约 0.17）。"
        where: "Abstract（Results）"
      - text: "对肌肉量和肌肉爆发力没有明显作用。"
        where: "Abstract（Results）"
      - text: "血中 25-羟维生素 D 低于 30 nmol/L 的人、65 岁及以上的人，力量的改善更明显。"
        where: "Abstract（Results，亚组分析）"
      - text: "最合适的剂量、给法和疗程还不清楚。"
        where: "Abstract（Conclusions）"
    keywords: ["维生素D", "维D", "补钙", "晒太阳", "肌肉力量", "补剂"]
    url: https://doi.org/10.1210/jc.2014-1742
    review: claude_draft

  - id: K92
    domains: [nutrition, safety]
    title: "普通补剂里可能混有没标出的激素类成分"
    source: "Analysis of non-hormonal nutritional supplements for anabolic-androgenic steroids – results of an international study（Int J Sports Med 25(2):124–129）"
    publisher: "Geyer、Parr、Mareck、Reinhart、Schrader、Schänzer"
    year: 2004
    level: study
    population: "13 个国家、215 家供应商的 634 种非激素类补剂（2000–2001 年购买）"
    summary: "约七分之一的普通补剂检出了标签上没写的合成类固醇，卖激素前体产品的公司出的产品比例更高；可配合 K39 用来解释为什么要选第三方检测过的产品。数据较早，只说明风险存在，不代表现在的比例。"
    points:
      - text: "634 种补剂中有 94 种（14.8%）检出了标签上没有标注的合成类固醇。"
        where: "Abstract"
      - text: "同时销售激素前体产品的公司，其产品检出比例约 21%；不卖这类产品的公司约 10%。"
        where: "Abstract"
      - text: "这项研究的样品在 2000–2001 年购买，比例只能说明风险存在，不能当作现在市场的比例。"
        where: "Abstract（购买时间）"
    keywords: ["补剂污染", "兴奋剂", "违禁", "尿检", "第三方检测", "补剂安全", "增肌粉"]
    url: https://doi.org/10.1055/s-2004-819955
    review: claude_draft

  - id: K93
    domains: [safety, training, data]
    title: "吃 β 受体阻滞剂时心率区间不可靠"
    source: "Exercise intensity assessment and prescription in cardiovascular rehabilitation and beyond: why and how: a position statement from the Secondary Prevention and Rehabilitation Section of the European Association of Preventive Cardiology（Eur J Prev Cardiol 29(1):230–245）"
    publisher: "欧洲预防心脏病学会（EAPC）二级预防与康复分会（Hansen、Abreu、Ambrosetti 等）"
    year: 2022
    level: position_stand
    population: "心血管病患者的运动康复，也适用于更广泛的人群"
    summary: "β 受体阻滞剂会改变心率和运动强度之间的对应关系，按最大心率或心率储备百分比定的强度可能不准；有条件时用通气阈来定强度，主观用力感觉配合客观指标使用，但这类药也会让主观感觉更难解读。"
    points:
      - text: "服用 β 受体阻滞剂或心率上不去的人，心率和摄氧量的对应关系会改变，按峰值心率、心率储备百分比定的强度要非常谨慎地使用。"
        where: "Objective methods（Indices of peak exercise capacity）；Table 1"
      - text: "β 受体阻滞剂剂量调整后，原来的目标心率不再适用；可以用最近训练的负荷运动至少 5 分钟，记下这时的心率作为新的目标心率。"
        where: "Objective methods（Indices of peak exercise capacity）"
      - text: "主观用力感觉最好和心率等客观指标一起用；服用 β 受体阻滞剂可能让主观用力感觉更难解读。"
        where: "Subjective methods（Ratings of perceived exertion）"
      - text: "有条件时，以第一、第二通气阈来确定有氧强度，比按峰值的百分比更好。"
        where: "Objective methods（Ventilatory threshold）；Table 1"
    keywords: ["β受体阻滞剂", "倍他乐克", "美托洛尔", "比索洛尔", "降压药", "心率上不去", "心率区间", "吃药运动"]
    url: https://doi.org/10.1093/eurjpc/zwab007
    review: claude_draft

  - id: K94
    domains: [safety, recovery]
    title: "吃他汀时肌肉酸痛要分清是不是练出来的"
    source: "Statin-associated muscle symptoms: impact on statin therapy—European Atherosclerosis Society Consensus Panel Statement on Assessment, Aetiology and Management（Eur Heart J 36(17):1012–1022）"
    publisher: "欧洲动脉粥样硬化学会（EAS）共识专家组（Stroes 等）"
    year: 2015
    level: consensus
    population: "服用他汀类降脂药的人"
    summary: "他汀相关的肌肉症状在运动多的人中更常见，大运动量本身也是风险因素；肌酸激酶轻度升高常常只是运动引起的；症状一般在开始吃药后 4–6 周内出现。有肌肉疼痛或无力应告诉医生，由医生判断。"
    points:
      - text: "他汀相关的肌肉症状在身体活动多的人中更常见；高水平的身体活动被列为风险因素之一。"
        where: "Assessment and diagnosis；Box 1"
      - text: "有症状、肌酸激酶高于正常上限但不到 4 倍时，常见原因是运动或身体活动增加。"
        where: "Table 1"
      - text: "判断是不是他汀引起的，要先排除身体活动增加等其他原因；不建议常规监测肌酸激酶。"
        where: "Assessment and diagnosis；Management"
      - text: "肌肉疼痛、无力通常在开始服用他汀后 4–6 周内出现，也可能在多年后、加量或加用有相互作用的药之后出现。"
        where: "Assessment and diagnosis"
    keywords: ["他汀", "降脂药", "阿托伐他汀", "瑞舒伐他汀", "肌肉痛", "吃药肌肉酸", "肌酸激酶"]
    url: https://doi.org/10.1093/eurheartj/ehv043
    review: claude_draft

  - id: K95
    domains: [data]
    title: "手环手表：步数、心率较准，消耗热量不准"
    source: "Reliability and Validity of Commercially Available Wearable Devices for Measuring Steps, Energy Expenditure, and Heart Rate: Systematic Review（JMIR Mhealth Uhealth 8(9):e18694）"
    publisher: "Fuller、Colwell、Low 等"
    year: 2020
    level: systematic_review
    population: "158 篇研究、9 个品牌的消费级可穿戴设备"
    summary: "在实验室条件下，主流手环手表的步数和心率大体可信（因品牌型号而异），但没有一个品牌的能量消耗是准的，多数偏低、也有偏高；手表上的消耗热量只能看趋势，不能拿来精确算吃多少。"
    points:
      - text: "能量消耗在受控条件下只有约 9% 的对比误差在 ±3% 以内，多数偏低（约 54%）、部分偏高（约 37%）。"
        where: "Results（Validity for Energy Expenditure in Controlled Settings）"
      - text: "没有一个品牌的能量消耗误差在 ±3% 以内的次数超过约 13%。"
        where: "Results（Validity for Energy Expenditure by Brand）"
      - text: "日常生活中测的能量消耗，只有约 18% 的对比误差在 ±10% 以内。"
        where: "Results（Validity for Energy Expenditure in Free-Living Settings）"
      - text: "心率在受控条件下约 57% 的对比误差在 ±3% 以内，整体略偏低。"
        where: "Results（Validity for Heart Rate in Controlled Settings）"
      - text: "作者结论：步数和心率在实验室中较准但取决于品牌，能量消耗所有品牌都不准。"
        where: "Abstract（Conclusions）"
    keywords: ["手环", "手表", "消耗热量", "卡路里准不准", "运动消耗", "心率准不准", "Apple Watch", "华为手表", "小米手环", "Garmin"]
    url: https://doi.org/10.2196/18694
    review: claude_draft

  - id: K96
    domains: [data]
    title: "腕戴设备心率误差小、热量误差大（Stanford 实测）"
    source: "Accuracy in Wrist-Worn, Sensor-Based Measurements of Heart Rate and Energy Expenditure in a Diverse Cohort（J Pers Med 7(2):3）"
    publisher: "Shcherbina、Mattsson、Waggott 等"
    year: 2017
    level: study
    population: "60 名成年人，7 款腕戴设备，坐、走、跑、骑车"
    summary: "多数设备心率的中位误差在 2–7% 左右，但能量消耗的中位误差最好的也有约 27%，最差的超过 90%；心率可以参考，消耗热量只能当粗略参考。"
    points:
      - text: "7 款设备里有 6 款在骑车时心率中位误差低于 5%。"
        where: "Abstract"
      - text: "各设备心率的中位误差从约 2.0% 到约 6.8%。"
        where: "Results 3.1（Heart Rate）"
      - text: "没有一款设备的能量消耗误差低于 20%；中位误差从约 27% 到约 93%。"
        where: "Abstract；Results 3.2（Energy Expenditure）"
    keywords: ["手环", "手表", "消耗热量", "卡路里准不准", "心率准不准", "运动消耗"]
    url: https://doi.org/10.3390/jpm7020003
    review: claude_draft

  - id: K97
    domains: [data, nutrition]
    title: "体重每天都在波动，看一周的平均"
    source: "Weekly, seasonal and holiday body weight fluctuation patterns among individuals engaged in a European multi-centre behavioural weight loss maintenance intervention（PLoS One 15(4):e0232152）"
    publisher: "Turicchi、O'Driscoll、Horgan 等"
    year: 2020
    level: study
    population: "参加减重后维持项目的欧洲成年人（周内波动分析 1421 人，用智能体重秤）"
    summary: "体重有固定的周内规律：周末后最高、周五最低，一周内差约 0.35%（约 0.3 公斤）；单次称重还受水分、糖原影响，所以看趋势要用多次称重的平均，不要只看某一天。"
    points:
      - text: "一周内体重波动约为体重的 0.35%，这群人约 0.3 公斤。"
        where: "Abstract（Results）；Results（Weekly patterns）"
      - text: "体重周一最高（其次周日、周二），周五最低，周末涨、工作日降。"
        where: "Results（Weekly patterns）"
      - text: "单次称重会受体内水分、糖原等正常波动影响，研究用多次称重平滑后的趋势来分析。"
        where: "Methods"
      - text: "圣诞假期后体重平均增加约 1.35%，之后几个月没有完全回落。"
        where: "Abstract（Results）"
    keywords: ["体重波动", "称重", "体重忽高忽低", "体重涨了", "一天重一斤", "周平均", "体重秤"]
    url: https://doi.org/10.1371/journal.pone.0232152
    review: claude_draft

  - id: K98
    domains: [data, recovery, safety]
    title: "练后肌酸激酶升高很常见，别过度解读"
    source: "Creatine-Kinase- and Exercise-Related Muscle Damage Implications for Muscle Performance and Recovery（J Nutr Metab 2012:960363）"
    publisher: "Baird、Graham、Baker、Bickerstaff"
    year: 2012
    level: review
    population: "运动人群与一般人群"
    summary: "肌酸激酶只是肌肉损伤的间接指标，个体差异很大；训练后几天内明显升高很常见，峰值时间因训练方式而异，一般 1 周左右回落；经常大量训练的人平时就偏高。化验单上的高值要结合最近几天的训练来看。"
    points:
      - text: "一般人群的基础值多在 35–175 U/L，但整体范围可从 20 到 16000 U/L。"
        where: "Section 3（Clinical Significance of Raised Serum CK）"
      - text: "经常大量训练的人平时的肌酸激酶就明显高于不运动的人；部分族群天生偏高，与损伤无关。"
        where: "Section 2；Section 4"
      - text: "同样的训练，有些人肌酸激酶升得特别高（高反应者），常找不到原因。"
        where: "Section 2；Section 9"
      - text: "峰值时间因训练方式而异：离心力量训练多在 72–96 小时，杠铃深蹲约 24 小时，跳跃训练约 48 小时。"
        where: "Section 10（Exercise Modality）"
      - text: "轻到中度损伤后，相关指标一般在 7–9 天内回到基线。"
        where: "Section 2（Muscle Response to Exercise）"
      - text: "健康人即使训练后肌酸激酶超过 20000 U/L，也没有发现与肾功能受损有确定的联系。"
        where: "Section 2（Muscle Response to Exercise）"
      - text: "有学者建议把运动人群的正常上限提高到 1.5 倍；只有在不能用运动解释、且至少达到 3 倍上限时才考虑做肌肉活检；目前没有公认标准。"
        where: "Section 3（Clinical Significance of Raised Serum CK）"
    keywords: ["肌酸激酶", "CK", "化验", "体检", "肌酸激酶高", "横纹肌溶解", "练后验血"]
    url: https://doi.org/10.1155/2012/960363
    review: claude_draft

  - id: K99
    domains: [data]
    title: "体脂秤测的体脂率，个人误差很大"
    source: "Accuracy of Bioelectrical Impedance Consumer Devices for Measurement of Body Composition in Comparison to Whole Body Magnetic Resonance Imaging and Dual X-Ray Absorptiometry（Obes Facts 1(6):319–324）"
    publisher: "Bosy-Westphal、Later、Hitze 等"
    year: 2008
    level: study
    population: "106 名成年人（体重正常、超重、肥胖），对比 3 款脚踩式和 1 款手脚八电极式消费级设备"
    summary: "脚踩式体脂秤对一群人的平均值还算接近，但放到个人身上误差可能达到十几个百分点，且都有系统偏差；手脚都接触的八电极设备好一些。体脂秤的读数只适合看自己的变化趋势，不要当成准确值。"
    points:
      - text: "脚踩式（双电极）设备与双能 X 线测的体脂率相比，95% 一致性界限最宽可达约 −14.5 到 +8.6 个百分点。"
        where: "Abstract（Results）"
      - text: "手脚都接触的四电极设备一致性界限较窄，约 −6.6 到 +4.6 个百分点。"
        where: "Abstract（Results）"
      - text: "所有脚踩式设备都存在系统性偏差，四电极设备没有。"
        where: "Abstract（Results）"
      - text: "作者结论：脚踩式设备可以用于群体估计，个人使用更推荐四电极设备。"
        where: "Abstract（Conclusions）"
    keywords: ["体脂秤", "体脂率", "准不准", "体成分", "智能秤", "测体脂", "InBody"]
    url: https://doi.org/10.1159/000176061
    review: claude_draft

  - id: K100
    domains: [training, nutrition]
    title: "养成习惯要多久：因人而异，从几周到大半年"
    source: "How are habits formed: Modelling habit formation in the real world（Eur J Soc Psychol 40(6):998–1009）"
    publisher: "Lally、van Jaarsveld、Potts、Wardle"
    year: 2010
    level: study
    population: "96 名志愿者，每天在固定情境（如早饭后）做一件饮食、饮水或活动类的新行为，持续 12 周"
    summary: "在固定情境里重复做，自动化程度会逐渐上升并趋于稳定；达到稳定所需时间个人差异很大，从 18 天到 254 天；偶尔漏一次不影响，越规律越容易形成习惯。"
    points:
      - text: "在同一情境里反复做一件事，自动化程度按逐渐趋平的曲线上升。"
        where: "Abstract"
      - text: "达到自身自动化上限 95% 所需的时间从 18 天到 254 天不等，个人差异很大，可能需要很长时间。"
        where: "Abstract"
      - text: "漏掉一次机会不会实质性影响习惯形成。"
        where: "Abstract"
      - text: "做得越规律，越符合习惯形成的曲线。"
        where: "Abstract"
    keywords: ["习惯", "坚持", "多久养成", "21天", "坚持不下去", "漏了一次", "断了"]
    url: https://doi.org/10.1002/ejsp.674
    review: claude_draft

  - id: K101
    domains: [training, nutrition]
    title: "自我记录加上其他自我调节方法更有效"
    source: "Effective techniques in healthy eating and physical activity interventions: a meta-regression（Health Psychol 28(6):690–701）"
    publisher: "Michie、Abraham、Whittington、McAteer、Gupta"
    year: 2009
    level: systematic_review
    population: "122 项健康饮食和身体活动干预评估、44747 人"
    summary: "在 26 种行为改变技术里，自我记录最能解释干预效果的差异；把自我记录和至少一种基于控制理论的其他自我调节技术组合起来，效果明显更好。"
    points:
      - text: "健康饮食和身体活动干预的合并效应量约 0.31。"
        where: "Abstract（Results）"
      - text: "自我记录是解释各研究效果差异最多的技术（约 13%）。"
        where: "Abstract（Results）"
      - text: "自我记录与至少一种基于控制理论的其他技术组合的干预，效应量约 0.42；没有这样组合的约 0.26。"
        where: "Abstract（Results）"
    keywords: ["记录", "打卡", "记训练", "记饮食", "自我监测", "坚持", "动力"]
    url: https://doi.org/10.1037/a0016136
    review: claude_draft

  - id: K102
    domains: [training]
    title: "\"如果……就……\"计划能帮人多运动"
    source: "A meta-analytic review of the effect of implementation intentions on physical activity（Health Psychol Rev 7(1):23–54）"
    publisher: "Bélanger-Gravel、Godin、Amireault"
    year: 2013
    level: systematic_review
    population: "26 项身体活动干预研究"
    summary: "事先定好\"在什么时间、什么地点、遇到什么情况就怎么做\"的执行计划，对增加身体活动有小到中等的作用，随访时仍有效；计划里包含应对障碍的办法时效果更大。"
    points:
      - text: "干预刚结束时，执行计划对身体活动的效应量约 0.31。"
        where: "Abstract（Results）"
      - text: "随访时效应量约 0.24，随访时间长短对效果没有明显影响。"
        where: "Abstract（Results）"
      - text: "计划中包含应对障碍的内容时效果更大；在学生和临床人群中效果更好。"
        where: "Abstract（Results，调节因素）"
    keywords: ["计划", "如果就", "执行意图", "什么时候练", "坚持", "没动力", "拖延"]
    url: https://doi.org/10.1080/17437199.2011.560095
    review: claude_draft

  - id: K103
    domains: [recovery, safety]
    title: "软组织扭伤拉伤怎么处理（PEACE & LOVE）"
    source: "Soft-tissue injuries simply need PEACE and LOVE（Br J Sports Med 54(2):72–73）"
    publisher: "Dubois、Esculier"
    year: 2020
    level: review
    population: "扭伤、拉伤等软组织损伤的人（这是期刊社论，属于专家意见，不是系统综述）"
    summary: "受伤头几天以保护为主（PEACE）：减少负重 1–3 天、抬高、加压包扎，不常规用消炎药和冰敷，并了解恢复要靠主动练；过了头几天转入 LOVE：疼痛允许时尽早恢复负荷和日常活动、保持乐观、做不引起疼痛的有氧、逐步做恢复活动度、力量和平衡的练习。"
    points:
      - text: "受伤后先减少负重或限制活动 1–3 天；休息不宜过久，什么时候停止保护以疼痛为参考。"
        where: "P for protect"
      - text: "把受伤的肢体抬到高于心脏的位置；证据弱，但风险很低。"
        where: "E for elevate"
      - text: "消炎药可能不利于组织的长期修复，作者建议不作为常规处理；冰敷没有高质量证据支持，主要起止痛作用。"
        where: "A for avoid anti-inflammatory modalities"
      - text: "用绷带或贴布加压可以限制肿胀；脚踝扭伤后加压似乎能减轻肿胀。"
        where: "C for compress"
      - text: "头几天过后，在不加重疼痛的前提下尽早加负荷，症状允许就恢复日常活动。"
        where: "L for load"
      - text: "受伤几天后开始做不引起疼痛的有氧运动。"
        where: "V for vascularisation"
      - text: "用练习恢复活动度、力量和本体感觉；恢复期避免引起疼痛，以疼痛作为加量的参考。"
        where: "E for exercise"
    keywords: ["扭伤", "拉伤", "崴脚", "冰敷", "消炎药", "受伤", "软组织", "肿"]
    url: https://doi.org/10.1136/bjsports-2019-101253
    review: claude_draft

  - id: K104
    domains: [recovery, safety]
    title: "崴脚（外踝扭伤）后怎么处理（荷兰临床指南 2018）"
    source: "Diagnosis, treatment and prevention of ankle sprains: update of an evidence-based clinical guideline（Br J Sports Med 52(15):956）"
    publisher: "Vuurberg、Hoorntje、Wink 等"
    year: 2018
    level: guideline
    population: "急性外踝扭伤的人"
    summary: "怀疑骨折要由医务人员按渥太华踝关节规则判断要不要拍片；单靠 RICE 没有证据；固定最多不超过 10 天，之后用护踝等支具 4–6 周并尽早开始练习；练习能减少再次扭伤；有监督的本体感觉、力量、协调和功能练习能更快回到运动。"
    points:
      - text: "怀疑骨折时，应由医务人员用渥太华踝关节规则判断是否需要拍片。"
        where: "Diagnostics — Recommendation (new)"
      - text: "单用 RICE（休息、冰敷、加压、抬高），或单用冰敷、单用加压，都没有证据能改善疼痛、肿胀或功能。"
        where: "Treatment — RICE, Recommendation (modified)"
      - text: "消炎药可以用来减轻疼痛和肿胀，但有并发症风险，也可能延缓自然愈合。"
        where: "Non-steroidal anti-inflammatory drugs — Recommendation (new)"
      - text: "如果为止痛消肿而固定，最长不超过 10 天，之后改为功能性治疗。"
        where: "Immobilisation — Recommendation (not changed)"
      - text: "护踝或贴布等功能性支持用 4–6 周，优于固定；护踝的效果最好。"
        where: "Functional support — Recommendation (modified)"
      - text: "扭伤后应开始练习来恢复关节功能；早开始的练习能把再次扭伤的风险降到约 0.62 倍（RR 0.62）。"
        where: "Exercise — text and Recommendation (modified)"
      - text: "疼痛通常在头两周内明显减轻，但 1–4 年后仍有 5%–46% 的人有疼痛、3%–34% 的人再次扭伤。"
        where: "Prognostic factors"
      - text: "包括本体感觉、力量、协调和功能的有监督练习，能更快回到运动。"
        where: "Sport resumption — Recommendation (modified)"
    keywords: ["崴脚", "扭脚", "踝关节扭伤", "脚踝", "护踝", "拍片", "骨折"]
    url: https://doi.org/10.1136/bjsports-2017-098106
    review: claude_draft

  - id: K105
    domains: [recovery, training]
    title: "跟腱病：先从小腿练习开始"
    source: "Which treatment is most effective for patients with Achilles tendinopathy? A living systematic review with network meta-analysis of 29 randomised controlled trials（Br J Sports Med 55(5):249–256）"
    publisher: "van der Vlist、Winters、Weir 等"
    year: 2021
    level: systematic_review
    population: "跟腱病患者（29 项随机对照试验，86% 是跟腱中段病变；证据确定性很低到低）"
    summary: "跟腱中段病变时，各种积极治疗在 3 个月时都比只观望好，彼此之间没有明显差别；练习简单、便宜、副作用少，可以先从小腿肌肉练习方案开始。"
    points:
      - text: "跟腱中段病变不建议只观望：3 个月时各种积极治疗都比观望好（证据确定性很低到低）。"
        where: "Abstract（Results; Summary/Conclusion）"
      - text: "3 个月和 12 个月时，不同积极治疗之间的效果没有临床上有意义的差别。"
        where: "Abstract（Summary/Conclusion）"
      - text: "练习容易安排、花费低、危害少，可以先从小腿肌肉练习方案开始。"
        where: "Abstract（Summary/Conclusion）"
    keywords: ["跟腱", "跟腱炎", "跟腱痛", "肌腱", "小腿", "提踵"]
    url: https://doi.org/10.1136/bjsports-2019-101872
    review: claude_draft

  - id: K106
    domains: [safety]
    title: "腰背痛什么时候要看医生、什么时候要立即就医"
    source: "Back pain（NHS website，2026-03-05 审阅）"
    publisher: "英国国家医疗服务体系（NHS）"
    year: 2026
    level: health_info
    population: "腰背痛的人"
    summary: "腰背痛大多几周内自行好转，宜保持活动、不要久卧；但出现双腿麻木无力、会阴部感觉减退、大小便异常、胸痛或严重外伤后疼痛时要立即就医；伴发热不适、突然剧痛或迅速加重时要尽快看医生；几周不好、夜间加重、体重无故下降等要看医生。"
    points:
      - text: "腰背痛同时出现双腿疼痛、刺痛、无力或麻木，会阴或肛门周围感觉减退，排尿排便异常（如尿不出、失禁），性功能突然改变，胸痛，或在严重事故后开始疼痛，应立即叫急救或去急诊。"
        where: "Immediate action required: Call 999 or go to A&E if"
      - text: "腰背痛伴发热、发冷、寒战或全身不适，或疼痛突然剧烈、迅速加重，应尽快看医生。"
        where: "Urgent advice"
      - text: "在家处理几周不见好、影响日常活动、体重无故下降、背部有肿块或变形、休息不缓解或夜间加重、咳嗽打喷嚏排便时加重、疼痛在两肩胛之间，应去看医生。"
        where: "Non-urgent advice: See a GP if"
      - text: "腰背痛时尽量保持活动、继续日常活动，不要长时间卧床；做练习时如果疼痛加重就停下并咨询医生。"
        where: "How to ease back pain yourself — Do / Don't; Exercises and stretches"
    keywords: ["腰痛", "背痛", "腰疼", "腿麻", "大小便", "会阴", "红旗", "急诊"]
    url: https://www.nhs.uk/conditions/back-pain/
    review: claude_draft

  - id: K107
    domains: [safety, recovery]
    title: "新冠等病毒感染后怎么逐步恢复运动（普通人）"
    source: "Returning to physical activity after covid-19（BMJ 372:m4721，Practice Pointer）"
    publisher: "Salman、Vishnubala、Le Feuvre 等"
    year: 2021
    level: review
    population: "新冠后体能下降、但没有长新冠的普通人（基于共识和专家经验，没有高质量研究）"
    summary: "先分流：病中有胸痛、严重气短、心悸、晕厥或接近晕厥的，先就医评估；没有这些情况的，症状消失满 7 天后再开始，先用至少两周做极轻和轻度活动，每阶段至少 7 天，按自觉用力程度逐步加量；症状反复就停下、退回上一阶段，必要时就医。"
    points:
      - text: "症状消失至少 7 天后才恢复运动，并先用至少两周做很轻的活动。"
        where: "What you need to know; How to start — Phases 1–2"
      - text: "病中出现胸痛、严重气短、心悸、心衰表现、晕厥或接近晕厥的人，恢复运动前要先就医检查；住过院的人要在医疗团队配合下康复。"
        where: "How do I know if my patient can safely return to physical activity?"
      - text: "第 1 阶段 7 天做极轻活动（自觉用力 6–8 分，满分 6–20）；第 2 阶段 7 天做轻活动（6–11 分），如散步、轻瑜伽，能耐受时每天加 10–15 分钟。"
        where: "How to start — Phases 1–2"
      - text: "第 3 阶段做两段各 5 分钟、中间休息的间歇活动（自觉用力 12–14 分，仍能说话）；第 4 阶段加入考验协调、力量和平衡的动作；每阶段至少 7 天。"
        where: "Phases 3–4"
      - text: "练后 1 小时或第二天还没缓过来、气短或心率异常、过度疲劳时，退回前一阶段，拿不准就就医。"
        where: "Phases 3–4"
      - text: "咳嗽、异常气短、心悸、发热、嗅觉丧失等症状再次出现时要停下，必要时就医，症状消失后再重新开始。"
        where: "How do I guide a patient back to physical activity?"
      - text: "心肌炎时运动与更高的发病和死亡风险有关；病毒性心肌炎不只见于新冠，流感等许多病毒都可能引起；确诊心肌炎的，欧美指南建议限制运动 3–6 个月。"
        where: "What are the risks...; Box 1; risk-stratification paragraph"
    keywords: ["新冠", "阳了", "感冒后", "发烧后", "病后恢复", "心肌炎", "心悸", "胸痛"]
    url: https://doi.org/10.1136/bmj.m4721
    review: claude_draft

  - id: K108
    domains: [safety, recovery, training]
    title: "运动员新冠后分级回到训练（英国各运动研究院）"
    source: "Infographic. Graduated return to play guidance following COVID-19 infection（Br J Sports Med 54(19):1174–1175）"
    publisher: "Elliott、Martin、Heron、Elliott、Grimstead、Biswas"
    year: 2020
    level: consensus
    population: "轻到中度新冠的运动员（以有氧成分的运动为主；需在医疗监督下进行）"
    summary: "开始前要能完成日常活动并平地走 500 米不过度疲劳或气短，发病后至少休息 10 天、无症状至少 7 天且停用所有药物；之后分阶段加量，心率和时长都有上限，最早第 17 天恢复常规训练；出现症状就退回上一阶段。"
    points:
      - text: "开始分级恢复前，要能完成日常活动，并能平地走 500 米而不过度疲劳或气短。"
        where: "正文 GRTP 前提"
      - text: "发病后至少休息 10 天、无症状至少 7 天，并已停用所有治疗药物（如退烧药）。"
        where: "正文；Figure 1"
      - text: "第 2 阶段（至少 2 天）做轻活动，心率低于最大心率的 70%、少于 15 分钟，不做力量训练。"
        where: "Figure 1（Stage 2）"
      - text: "第 3A、3B 阶段（各至少 1 天）心率低于 80%，时长分别少于 30、45 分钟；第 4 阶段（至少 2 天）心率低于 80%、少于 60 分钟；第 5 阶段最早在第 17 天恢复常规训练。"
        where: "Figure 1（Stages 3A–5）"
      - text: "过程中出现任何症状（包括过度疲劳），退回前一阶段，无症状休息至少 24 小时后再进。"
        where: "正文 setbacks"
      - text: "有糖尿病、心血管病、肾病，或病情复杂、住过院的人，开始前要先做医学评估。"
        where: "正文；Figure 1"
    keywords: ["新冠", "阳了", "病后恢复", "运动员", "心率", "分级恢复"]
    url: https://doi.org/10.1136/bjsports-2020-102637
    review: claude_draft

  - id: K109
    domains: [safety, training]
    title: "产后什么时候、怎样恢复跑步"
    source: "Returning to running postnatal – guidelines for medical, health and fitness professionals managing this population（2019 年 3 月；2020 年在 Br J Sports Med 54(18):1114–1115 发表信息图）"
    publisher: "Goom、Donnelly、Brockwell"
    year: 2019
    level: consensus
    population: "产后女性（顺产和剖宫产都适用；属于专家意见，没有专门研究）"
    summary: "产后头 3 个月做低冲击练习，最早产后 3–6 个月再恢复跑步；有盆底功能障碍症状时不宜跑；跑前先通过一组负荷和冲击测试；跑步要循序渐进、先加量再加强度。"
    points:
      - text: "产后不满 3 个月不建议跑步；之后如果出现盆底功能障碍的症状，也不宜跑步（专家意见）。"
        where: "Evidence-Based Recommendation 2（p10）"
      - text: "产后头 3 个月按低冲击练习的时间线进行，最早在产后 3–6 个月恢复跑步。"
        where: "p10；p12"
      - text: "出现盆腔下坠或拖拽感、漏尿或控制不住排便、腹部明显下垂或中线分离、盆腔或腰部疼痛、产后 8 周后仍有与月经无关的出血时，应找盆底康复专科评估。"
        where: "p12（Guidance for patients and non-clinical persons）"
      - text: "恢复跑步前，应能完成以下动作而不出现疼痛、下坠、拖拽或漏尿：走 30 分钟、单腿站 10 秒、单腿蹲每侧 10 次、原地慢跑 1 分钟、向前跳 10 次、单腿原地跳每侧 10 次、单腿摆臂抬腿每侧 10 次。"
        where: "Load and impact management assessment（p16）"
      - text: "力量测试（单腿提踵、单腿臀桥、单腿坐站、侧卧抬腿）以每项 20 次为目标；力量不足不是跑步的禁忌，而是提示练什么。"
        where: "Strength testing（p17）"
      - text: "产后 6–8 周可以开始轻重量的硬拉动作练习，起始不超过婴儿加安全座椅的重量（15 千克），逐步加重。"
        where: "Appendix 2（Week 6 to 8）"
      - text: "产后 12 周以后按分级计划（如从零到 5 公里）恢复跑步，先加距离或时间、再加强度，并留意症状。"
        where: "Appendix 3"
    keywords: ["产后", "生完孩子", "坐月子", "剖腹产", "顺产", "漏尿", "盆底", "产后跑步"]
    url: https://athleticsni.org/download/files/Returning_to_running_postnatal_guideline_for_medical_health_and_fitness_professionals_managing_this_population.05.pdf
    review: claude_draft

  - id: K110
    domains: [safety, training]
    title: "孕期运动的禁忌证与注意事项（加拿大 2019 指南）"
    source: "2019 Canadian guideline for physical activity throughout pregnancy（Br J Sports Med 52(21):1339–1346；同时刊于 J Obstet Gynaecol Can）"
    publisher: "加拿大妇产科医师学会与加拿大运动生理学会（Mottola、Davenport、Ruchat 等）"
    year: 2018
    level: guideline
    population: "孕妇"
    summary: "没有禁忌证的孕妇整个孕期都应活动，每周至少 150 分钟中等强度、分在至少 3 天，有氧和力量结合；有绝对禁忌证的只保持日常活动，有相对禁忌证的先和产检医生商量；列出了必须停止并就医的信号和需要避免的活动。"
    points:
      - text: "绝对禁忌证：胎膜破裂、早产临产、不明原因的持续阴道出血、28 周后前置胎盘、子痫前期、宫颈机能不全、胎儿生长受限、三胎及以上、未控制的 1 型糖尿病、高血压或甲状腺病，以及其他严重心肺或全身疾病；这些人只保持日常活动，不做较费力的运动。"
        where: "Contraindications（absolute）；Table 2"
      - text: "相对禁忌证：反复流产、妊娠期高血压、自发早产史、轻中度心肺疾病、有症状的贫血、营养不良、进食障碍、28 周后的双胎等；这些人做中高强度运动前要先和产检医生商量。"
        where: "Contraindications（relative）；Table 2"
      - text: "每周至少 150 分钟中等强度活动，分在至少 3 天；有氧和力量训练结合效果更好。"
        where: "Recommendations 2–4"
      - text: "平躺运动时出现头晕、恶心或不适的，改用其他姿势。"
        where: "Recommendation 6"
      - text: "出现休息后不缓解的气短、剧烈胸痛、规律而疼痛的宫缩、阴道出血、持续阴道流液、休息后不缓解的头晕或晕厥感，应停止活动并就医。"
        where: "Box 2"
      - text: "避免潜水、有身体接触或易摔倒的运动（如骑马、滑雪、体操、奥举）、户外骑车、高温高湿下剧烈运动；平时住在 2500 米以下的人避免在 2500 米以上运动。"
        where: "Safety precautions；Box 1"
      - text: "出现腹直肌分离的，避免卷腹类腹肌练习并寻求物理治疗建议；用力憋气时头晕的应避免憋气。"
        where: "Safety precautions"
      - text: "研究里最高强度约相当于慢跑（7 METs）；长期高强度运动的安全性不清楚，高强度只建议在有监护的情况下进行。"
        where: "Recommendations 2–4 正文"
    keywords: ["怀孕", "孕期", "孕妇", "禁忌", "前置胎盘", "憋气", "平躺", "腹直肌分离"]
    url: https://doi.org/10.1136/bjsports-2018-100056
    review: claude_draft

  - id: K111
    domains: [safety, training]
    title: "骨质疏松的人怎么练（Too Fit To Fracture 2014）"
    source: "Too Fit To Fracture: exercise recommendations for individuals with osteoporosis or osteoporotic vertebral fracture（Osteoporos Int 25(3):821–835）"
    publisher: "Giangregorio、Papaioannou、MacIntyre 等（国际专家组，GRADE 方法）"
    year: 2014
    level: consensus
    population: "65 岁以上骨质疏松或有骨质疏松性椎体骨折的人"
    summary: "强烈建议做包含力量和平衡训练的综合方案：力量每周至少 2 天、每个主要肌群 2 组 8–12RM，平衡每天 15–20 分钟、每周累计约 2 小时；不要只做有氧；有椎体骨折或骨折风险高的人先咨询物理治疗师。"
    points:
      - text: "强烈建议骨质疏松（含椎体骨折）的人做包含力量训练和平衡训练的综合运动方案；建议不要只做有氧而不做力量和平衡。"
        where: "Abstract（Results）；Recommendations"
      - text: "力量训练每周至少 2 天，每个主要肌群至少 1 个动作、2 组、8–12RM；久坐、骨折风险高或没练过的人先用更低强度。"
        where: "Resistance training；Table 6"
      - text: "平衡训练每天 15–20 分钟，每周累计约 2 小时，可以分段做或融入日常活动，从静态练到动态。"
        where: "Balance training；Table 6"
      - text: "骨折风险高的人开始新方案前宜咨询熟悉骨质疏松的物理治疗师；所有人都要学会在转身弯腰、负重、平衡挑战时安全地动。"
        where: "Recommendations（safety paragraph）"
      - text: "有椎体骨折的人建议咨询物理治疗师，以确保运动安全合适。"
        where: "Recommendations for older adults with osteoporotic vertebral fracture"
      - text: "有氧运动每周 3–5 天、每天 30–60 分钟，可以用每次 10 分钟的短段；时间不够时，有氧不能挤掉力量和平衡。"
        where: "Table 6 及注"
    keywords: ["骨质疏松", "骨密度", "骨折", "压缩性骨折", "驼背", "老年", "绝经后"]
    url: https://doi.org/10.1007/s00198-013-2523-2
    review: claude_draft

  - id: K112
    domains: [safety, training]
    title: "膝、髋骨关节炎：运动是核心治疗（NICE 2022）"
    source: "Osteoarthritis in over 16s: diagnosis and management（NICE guideline NG226）"
    publisher: "英国国家卫生与临床优化研究所（NICE）"
    year: 2022
    level: guideline
    population: "16 岁以上的骨关节炎患者"
    summary: "所有骨关节炎患者都应做量身定制的治疗性运动（局部肌力和全身有氧）；刚开始关节可能更疼，但坚持规律运动有益；超重的人减重越多越好；不常规用护具、鞋垫。"
    points:
      - text: "所有骨关节炎患者都应做按个人情况调整的治疗性运动，如局部肌肉力量练习和全身有氧练习；可以考虑有指导的练习课程。"
        where: "Recommendations 1.3.1–1.3.2"
      - text: "刚开始运动时关节疼痛可能加重；即便起初有些疼或不适，规律坚持运动对关节有益，长期坚持能减轻疼痛、改善功能和生活质量。"
        where: "Recommendation 1.3.3"
      - text: "超重或肥胖的人减重能改善功能、减轻疼痛；减多少都有益，减掉体重的 10% 可能比 5% 更好。"
        where: "Recommendation 1.3.5"
      - text: "下肢骨关节炎可以考虑用手杖等助行工具；不常规使用鞋垫、护膝、贴布，除非有关节不稳且单靠运动无效。"
        where: "Recommendations 1.3.10–1.3.11"
      - text: "45 岁以上、活动相关的关节痛、没有晨僵或晨僵不超过 30 分钟的，可以不拍片做出临床诊断；有不典型表现时才考虑影像检查（由医生判断）。"
        where: "Recommendations 1.1.1–1.1.2"
    keywords: ["骨关节炎", "关节炎", "膝关节炎", "膝盖疼", "髋关节", "退行性", "老寒腿"]
    url: https://www.nice.org.uk/guidance/ng226
    review: claude_draft

  - id: K113
    domains: [recovery, nutrition]
    title: "睡前 6 小时内的咖啡因也会影响睡眠"
    source: "Caffeine effects on sleep taken 0, 3, or 6 hours before going to bed（J Clin Sleep Med 9(11):1195–1200）"
    publisher: "Drake、Roehrs、Shambroom、Roth"
    year: 2013
    level: rct
    population: "12 名睡眠正常的健康成年人（19–48 岁，男女各半；随机双盲交叉试验，样本小）"
    summary: "睡前 0、3、6 小时服 400 毫克咖啡因都会扰乱睡眠；即使在睡前 6 小时服用，客观测得的总睡眠时间也少了 1 小时以上，而本人不一定察觉。"
    points:
      - text: "睡前 0、3、6 小时服用 400 毫克咖啡因，都比安慰剂明显扰乱睡眠。"
        where: "Abstract（Results）"
      - text: "客观测量的总睡眠时间在三个时间点都减少约 1.1–1.2 小时；睡前 6 小时服用也少睡 1 小时以上。"
        where: "Results（objective measures）；Discussion"
      - text: "睡前 6 小时服用时，本人记录的睡眠只减少约 41 分钟且无统计学差异，只有客观测量发现了明显影响。"
        where: "Results（diary measures）；Discussion"
      - text: "作者建议睡前至少 6 小时内不摄入大量咖啡因，下午喝咖啡最好在 17 点之前。"
        where: "Abstract（Conclusion）；Discussion"
    keywords: ["咖啡", "咖啡因", "失眠", "睡不着", "下午喝咖啡", "预锻炼", "能量饮料"]
    url: https://doi.org/10.5664/jcsm.3170
    review: claude_draft

  - id: K114
    domains: [recovery, nutrition]
    title: "练后大量饮酒会降低肌肉蛋白合成"
    source: "Alcohol ingestion impairs maximal post-exercise rates of myofibrillar protein synthesis following a single bout of concurrent training（PLoS One 9(2):e88384）"
    publisher: "Parr、Camera、Areta、Burke、Phillips、Hawley、Coffey"
    year: 2014
    level: rct
    population: "8 名经常运动的男性（随机交叉试验；饮酒量很大，约 12 个标准杯）"
    summary: "力量加有氧训练后大量饮酒（每公斤体重 1.5 克酒精），即使同时补充蛋白质，肌肉蛋白合成也比只补蛋白质低约 24%；酒配碳水时低约 37%。"
    points:
      - text: "练后按每公斤体重 1.5 克酒精饮酒（约 12±2 个标准杯）。"
        where: "Abstract（Methods）"
      - text: "与只补充蛋白质相比，饮酒同时补蛋白质时肌肉蛋白合成低约 24%，饮酒配碳水时低约 37%。"
        where: "Abstract（Results）"
      - text: "即使和蛋白质一起摄入，酒精也会抑制练后肌肉的合成反应，可能影响恢复和训练适应。"
        where: "Abstract（Conclusion）"
    keywords: ["喝酒", "饮酒", "酒精", "啤酒", "聚餐", "练后恢复", "增肌"]
    url: https://doi.org/10.1371/journal.pone.0088384
    review: claude_draft

  - id: K115
    domains: [recovery, training]
    title: "力量训练后马上冰水浴可能削弱增肌"
    source: "Throwing cold water on muscle growth: A systematic review with meta-analysis of the effects of postexercise cold water immersion on resistance training-induced hypertrophy（Eur J Sport Sci 24(2):177–189）"
    publisher: "Piñero、Burke、Augustin 等（含 Schoenfeld）"
    year: 2024
    level: systematic_review
    population: "8 项随机研究，20–26 岁年轻人为主（7 项只有男性）；研究质量一般到较差"
    summary: "每次力量训练后马上冰水浴，增肌幅度比不浴小（小效应，可信区间刚好跨过 0），训练过的人和新手都一样；想最大化增肌的人不宜在练后马上冰水浴。结论只适用于练后 15 分钟内浸泡，偶尔用或隔几小时用没有研究。"
    points:
      - text: "只做力量训练的增肌效应约为 0.36（小到中等），练后加冰水浴时只有约 0.14（小到可忽略）。"
        where: "Abstract"
      - text: "直接比较时冰水浴组增肌更少（效应 −0.22，95% 可信区间 −0.47 到 0.04），有约 96% 的概率确实不如不浴。"
        where: "Abstract"
      - text: "训练水平（练过还是新手）不改变这个结果。"
        where: "Abstract；Highlights"
      - text: "结论只适用于练后 15 分钟内冰水浴；隔几小时或偶尔使用的情况没有研究。"
        where: "Discussion（practical implications）"
      - text: "纳入研究质量一般到较差，结论需谨慎看待。"
        where: "Abstract"
    keywords: ["冰水浴", "冰浴", "冷水澡", "冷疗", "泡冰水", "增肌", "恢复"]
    url: https://doi.org/10.1002/ejsc.12074
    review: claude_draft

  - id: K116
    domains: [recovery]
    title: "延长睡眠和小睡对运动表现最有帮助"
    source: "The Impact of Sleep Interventions on Athletic Performance: A Systematic Review（Sports Med Open 9:58）"
    publisher: "Cunha、Costa、Marques、Brito、Lastella、Figueiredo"
    year: 2023
    level: systematic_review
    population: "个人项目和团队项目的运动员（25 项干预研究，2011–2021 年）"
    summary: "在各种睡眠干预里，夜里多睡（延长睡眠）和白天小睡对改善睡眠和运动表现最有效；睡眠卫生宣教、晚上不用电子设备、冷水浴没看到效果，但研究很少。整体高质量证据有限。"
    points:
      - text: "延长夜间睡眠和小睡是研究最多、也最有效的改善睡眠和表现的办法。"
        where: "Abstract（Results; Conclusion）"
      - text: "睡眠卫生宣教、晚上移除电子设备、冷水浴对睡眠和随后的表现或恢复没有效果，但只基于少数研究。"
        where: "Abstract（Results）"
      - text: "高质量证据有限，结论需谨慎。"
        where: "Abstract（Conclusion）"
    keywords: ["睡眠", "多睡", "午睡", "小睡", "补觉", "睡不够", "恢复"]
    url: https://doi.org/10.1186/s40798-023-00599-z
    review: claude_draft

  - id: K117
    domains: [training, nutrition]
    title: "力量训练消耗多少：代谢当量"
    source: "2024 Adult Compendium of Physical Activities: A third update of the energy costs of human activities（J Sport Health Sci 13(1):6–12）"
    publisher: "Herrmann、Willis、Ainsworth 等"
    year: 2024
    level: review
    population: "19–59 岁成年人（各项活动的能量消耗按已发表的测量整理）"
    summary: "力量训练的代谢当量（MET）：多个动作、每组 8–15 次、重量不一为 3.5；大重量、健美、用力程度高为 6.0。消耗约等于代谢当量 × 体重（公斤）× 小时；是按一般人整理的平均值，个人差异大，只能当估算。"
    points:
      - text: "02054 力量训练，多个动作、每组 8–15 次、重量不一：3.5 MET。"
        where: "Conditioning exercise（02054）"
      - text: "02050 力量训练（自由重量或器械）、力量举或健美，用力程度高：6.0 MET。"
        where: "Conditioning exercise（02050）"
      - text: "代谢当量是按成年人平均整理的，用来估算个人消耗时有误差。"
        where: "Introduction"
    keywords: ["消耗", "热量消耗", "千卡", "卡路里", "代谢当量", "MET", "练一次消耗多少"]
    url: https://doi.org/10.1016/j.jshs.2023.10.010
    review: claude_draft

  - id: K118
    domains: [nutrition]
    title: "地中海饮食加特级初榨橄榄油或坚果可降低高心血管风险人群的主要心血管事件"
    source: "Primary Prevention of Cardiovascular Disease with a Mediterranean Diet Supplemented with Extra-Virgin Olive Oil or Nuts (PREDIMED)"
    publisher: "New England Journal of Medicine"
    year: 2018
    level: rct
    population: "55–80 岁、心血管高风险但尚无心血管病的成人"
    summary: "西班牙多中心试验，对照组只建议少吃脂肪；两种地中海饮食组的主要心血管事件都少于对照组。2013 年的原报告因随机化偏差被撤回，2018 年用修正后的分析重新发表。"
    points:
      - text: "共纳入 7447 人，年龄 55–80 岁，女性占 57%，中位随访 4.8 年"
        where: "摘要 Methods"
      - text: "主要事件发生率为橄榄油组 3.8%、坚果组 3.4%、对照组 4.4%"
        where: "摘要 Results"
      - text: "与对照组相比，橄榄油组 HR 0.69（95%CI 0.53–0.91），坚果组 HR 0.72（95%CI 0.54–0.95）"
        where: "摘要 Results"
      - text: "实际吃法是每周发放特级初榨橄榄油 1 升、目标每天至少 4 汤匙；或每天发放混合坚果 30 克（核桃 15 克、榛子 7.5 克、杏仁 7.5 克）；不要求限能量或增加运动"
        where: "补充来源 Basterra-Gortari 等 Diabetes Care 2019;42:1390（PMC6647050）Methods"
    keywords: ["地中海饮食", "橄榄油", "坚果", "心血管病", "一级预防", "鱼类", "豆类", "膳食模式"]
    url: https://doi.org/10.1056/NEJMoa1800389
    review: claude_draft

  - id: K119
    domains: [nutrition]
    title: "DASH 饮食加限钠能明显降低血压，两者合用效果最大"
    source: "Effects on Blood Pressure of Reduced Dietary Sodium and the DASH Diet (DASH-Sodium)"
    publisher: "New England Journal of Medicine"
    year: 2001
    level: rct
    population: "血压正常或患高血压的成人"
    summary: "在美国常见饮食组和 DASH 饮食组里，分别吃高、中、低三种钠水平的饮食各 30 天。钠越低血压越低，DASH 饮食在每个钠水平下都更低。"
    points:
      - text: "共 412 人，每个钠水平连续吃 30 天，顺序随机"
        where: "摘要 Methods"
      - text: "钠从高降到中，收缩压在对照饮食下降 2.1 mmHg、在 DASH 下降 1.3 mmHg；再从中降到低，又分别降 4.6 和 1.7 mmHg"
        where: "摘要 Results"
      - text: "低钠 DASH 与高钠对照饮食相比，血压正常者收缩压低 7.1 mmHg，高血压者低 11.5 mmHg"
        where: "摘要 Results"
      - text: "按每天 2000 千卡计，DASH 每天吃谷物 6–8 份、蔬菜 4–5 份、水果 4–5 份、低脂奶 2–3 份、肉禽鱼不超过 6 份、油脂 2–3 份；坚果种子豆类每周 4–5 份，甜食每周不超过 5 份；钠每天 2300 毫克，降到 1500 毫克降压更多"
        where: "补充来源 NHLBI DASH Eating Plan 页的份量表及脚注（https://www.nhlbi.nih.gov/education/dash-eating-plan）"
    keywords: ["DASH饮食", "高血压", "限钠", "低盐", "收缩压", "低脂奶", "蔬菜水果", "膳食模式"]
    url: https://doi.org/10.1056/NEJM200101043440101
    review: claude_draft

  - id: K120
    domains: [nutrition]
    title: "合理搭配的素食（含纯素）营养充足，适合各个年龄段和运动员，但纯素者必须补充 B12"
    source: "Position of the Academy of Nutrition and Dietetics: Vegetarian Diets (Melina, Craig, Levin)"
    publisher: "Journal of the Academy of Nutrition and Dietetics"
    year: 2016
    level: position_stand
    population: "各年龄段素食或纯素人群，包括孕期、哺乳期、儿童、老人和运动员"
    summary: "美国营养与饮食学会认为，搭配得当的素食健康、营养充足，并有助于防治部分慢性病；纯素者需要从强化食品或补充剂中获取 B12。"
    points:
      - text: "合理搭配的素食和纯素适合从孕期到老年的各个阶段，也适合运动员"
        where: "摘要"
      - text: "素食者患缺血性心脏病、2型糖尿病、高血压、部分癌症和肥胖的风险较低"
        where: "摘要"
      - text: "饱和脂肪少，蔬果、全谷物、豆类、豆制品、坚果和种子多，这与总胆固醇、LDL 更低和血糖控制更好有关"
        where: "摘要"
      - text: "纯素者需要可靠的 B12 来源，比如强化食品或补充剂"
        where: "摘要"
    keywords: ["素食", "纯素", "植物性饮食", "维生素B12", "素食运动员", "营养充足", "慢性病预防"]
    url: https://doi.org/10.1016/j.jand.2016.09.025
    review: claude_draft

  - id: K121
    domains: [nutrition]
    title: "成人2型糖尿病饮食要点：主食定量、多选全谷物，超重的人适度减重"
    source: "成人糖尿病食养指南（2023年版）（国家卫健委办公厅发文（国卫办食品函 2023 年 5 号）；原文 PDF 在官网没找到，这里是高校网站的转载）"
    publisher: "国家卫生健康委员会办公厅"
    year: 2023
    level: guideline
    population: "成人2型糖尿病患者（1型糖尿病、妊娠糖尿病需在专业人员指导下参考）"
    summary: "官方食养指南，要求能量合适、主食定量、优先吃全谷物和低 GI 食物，少油少盐，规律进餐并结合运动；超重的患者小幅减重就能获益。"
    points:
      - text: "推荐蛋白质占总能量 15–20%、碳水化合物 45–60%、脂肪 20–35%；按每天 1800–2000 千卡算，碳水约 200–300 克"
        where: "三（二）及（三）"
      - text: "全谷物和杂豆等低 GI 食物应占主食的三分之一以上；进餐时先吃菜、最后吃主食"
        where: "三（三）"
      - text: "超重或肥胖的患者减重 3–5% 就有临床意义；建议每月减 1–2 千克，3–6 个月减掉体重的 5–10%"
        where: "三（二）"
      - text: "每天吃蔬菜 500 克，深色蔬菜占一半以上；烹调油不超过 25 克，盐不超过 5 克"
        where: "三（一）及（五）"
      - text: "每周至少运动 5 天、每次 30–45 分钟，一半以上为中等强度；没有禁忌的话每周做 2 次抗阻训练"
        where: "三（四）"
    keywords: ["糖尿病饮食", "2型糖尿病", "主食定量", "全谷物", "低GI", "碳水化合物", "减重", "规律进餐"]
    url: https://xyy.wnmc.edu.cn/__local/1/04/47/4459384D8ED88F0BCD2E5E340C4_8FC79CD8_1FBE7F.pdf
    review: claude_draft

  - id: K122
    domains: [nutrition]
    title: "65 岁以上老人每天至少需要 1.0–1.2 g/kg 蛋白质，经常运动或患病的需要更多"
    source: "Evidence-based recommendations for optimal dietary protein intake in older people: a position paper from the PROT-AGE Study Group"
    publisher: "Journal of the American Medical Directors Association"
    year: 2013
    level: consensus
    population: "65 岁以上老人"
    summary: "老人对蛋白质的合成反应变弱、患病时分解增多，所以比年轻人需要更多蛋白质，并应配合个体化的耐力和抗阻运动。"
    points:
      - text: "健康老人每天平均至少吃 1.0–1.2 g/kg 蛋白质"
        where: "摘要"
      - text: "经常运动或日常活跃的老人，建议每天 ≥1.2 g/kg"
        where: "摘要"
      - text: "大多数有急性或慢性病的老人，需要每天 1.2–1.5 g/kg"
        where: "摘要"
      - text: "例外：eGFR <30 mL/min/1.73m² 且未透析的严重肾病老人，可能需要限制蛋白质"
        where: "摘要"
    keywords: ["老年人", "蛋白质", "肌少症", "抗阻训练", "每公斤体重", "肾功能", "衰弱"]
    url: https://doi.org/10.1016/j.jamda.2013.05.021
    review: claude_draft

  - id: K123
    domains: [nutrition]
    title: "已经在限能量的情况下，再限定进食时间并不能多减重"
    source: "Calorie Restriction with or without Time-Restricted Eating in Weight Loss"
    publisher: "New England Journal of Medicine"
    year: 2022
    level: rct
    population: "肥胖成人"
    summary: "两组能量摄入相同，一组只在上午 8 点到下午 4 点之间进食。12 个月后，体重、体脂和代谢指标两组都没有显著差别。"
    points:
      - text: "139 名肥胖患者随机分组，限时组只在 8:00–16:00 进食"
        where: "摘要 Methods"
      - text: "两组都限能量：男性每天 1500–1800 千卡，女性每天 1200–1500 千卡，持续 12 个月"
        where: "摘要 Methods"
      - text: "12 个月时限时组减重 8.0 千克，单纯限能量组减重 6.3 千克；差值 1.8 千克（95%CI −4.0 至 0.4，P=0.11），不显著"
        where: "摘要 Results"
      - text: "118 人（84.9%）完成随访；腰围、体脂、去脂体重、血压和代谢指标的结果与体重一致"
        where: "摘要 Results"
    keywords: ["限时进食", "轻断食", "间歇性禁食", "限能量", "减重", "肥胖", "进食窗口"]
    url: https://doi.org/10.1056/NEJMoa2114833
    review: claude_draft

  - id: K124
    domains: [nutrition]
    title: "超重肥胖的饮食干预：每天少吃 500–1000 千卡，可选高蛋白、轻断食或代餐"
    source: "体重管理指导原则（2024年版）"
    publisher: "国家卫生健康委员会"
    year: 2024
    level: guideline
    population: "超重或肥胖的成人（减重速度目标主要针对 BMI 24.0–32.5）"
    summary: "生活方式干预是减重的基础，饮食上以限能量为核心；高蛋白、低碳水、间歇性能量限制和代餐等可以按个人情况选用，部分只适合短期使用。"
    points:
      - text: "BMI 在 24.0 到 32.5 之间的人，起始目标是每周减 0.5–1 千克、每月 2–4 千克，6 个月内减掉体重的 5–15% 并保持"
        where: "三、超重肥胖的干预和治疗（开头）"
      - text: "每天少吃 500–1000 千卡或减少 30% 的总能量；碳水、脂肪、蛋白质分别占 50–60%、20–30%、15–20%"
        where: "三（一）1.（1）限制能量饮食"
      - text: "高蛋白饮食指蛋白质供能超过 20%，一般不超过 30%；低碳水饮食指碳水供能 ≤40%、脂肪 ≥30%"
        where: "三（一）1.（3）"
      - text: "间歇性能量限制包括隔日禁食、4:3 和 5:2，禁食日的能量一般不超过平时需要量的 25%；代餐是每天替换一到两餐"
        where: "三（一）1.（4）"
    keywords: ["减重", "超重肥胖", "限能量", "高蛋白饮食", "代餐", "间歇性能量限制", "5:2轻断食", "减重速度"]
    url: https://www.nhc.gov.cn/ylyjs/zcwj/202412/75cb79c171c94def9e768193e65484f7/files/1736390749000_59785.pdf
    review: claude_draft

  - id: K125
    domains: [nutrition]
    title: "改善身体成分的关键是持续的能量差，越瘦减得越慢越好，减脂期蛋白质要更高"
    source: "International society of sports nutrition position stand: diets and body composition"
    publisher: "Journal of the International Society of Sports Nutrition"
    year: 2017
    level: position_stand
    population: "想减脂或增肌的训练人群"
    summary: "减脂靠持续的能量缺口，增肌靠持续的能量盈余；低脂到生酮之间的各种饮食效果相近；做力量训练的瘦人在减脂期需要更高的蛋白质。"
    points:
      - text: "体脂越高，能量缺口可以开得越大；越瘦的人，减得慢越能保住瘦体重"
        where: "摘要 第3条"
      - text: "举例：每周减体重的 0.7% 比减 1.4% 保肌效果更好；健美备赛建议每周减体重的 0.5–1.0%"
        where: "Conclusions and recommendations"
      - text: "做力量训练的瘦人在能量不足时，可能需要每公斤去脂体重 2.3–3.1 g 蛋白质"
        where: "摘要 第6条"
      - text: "间歇性能量限制改善身体成分的效果，没有比每天限能量更好"
        where: "摘要 第7条"
      - text: "增肌期：新手能量盈余可以大一些，进阶训练者盈余要小一些，以免多长脂肪"
        where: "Conclusions and recommendations"
    keywords: ["减脂", "增肌", "能量缺口", "热量盈余", "减重速度", "高蛋白", "去脂体重", "身体成分"]
    url: https://doi.org/10.1186/s12970-017-0174-y
    review: claude_draft
