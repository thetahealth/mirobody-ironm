  - id: K58
    domains: [data, training]
    title: "30 秒坐站测试：下肢力量的简单测法"
    source: "Normative Reference Values and Validity for the 30-Second Chair-Stand Test in Healthy Young Adults（Int J Sports Phys Ther 17(5)）；测法来自 Rikli & Jones（1999）"
    publisher: "Lein 等；测法：Rikli、Jones"
    year: 2022
    level: study
    population: "19–35 岁健康成年人；测法最早用于 60 岁以上"
    summary: "坐在约 43 厘米高、没有扶手的椅子上，双手交叉抱胸，30 秒内尽量多次完全站起再坐下，记次数；在年轻成年人中也能反映下肢力量，并能区分活动量够和不够的人。"
    points:
      - text: "测法：椅子座高约 43 厘米、没有扶手、靠墙放稳；双手交叉抱在胸前；30 秒内完全站直再坐下，记完成的次数。"
        where: "Methods（沿用 Rikli & Jones 1999 的测法）"
      - text: "在 19–35 岁健康成年人中，30 秒坐站与下肢力量的实验室测量有关，并能区分身体活动充足和不足的人。"
        where: "Results; Conclusion"
    keywords: [坐站, 基线测试, 体能测试, 下肢力量, 自测]
    url: https://doi.org/10.26603/001c.36432
    review: claude_draft

  - id: K59
    domains: [training, safety]
    title: "老年人力量训练怎么练（NSCA 2019）"
    source: "Resistance Training for Older Adults: Position Statement From the National Strength and Conditioning Association（J Strength Cond Res 33(8):2019–2052）"
    publisher: "美国国家体能协会（Fragala、Cadore、Dorgo、Izquierdo、Kraemer、Peterson、Ryan）"
    year: 2019
    level: position_stand
    population: "健康的老年人；体弱、有慢病的另有调整"
    summary: "设计得当、有动作指导的力量训练对健康老年人是安全的；每周 2–3 次，每个主要肌群做 1–2 个多关节动作、2–3 组，强度逐步加到 70–85% 1RM，并加入中等重量、向上发力要快的爆发力练习；初学和体弱的从 1 组、较轻的重量和器械或弹力带开始，不练到力竭。"
    points:
      - text: "有合适的动作指导和保护时，力量训练对健康老年人是安全的。"
        where: "Practical Applications 1"
      - text: "每个主要肌群做 1–2 个多关节动作，逐步做到 2–3 组，强度达到 70–85% 1RM，每周 2–3 次；包括用 40–60% 1RM、向上发力尽量快的爆发力练习。"
        where: "Practical Applications 2"
      - text: "初学者和体弱的人从每个动作 1 组开始，逐步加到 2–3 组；初学者用较轻的重量做 10–15 次。"
        where: "Table 1（Sets、Repetitions）"
      - text: "从能承受的重量开始，逐步加到 70–85% 1RM；初学、体弱、有心血管病或骨质疏松的人用较轻的重量；不练到力竭以减少关节负担。"
        where: "Table 1（Intensity）"
      - text: "每个肌群每周练 2–3 次，安排在不连续的日子。"
        where: "Table 1（Frequency）"
      - text: "初学、体弱或活动受限的人适合用固定器械、弹力带和静力练习；能力较好的老年人加上自由重量更有益；加入模仿日常动作、改变支撑面和身体姿势的练习。"
        where: "Table 1（Modality、Functional movements）"
      - text: "力量和耐力在同一次训练里做时，先做力量。"
        where: "Table 1 注"
    keywords: [老年人, 老人, 60岁, 65岁, 退休, 长辈, 父母, 爸妈, 骨质疏松, 防跌倒]
    url: https://doi.org/10.1519/JSC.0000000000003230
    review: claude_draft

  - id: K60
    domains: [training, safety]
    title: "青少年力量训练怎么练（2014 国际共识）"
    source: "Position statement on youth resistance training: the 2014 International Consensus（Br J Sports Med 48(7):498–505）"
    publisher: "Lloyd、Faigenbaum、Stone 等（改编自英国体能协会的立场声明，多个儿科和运动医学组织认可）"
    year: 2014
    level: consensus
    population: "儿童和青少年"
    summary: "有合格指导时力量训练对儿童青少年是合适的；没练过的先用低训练量、较轻的重量学会动作，动作过关后再逐步加量；每周 2–3 次、不连续的日子最合适；整个训练过程都要看着动作是否正确。"
    points:
      - text: "没练过的孩子开始时用低训练量（1–2 组）和中低强度（不超过 60% 1RM），练多种动作模式；刚学深蹲这类多关节动作时每组只做 1–3 次、每次都给反馈。"
        where: "Progression of volume and intensity"
      - text: "动作掌握后可以进阶，例如每个动作 2–4 组、每组 6–12 次，强度不超过 80% 1RM。"
        where: "Progression of volume and intensity"
      - text: "每周 2–3 次、安排在不连续的日子，最适合提高儿童青少年的力量。"
        where: "Training frequency"
      - text: "训练中要一直看着动作是否正确；组间、动作间休息不足的高强度循环练法可能让动作变形。"
        where: "Training volume and intensity"
    keywords: [青少年, 孩子, 小孩, 儿童, 中学生, 初中, 高中, 未成年, 18岁以下]
    url: https://doi.org/10.1136/bjsports-2013-092952
    review: claude_draft

  - id: K61
    domains: [training]
    title: "时间不多时怎么练力量"
    source: "No Time to Lift? Designing Time-Efficient Training Programs for Strength and Hypertrophy: A Narrative Review（Sports Med 51:2079–2095）"
    publisher: "Iversen、Norum、Schoenfeld、Fimland"
    year: 2021
    level: review
    population: "时间有限的普通人（所引研究多为没练过或业余锻炼的人）"
    summary: "时间不多时，优先做双侧、多关节、全幅度的动作，每个肌群每周至少 4 组、用 6–15 次能做到的重量；每周总组数比练几次更重要；超级组、递减组能把时间缩短一半左右，但更适合增肌、不适合大重量的自由重量动作；热身只做针对动作的热身组。"
    points:
      - text: "优先做双侧、多关节、全幅度的动作，每个肌群每周至少 4 组，用 6–15RM 的重量。"
        where: "Abstract; Key Points"
      - text: "想少花时间时，先保证每周的总训练量，比追求一周练几次更重要。"
        where: "Abstract"
      - text: "至少包括一个腿部推蹬类动作（如深蹲）、一个上肢拉的动作和一个上肢推的动作；固定器械和自由重量都可以。"
        where: "Abstract"
      - text: "超级组、递减组、休息-暂停能把训练时间缩短约一半而训练量不变，但对增肌比对力量更有效；不建议用在深蹲、卧推这类大重量自由重量动作上。"
        where: "Abstract; Table 1"
      - text: "热身只做针对动作的热身组，不必做一般热身和拉伸。"
        where: "Abstract; Table 1"
    keywords: [没时间, 时间少, 半小时, 30分钟, 20分钟, 忙, 省时间, 超级组]
    url: https://doi.org/10.1007/s40279-021-01490-1
    review: claude_draft

  - id: K62
    domains: [training]
    title: "分化练和全身练效果差不多"
    source: "Efficacy of Split Versus Full-Body Resistance Training on Strength and Muscle Growth: A Systematic Review With Meta-Analysis（J Strength Cond Res 38(7):1330–1340）"
    publisher: "Ramos-Campo、Benito-Peinado、Andreu-Caravaca、Rojo-Tirado、Rubio-Arias"
    year: 2024
