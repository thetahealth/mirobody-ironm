  - id: K56
    domains: [safety, training]
    title: "开始运动前的健康筛查与分流（ACSM 2015）"
    source: "Updating ACSM's Recommendations for Exercise Preparticipation Health Screening（Med Sci Sports Exerc 47(11):2473–2479）"
    publisher: "美国运动医学会（Riebe、Franklin、Thompson 等）"
    year: 2015
    level: consensus
    population: "准备开始或继续运动的成年人"
    summary: "筛查只看三件事：现在有没有规律运动、有没有心血管、代谢或肾脏疾病及相关症状、打算练到多大强度；不再按危险因素个数分层，目的是减少不必要的就医门槛。"
    points:
      - text: "筛查依据三点：当前的身体活动水平；是否有心血管、代谢、肾脏疾病或相关症状；打算进行的运动强度。"
        where: "Abstract; Figure 1"
      - text: "规律运动指过去至少 3 个月，每周至少 3 天、每次至少 30 分钟中等强度的有计划运动。"
        where: "Figure 1 footnote"
      - text: "需要留意的症状包括胸部、颈部、下颌、手臂等处可能与缺血有关的疼痛或不适，静息或轻微活动时气短，头晕或晕厥，夜间憋醒或平躺时气短，脚踝水肿，心悸或心动过速，间歇性跛行，已知的心脏杂音，日常活动中异常的疲劳或气短。"
        where: "Figure 1 footnote"
      - text: "有症状的人，不论是否已知有病，开始或继续任何强度的运动前都应先请医生评估。"
        where: "Figure 1"
      - text: "没有规律运动、没有疾病和症状的人，可以不经医生评估从低到中等强度开始，逐步加量。"
        where: "Figure 1"
      - text: "已知有疾病但没有症状的人：没有规律运动的，开始前先请医生评估；已有规律运动的，可以继续中等强度，加到高强度前先请医生评估。"
        where: "Figure 1"
      - text: "强度划分：低强度约 2–3 梅脱、主观用力 9–11 分；中等强度约 3–6 梅脱、12–13 分；高强度 6 梅脱以上、14 分以上（6–20 分量表）。"
        where: "Figure 1 footnote"
    keywords: [运动前筛查, 能不能运动, 医生评估, 胸痛, 头晕, 心脏病, 糖尿病, 肾病, 开始运动]
    url: https://doi.org/10.1249/MSS.0000000000000664
    review: claude_draft

