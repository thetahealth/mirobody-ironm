# 方案库（spec [2026-10-23] §77）：按类别先定好的初步方案，由"选初步方案"工具（plan_templates）挑选，
# 再按这个人的器械、伤病把动作位换成动作库里的具体动作，做成计划草稿；最后的计划仍由 Agent 写、检查、用户确认。
#
# 字段：
#   levels  适用的训练水平：none 零基础 / lt6m 不到 6 个月 / 6m-2y 6 个月到 2 年 / 2y+ 2 年以上
#   goals   适合的目标，主要的写在最前：health 健康体能 / fat_loss 减脂 / muscle 增肌 / strength 力量 / endurance 耐力
#   people  adult 成年人 / older 60 岁以上 / youth 18 岁以下
#   place   gym 健身房 / home 在家 / any 都行；needs 必须有的器械（没有就不选这个方案）
#   minutes 每次大概多少分钟（下限、上限）
#   weeks   每周练几天 → 这几天依次练哪一次（sessions 的名字）
#   kind    base 自己的初步方案（默认）/ blogger 博主方案（§78）：博主方案写 source（博主、链接、查看日期、
#           是否二手整理）、aliases（点名用的叫法）、conflicts（和依据不一致的地方）、extras（附加说明，不放进计划）；
#           只提取结构，说明用自己的话写，不抄原文
#   slots   动作位：pick 按顺序挑第一个器械合适、伤处不受力的动作（都不行时找同类替代）；
#           free 是动作库里没有的动作，原样写进计划；sets、reps、load、note 照写进计划
# 数字都要在依据库里有出处（refs），没有的写〔经验〕。内容由 Claude 整理，待审定。
version: "0.1"
review: claude_draft

