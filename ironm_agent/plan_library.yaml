  # ---- 博主方案（§78）----
  - id: kai-tan-ppl
    kind: blogger
    standard: true  # 一般人的标准方案（§79）：一般成年人没点名时默认给这一份
    standard_weeks: [6]  # §170：每周 3 天的默认给全身三练（三分化每个肌群一周只练 1 次〔K05〕），这一份只管每周 6 天
    name: 凯圣王×谭成义三分化
    aliases: [谭师, 谭成义三分化, 凯圣王三分化, 标准三分化]
    source:
      authors: [凯圣王, 谭成义]
      url: https://github.com/bladevilR/tanshi-baodian/blob/main/references/03-three-split-and-1245-program.md
      seen: 2026-10-30
      secondhand: true
      note: 仓库没有许可证，说明整理自另外两个仓库
    levels: [none, lt6m, 6m-2y, 2y+]
    novice_sets: {none: 2, lt6m: 3}  # 新手每个动作 1–3 组〔K03〕；原版多数 4 组
    goals: [muscle, fat_loss, health]
    people: [adult]
    place: any
    minutes: [45, 85]
    weeks:
      3: [推, 拉, 腿]
      6: [推, 拉, 腿, 推, 拉, 腿]
    why: 每周练 6 天的一般人的标准方案（每周 3 天默认全身三练，§170）。推（胸、肩中束、三头）、拉（背、肩后束、二头）、腿（臀腿前后侧）三天轮转，每次 5 个动作，多关节动作在前〔经验〕；每周 6 次时每个肌群练 2 次，符合每周至少 2 次〔K05〕。原版是练三休一循环；动作按他有的器械换成同类动作（健身房、只有哑铃、只有自重和弹力带都排得出来）。
    intensity: 主要动作按 RPE 8、做完还能再做 2 次〔K28〕；有基础的卧推和单手下拉第 3 周最后一组做到力竭，新手不做力竭，其余不必练到力竭〔K29〕；组间休息 60–90 秒〔经验〕。
    progress: 12 周分四段：第 1–4 周练动作、留 2–4 次；第 5–8 周所有组做满次数上限再加 2.5 公斤（自重和弹力带换更难的变式或更紧的带子）；第 9–11 周加强度，主项留 1–2 次，总组数可以略减；第 12 周减量〔经验〕。做满次数再加重和依据一致〔K03〕。
    deload: 原版第 12 周减量，组数或重量降 30–40%〔经验〕；依据建议每 4–8 周减一次〔K31〕，累了可以提前。
    conflicts:
      - 每周只练 3 天时，每个肌群每周只练 1 次，少于每周至少 2 次的建议〔K05〕；能练 6 天、或者按原版练三休一更好。
      - 新手一般建议每周 2–3 次全身训练〔K03〕；这里按标准方案用三分化，组数已按水平减到每个动作 2–3 组。
      - 原版 12 周才减量一次，比依据建议的每 4–8 周一次〔K31〕间隔长。
    extras: 腹部隔天练一次：反向山羊挺身 4 组 20 次、绳索跪姿卷腹 4 组 15 次、悬垂举腿 4 组 12 次（控制不住改屈膝举腿）；下背或髋部累就顺延一天。
    refs: [K03, K05, K28, K29, K31]
    sessions:
      # 每一位按 健身房 → 只有哑铃 → 自重和弹力带 → 完全没有器械 的顺序写替换
      推:
        - {pick: [杠铃卧推, 哑铃卧推, 俯卧撑], sets: 4, reps: "15/12/10/8", note: 第 2 周 12/10/8/6，第 3 周 10/8/6/力竭；触胸停一下再推}
        - {pick: [上斜哑铃卧推, 上斜杠铃卧推, 下斜俯卧撑, 窄距俯卧撑], sets: 4, reps: "12", note: 上斜 30–45 度，大臂和身体约 45 度}
