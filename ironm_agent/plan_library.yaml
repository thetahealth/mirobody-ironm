  - id: strength-3
    name: 力量为主 · 每周 3 次
    levels: [6m-2y, 2y+]
    goals: [strength]
    people: [adult]
    place: gym
    needs: [杠铃]
    minutes: [60, 90]
    weeks: {3: [深蹲日, 硬拉日, 卧推日]}
    why: 想提高最大重量要以大重量、少次数为主〔K30〕；三大项每周各重练一次、另外两天轻练一次，每个动作每周练到 2 次左右〔K05〕。
    intensity: 主项每组 3–5 次、还剩 1–2 次〔K28〕，组间休息 3 分钟左右〔K03〕；辅助动作 6–10 次。不测极限、不练到力竭，有人保护才做大重量卧推和深蹲〔K27〕。
    progress: 主项每次都能把所有组做完、还剩 1–2 次，下次加 2–5%（一般上肢 2.5 公斤、下肢 5 公斤）〔K03〕；连续两次做不完就退回 10% 重新加〔经验〕。
    deload: 每 4–8 周减量一周，组数减少、重量略降〔K31〕。
    refs: [K03, K05, K27, K28, K30, K31]
    inspired: "r/Fitness Basic Beginner Routine 的线性加重思路：https://thefitness.wiki/routines/r-fitness-basic-beginner-routine/"
    sessions:
      深蹲日:
        - {pick: [杠铃深蹲], sets: 4, reps: "3–5"}
        - {pick: [杠铃卧推], sets: 3, reps: "6–8", note: 比卧推日轻一些}
        - {pick: [杠铃俯身划船, 坐姿绳索划船], sets: 3, reps: "6–10"}
        - {pick: [平板支撑, 健腹轮], sets: 2, reps: "30–45 秒"}
      硬拉日:
        - {pick: [杠铃硬拉], sets: 3, reps: "3–5"}
