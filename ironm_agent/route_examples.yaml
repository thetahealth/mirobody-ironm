# 不请专业角色的问题类型：模型这一路判断；关键字这一路用下面的词兜底
intents:
  chat: [你好, 您好, 在吗, 谢谢, 早上好, 晚上好, 哈哈, 再见, 辛苦了, 加油]
  app: [怎么用, 你能做什么, 你会什么, 你是谁, 什么模型, 功能, 这个app, 这个应用, 怎么设置, 在哪里看]
  out_of_scope: [股票, 股市, 基金, 新闻, 写作业, 写代码, 翻译, 彩票, 电影推荐]
  # 模型判成超出范围、但提到这些词时照样按专业问题处理（spec [2026-10-23] §41）；天气是安排训练的一部分（§34）
  in_scope: [跑步, 跑, 练, 训练, 健身, 运动, 锻炼, 户外, 骑车, 骑行, 游泳, 爬山, 徒步, 跳绳, 打球, 瑜伽, 拉伸,
    吃, 饮食, 热量, 蛋白, 体重, 减脂, 增肌, 睡眠, 天气, 下雨, 下雪, 气温, 温度, 高温, 雾霾, 空气质量, 太热, 太冷,
    这么热, 这么冷]
