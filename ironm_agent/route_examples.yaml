# 路由用的关键字与例句（spec [2026-10-23] §16、§20）：训练教练、营养师、康复恢复师各一份。
# keywords：关键字这一路（BM25）用的词；patterns：常见句式（正则），命中一次算一个关键字；
# examples：语义向量这一路用的例句，按普通人的口语写，专门覆盖容易分错的问法。
# 例句不能和问答考题（evals/qa/cases.yaml）重复，否则测出来的准确率会虚高（有测试检查）。
# 内容由 Claude 整理，待审定。
version: "0.1"
review: claude_draft

