      - "(改成|换成|挪到|调整).{0,8}(周[一二三四五六日天]|计划)"
      - ".{1,8}(怎么做|怎么练|怎么发力|怎么收紧|标准吗|对不对)"
      - "(做|练).{0,6}(的时候|时).{0,10}(疼|酸|不舒服|找不到)"
