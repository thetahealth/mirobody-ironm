[project]
name = "iron-m"
version = "0.1.0"
description = "iron-m：以 mirobody 为数据底座的健身教练 Agent"
requires-python = ">=3.13"
dependencies = [
    "mirobody[app]",
    "openai>=1.50",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.entry-points."mirobody.agents"]
ironm = "ironm_agent.plugin"

# 健身工具登记到 mirobody 的工具登记处：通过 MCP 对外，也给 mirobody 的 Agent 用（spec [2026-10-23] §25）
[project.entry-points."mirobody.tools"]
ironm = "ironm_agent.mcp_tools"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ironm_agent"]

[tool.uv.sources]
mirobody = { path = "vendor/mirobody", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文注释与全角标点不是易混淆字符；行长由格式化工具管，提示词等长文字不强行折行
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["ironm_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mirobody", "mirobody.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
